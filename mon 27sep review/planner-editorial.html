.drawer-head h3{font-size:15px;letter-spacing:-.022em}
.drawer-head .x{margin-left:auto}
.drawer-body{flex:1;min-height:0;overflow:auto;padding:14px 18px}
.drawer-body>*{flex:0 0 auto}
.drawer-foot{flex:0 0 auto;border-top:1px solid var(--line);padding:11px 18px;display:flex;
  align-items:center;gap:8px}
.drawer-foot .clr{margin-right:auto}
.dfld{margin-bottom:13px}
.dfld label{font-size:11.5px;font-weight:600;color:var(--fg-2);display:block;margin-bottom:5px}
.dfld .sel,.dfld .inp{width:100%}

/* ===========================================================================
   MODAL
   ======================================================================== */
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-48%);z-index:220;width:min(540px,93vw);
  background:var(--surface);border-radius:12px;box-shadow:var(--sh-modal);opacity:0;pointer-events:none;
  transition:.18s opacity,.18s transform;max-height:86vh;display:flex;flex-direction:column}
.modal.show{opacity:1;transform:translate(-50%,-50%);pointer-events:auto}
.modal h3{font-size:15px;letter-spacing:-.022em;padding:16px 18px 0}
.modal .msub{font-size:12px;color:var(--muted);padding:3px 18px 0}
.modal .mbody{padding:14px 18px 4px;overflow:auto}
.modal .mfoot{display:flex;gap:8px;justify-content:flex-end;padding:13px 18px 16px;margin-top:4px;
  border-top:1px solid var(--line-2)}
.frow{display:flex;gap:10px;margin-bottom:11px}
.fld{display:flex;flex-direction:column;gap:5px;flex:1;min-width:0}
.fld>label{font-size:10.5px;font-weight:600;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.fld .sel{width:100%}
.kindpick{display:flex;gap:6px;flex-wrap:wrap}
.kindpick button{display:flex;align-items:center;gap:7px;height:30px;padding:0 10px;border-radius:var(--r);
  border:1px solid var(--line);background:var(--surface);font-size:12px;font-weight:500;color:var(--fg-2);
  transition:.14s border-color,.14s background,.14s color}
.kindpick button i{width:3px;height:14px;border-radius:2px;background:var(--k-ink);display:block}
.kindpick button:hover{border-color:var(--line-3);color:var(--fg)}
.kindpick button.on{border-color:var(--k-ink);color:var(--k-ink);background:var(--k-fill)}
.cand{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);
  border-radius:8px;padding:9px 11px;margin-bottom:8px;cursor:pointer;
  transition:.14s border-color,.14s box-shadow}
.cand:hover{border-color:var(--pri-line);box-shadow:var(--sh-xs)}
.cand .c1{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600}
.cand .c1 .eqp{margin-left:auto;font-size:9.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;
  color:var(--muted);border:1px solid var(--line);border-radius:3px;padding:1px 5px;line-height:13px}
.cand .c2{font-size:11px;color:var(--muted);margin-top:3px;font-variant-numeric:tabular-nums}
.cand .c3{font-size:11px;margin-top:3px;font-weight:600}
.cand .c3.ok{color:var(--good)} .cand .c3.no{color:var(--bad)}

/* ===========================================================================
   RESPONSIVE
   ======================================================================== */
@media (max-width:1440px){
  :root{--gut-w:276px}
}
@media (max-width:1240px){
  :root{--gut-w:252px}
  .company-sub{display:none}

const R0=addDays(W0,-7);

const drvBlocks=id=>BLOCKS.filter(b=>b.drv===id).sort((a,b)=>a.s-b.s||a.e-b.e);
const overlaps=(a,b)=>a.s<b.e&&b.s<a.e;
const isLoad=b=>b.kind!=='off'&&b.kind!=='none';
const blockAt=(id,t)=>BLOCKS.find(b=>b.drv===id&&b.s<=t&&b.e>t);

/* a driver is double-booked when two live loads share any minute */
function doubleBooked(id){
  const ls=drvBlocks(id).filter(b=>isLoad(b)&&b.kind!=='cancelled'&&b.kind!=='delivered');
  for(let i=0;i<ls.length;i++)for(let j=i+1;j<ls.length;j++) if(overlaps(ls[i],ls[j])) return true;
  return false;
}
function driverNote(d){
  const b=blockAt(d.id,NOW);
  if(b&&isLoad(b)&&b.kind!=='cancelled') return 'on a load';
  if(b&&b.kind==='off') return b.note||'off duty';
  if(d.openH) return d.openH+'h open';
  return 'available';
}
const isAvailable=d=>{const b=blockAt(d.id,NOW);return !b||!isLoad(b)||b.kind==='cancelled';};

/* committed hours inside a window, clipped to it */
function loadedH(id,a,b){
  return BLOCKS.filter(x=>x.drv===id&&isLoad(x)&&x.kind!=='cancelled'&&x.e>a&&x.s<b)
    .reduce((t,x)=>t+durH(Math.max(x.s,a),Math.min(x.e,b)),0);
}
/* the ELD trace under a row is DERIVED from the blocks rather than authored:
   a load drives for its drivePct then goes on duty, off blocks read OF. */
function eldFor(id){
  const out=[];
  drvBlocks(id).forEach(b=>{
    if(b.kind==='off'){out.push({s:b.s,e:b.e,st:b.note==='Maintenance'?'ON':'OF'});return;}
    if(b.kind==='none'||b.kind==='cancelled')return;
    const span=b.e-b.s, drive=span*(b.drivePct/100);
    out.push({s:b.s,e:new Date(+b.s+drive),st:'D'});
    if(span-drive>1.5*HOUR){
      out.push({s:new Date(+b.s+drive),e:new Date(+b.e-(span-drive)/2),st:'ON'});
      out.push({s:new Date(+b.e-(span-drive)/2),e:b.e,st:'SB'});
    }else out.push({s:new Date(+b.s+drive),e:b.e,st:'ON'});
  });
  return out;
}

/* ===========================================================================
   5. THE BOARD
   Five weeks are always rendered; "Time span" only decides how many of those
   days are wide enough to fill the viewport, and you reach the rest by
   dragging the grid. Every bar's geometry is a percentage of the five-week
   range, so nothing in the layout knows what the span is set to.
   ======================================================================== */
const tlEl=$('#tl'), headEl=$('#tlHead'), bodyEl=$('#tlBody'), innerEl=$('#tlInner'), scEl=$('#tlScroll');
let COLW=170, LANEW=RDAYS*170;

function measure(){
  /* while the board pane is display:none the scroller reports 0 wide; measuring
     then would set a garbage column width that survives the switch back */
  if(!scEl.clientWidth) return false;
  const gut=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--gut-w'))||280;
  const vis=Math.max(240,scEl.clientWidth-gut);
  COLW=Math.max(34,vis/S.span);
  LANEW=COLW*RDAYS;
  innerEl.style.setProperty('--col-w',COLW.toFixed(3)+'px');
  innerEl.style.setProperty('--lane-w',LANEW.toFixed(3)+'px');
  tlEl.classList.toggle('tight',COLW<110);
  return true;
}
/* which slice of the five weeks is actually on screen right now */
function visibleWindow(){
  const gut=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--gut-w'))||280;
  const vis=Math.max(240,scEl.clientWidth-gut);
  const a=+R0+(scEl.scrollLeft/LANEW)*RSPAN;
  const b=a+(vis/LANEW)*RSPAN;
  return [new Date(a),new Date(Math.min(b,+R1))];
}
const days=()=>{const o=[];for(let i=0;i<RDAYS;i++)o.push(addDays(R0,i));return o;};

function renderHead(){
  const ds=days();
  const avail=visibleDrivers().filter(isAvailable).length;
  let h='<div class="gut">'
      + '<div class="g1"><span id="hdCount"></span></div>'
      + '<div class="g2"><em id="hdAvail">'+avail+' available</em> · drag the grid to move</div>'
      + '</div><div class="lane">';
  ds.forEach(d=>{
    const wk=d.getDay()===0||d.getDay()===6, today=sameDay(d,NOW);
    h+='<div class="dayhead'+(wk?' wk':'')+(today?' today':'')+'">'
      + '<div class="dw">'+(today?'Today':DOWL[d.getDay()])+'</div>'
      + '<div class="dd">'+mdy(d)+'</div>'
      + '<div class="ticks"><span>12:00 AM</span><span>12:00 PM</span></div>'
      + '</div>';
  });
  if(NOW>=R0&&NOW<R1) h+='<div class="nowflag" style="left:'+pct(NOW).toFixed(4)+'%"><span>'+ampm(NOW)+'</span></div>';
  h+='</div>';
  headEl.innerHTML=h;
  $('#hdCount').textContent=visibleDrivers().length+' of '+DRIVERS.length+' drivers';
}

function renderBands(){
  const ds=days();
  let h='';
  ds.forEach((d,i)=>{
    const l=(i/RDAYS*100).toFixed(4), w=(100/RDAYS).toFixed(4);
    if(sameDay(d,NOW)) h+='<div class="todaycol" style="left:'+l+'%;width:'+w+'%"></div>';
    else if(d.getDay()===0||d.getDay()===6) h+='<div class="wkend" style="left:'+l+'%;width:'+w+'%"></div>';
    if(i) h+='<div class="gl major" style="left:'+l+'%"></div>';
    h+='<div class="gl" style="left:'+((i+.5)/RDAYS*100).toFixed(4)+'%"></div>';
  });
  if(NOW>=R0&&NOW<R1) h+='<div class="now" style="left:'+pct(NOW).toFixed(4)+'%"></div>';
  return '<div class="bands" aria-hidden="true">'+h+'</div>';
}

/* greedy track packing, so two overlapping loads never paint on top of one
   another. Track 0 is what a collapsed row shows. */
function pack(bs){
  const ends=[];
  bs.forEach(b=>{
    let t=ends.findIndex(e=>e<=b.s);
    if(t<0){t=ends.length;ends.push(0);}
    ends[t]=b.e; b._t=t;
  });
  return Math.max(1,ends.length);
}

function barHTML(b,open){
  const l=Math.max(0,pct(b.s)), r=Math.min(100,pct(b.e));
  const w=Math.max(.06,r-l);
  const wpx=w/100*LANEW;
  const ld=b.ref?LOADS[b.ref]:null;
  let cls='bar k-'+b.kind;
  if(S.milesColor&&b.drivePct) cls+=' shaded';
  if(wpx<150) cls+='';
  if(wpx<128) cls+=' narrow';
  if(wpx<72)  cls+=' tiny';
  if(S.sel&&S.sel.t==='block'&&S.sel.id===b.id) cls+=' sel';
  const top=8+b._t*(S.expandRows?46:32);
  const tip=esc(blockTitle(b)+'  ·  '+statusOf(b)+'  ·  '+dlong(b.s)+' → '+dlong(b.e)
      +'  ·  '+fmtH(durH(b.s,b.e)));
  let inner;
  if(ld){
    inner='<div class="b1"><span class="org">'+esc(ld.o)+'</span>'
        + '<span class="ref">'+b.ref+'</span>'
        + '<span class="dst">'+esc(ld.d)+'</span></div>'
        + (S.expandRows?'<div class="b2">'+esc(ld.cust)+' · '+ld.mi.toLocaleString()+' mi · '
            +money(ld.rate)+' · '+b.drivePct+'% driving</div>':'');
  }else{
    inner='<div class="b1"><span class="org">'+esc(b.note||KINDS[b.kind].lab)+'</span></div>'
        + (S.expandRows?'<div class="b2">'+fmtH(durH(b.s,b.e))+' · '+dlong(b.s)+'</div>':'');
  }
  /* the window used to be captioned above the bar and repeated in a native
     title tooltip; the hover card says all of it and more, so the bar keeps
     the string only as its accessible name */
  return '<div class="'+cls+'" data-blk="'+b.id+'" tabindex="0" role="button" aria-label="'+tip+'" '
    + 'style="left:calc('+l.toFixed(4)+'% + 1px);width:calc('+w.toFixed(4)+'% - 2px);top:'+top+'px;'
    + '--drive:'+(b.drivePct||0)+'%">'
    + '<div class="bw">'+inner+'</div></div>';
}
const toneVar=k=>({transit:'tran-ink',late:'late-ink',sent:'sent-ink',plan:'plan-ink',conf:'plan-ink',
  delivered:'deliv-ink',cancelled:'canc-ink',hold:'hold-ink',off:'off-ink',none:'none-ink'})[k];

/* free gaps wide enough to drop a load into get a + affordance */
function gapAdds(bs,rowTop){
  const busy=bs.filter(b=>b.kind!=='none').map(b=>[+b.s,+b.e]).sort((a,b)=>a[0]-b[0]);
  const merged=[];
  busy.forEach(x=>{const last=merged[merged.length-1];
    if(last&&x[0]<=last[1]) last[1]=Math.max(last[1],x[1]); else merged.push([x[0],x[1]]);});
  const gaps=[]; let cur=+R0;
  merged.forEach(m=>{if(m[0]-cur>6*HOUR) gaps.push([cur,m[0]]); cur=Math.max(cur,m[1]);});
  if(+R1-cur>6*HOUR) gaps.push([cur,+R1]);
  return gaps.slice(0,14).map(g=>{
    const mid=(g[0]+g[1])/2;
    return '<button class="dayadd" data-gap="'+g[0]+'" style="left:calc('+pct(new Date(mid)).toFixed(4)
      +'% - 10px);top:'+rowTop+'px" title="Schedule here" aria-label="Schedule here">'+svg('plus',11,2.4)+'</button>';
  }).join('');
}

function hosHTML(id){
  let h='';
  if(S.showEld) eldFor(id).forEach(e=>{
    const l=Math.max(0,pct(e.s)), r=Math.min(100,pct(e.e));
    if(r-l<=0) return;
    h+='<div class="eld e-'+e.st+'" style="left:'+l.toFixed(4)+'%;width:'+(r-l).toFixed(4)+'%"></div>';
  });
  FUEL.filter(f=>f.drv===id).forEach(f=>{
    if((f.ok&&!S.fuelOn)||(!f.ok&&!S.fuelBad)) return;
    h+='<div class="fuel'+(f.ok?'':' bad')+'" style="left:'+pct(f.t).toFixed(4)+'%" title="'
      + esc((f.ok?'Fuel on duty':'Fuel while driving, sleeping or off duty')
        +'  ·  '+f.city+'  ·  '+dlong(f.t)+'  ·  '+f.gal.toFixed(1)+' gal  '+money(f.amt)
        +'  ·  card '+f.card+'  ·  '+f.ref)+'">'+svg('fuel',10,1.9)+'</div>';
  });
  return h?'<div class="hos">'+h+'</div>':'';
}

   +      gf('Dispatcher',esc(d.disp))+gf('Board',esc(d.board))

function renderBody(){
  const ds=visibleDrivers();
  let h=renderBands();
  ds.forEach(d=>{
    const all=drvBlocks(d.id);
    const tracks=pack(all);
    const open=S.openStacks.has(d.id);
    const shown=open?all:all.filter(b=>b._t===0);
    const hidden=all.length-shown.length;
    const rowTracks=open?tracks:1;
    const barH=S.expandRows?46:32;
    const rowH=Math.max(S.openCards.has(d.id)?254:78, 16+rowTracks*barH+22);
    const barTop=8;

    let bars=shown.map(b=>barHTML(b,open)).join('');
    /* the stack badge sits just OUTSIDE the bar that is hiding others, in
       whatever open timeline follows it — never on top of the bar's own
       label. Sitting on the corner (the original design) looked fine on a
       wide bar with room to spare, but every load in this fleet shares the
       same origin city, so a narrow bar hides its destination text via
       .narrow .dst{display:none} and shows nothing BUT that origin — which
       put the badge squarely on the one piece of text the bar had left. */
    if(!open&&hidden>0){
      const t0=all.filter(b=>b._t===0);
      const marks=[];
      t0.forEach((b,idx)=>{
        const n=all.filter(x=>x._t>0&&overlaps(x,b)).length;
        if(n) marks.push({b,n,idx});
      });
      marks.slice(0,4).forEach(m=>{
        const digits=String(m.n).length, W=24+8*(digits-1), GAP=4;
        const barLpx=pct(m.b.s)/100*LANEW, barRpx=Math.min(100,pct(m.b.e))/100*LANEW;
        const next=t0[m.idx+1];
        const ceilingPx=next?pct(next.s)/100*LANEW-GAP:LANEW-2;
        /* preferred: just past the bar's own right edge, in open time */
        let leftPx=Math.min(barRpx+GAP,ceilingPx-W);
        /* no room before the next bar (or the lane ends) — settle for the
           bar's own corner rather than crowd into whatever comes next */
        leftPx=Math.max(leftPx,barLpx,Math.min(barRpx-W,ceilingPx-W));
        bars+='<button class="stackn" data-stack="'+d.id+'" style="left:'+leftPx.toFixed(1)
          +'px;top:'+(barTop+5)+'px" title="'+m.n+' more load'+(m.n>1?'s':'')+' underneath">+'+m.n+'</button>';
      });
    }
    h+='<div class="row'+(S.sel&&S.sel.t==='block'&&all.some(b=>b.id===S.sel.id)?' sel':'')
      + (S.armed?' armed':'')+'" data-drv="'+d.id+'" style="min-height:'+rowH+'px">'
      + gutterHTML(d)
      + '<div class="lane">'+bars+gapAdds(all,rowH-30)+hosHTML(d.id)+'</div>'
      + '</div>';
  });
  if(!ds.length) h+='<div class="empty" style="padding:56px 18px">'+svg('filter',22,1.6)
      +'<div class="t">No drivers match the board filter</div>'
      +'<div class="d">Clear a facet, or switch the scope back to All drivers.</div></div>';
  bodyEl.innerHTML=h;
  bodyEl.classList.add('fresh');
  setTimeout(()=>bodyEl.classList.remove('fresh'),380);
}

/* ---- roster scope, search and sort -------------------------------------- */
function visibleDrivers(){
  const q=S.q.trim().toLowerCase();
  let out=DRIVERS.filter(d=>{
    if(S.onlyAvail&&!isAvailable(d)) return false;
    if(S.scope==='free'&&!d.openH) return false;
    if(S.scope==='double'&&!doubleBooked(d.id)) return false;
    if(['D','ON','OF','SB'].includes(S.scope)&&d.duty!==S.scope) return false;
    const f=S.flt;
    if(f.team&&d.team!==f.team) return false;
    if(f.disp&&d.disp!==f.disp) return false;
    if(f.carrier&&d.carrier!==f.carrier) return false;
    if(f.equipment&&d.eq!==f.equipment) return false;
    if(f.driver&&d.id!==f.driver) return false;
    if(f.term&&d.term!==f.term) return false;
    if(f.status&&d.duty!==f.status) return false;
    if(q){
      const hay=(d.name+' '+d.city+' '+d.truck+' '+d.trailer+' '+d.eq+' '+d.disp+' '+d.carrier+' '
        +drvBlocks(d.id).map(b=>(b.ref||'')+' '+(b.ref&&LOADS[b.ref]?LOADS[b.ref].cust+' '+LOADS[b.ref].o+' '+LOADS[b.ref].d:'')+' '+(b.note||'')).join(' ')).toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
  const [a,b]=[R0,R1];
  const by={
    name:(x,y)=>x.name.localeCompare(y.name),
    dom:(x,y)=>x.city.localeCompare(y.city)||x.name.localeCompare(y.name),
    eq:(x,y)=>x.eq.localeCompare(y.eq)||x.name.localeCompare(y.name),
    open:(x,y)=>(y.openH||0)-(x.openH||0)||loadedH(x.id,a,b)-loadedH(y.id,a,b),
    busy:(x,y)=>loadedH(y.id,a,b)-loadedH(x.id,a,b),
    duty:(x,y)=>['D','ON','SB','OF'].indexOf(x.duty)-['D','ON','SB','OF'].indexOf(y.duty)||x.name.localeCompare(y.name)
  }[S.sort];
  return out.sort(by);
}

/* The label is named in whole days. visibleWindow() is millisecond-accurate
   because the anchors need it, but scrollLeft is an integer, so a snapped
   window lands ~75s past midnight and a naive label reads one day long. */
let LASTDAYS=null;
function visibleDays(){
  /* on the loads pane the scroller is display:none and reports 0 wide, which
     would collapse the range to the first rendered day — the topbar pill still
     shows it, so hold the last real answer instead */
  if(!scEl.clientWidth&&LASTDAYS) return LASTDAYS;
  const gut=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--gut-w'))||280;
  const vis=Math.max(240,scEl.clientWidth-gut);
  const i0=Math.max(0,Math.round(scEl.scrollLeft/COLW));
  const n=Math.max(1,Math.round(vis/COLW));
  return LASTDAYS=[addDays(R0,i0),addDays(R0,Math.min(RDAYS-1,i0+n-1))];
}
function renderMasthead(){
  const [a,last]=visibleDays();
  $('#periodLbl').textContent=DOW[a.getDay()]+' '+mdy(a)+' – '+DOW[last.getDay()]+' '+mdy(last);
  $('#ctxPill').innerHTML=svg('cal',12,1.9)+'<span>Scheduler planner · <b>'+mdy(a)+'</b> to <b>'+mdy(last)+'</b></span>';

  const ds=visibleDrivers();
  const scheduled=BLOCKS.filter(x=>isLoad(x)&&ds.some(d=>d.id===x.drv)).length;
  $('#boardCounts').innerHTML='Showing <b>'+ds.length+'</b> of <b>'+DRIVERS.length+'</b> drivers'
    + '<i>·</i><b>'+scheduled+'</b> scheduled<i>·</i><em>'+POOL.length+' waiting</em>';
  $('#phMeta').innerHTML='<span><b>'+ds.length+'</b> drivers on the board</span><i>/</i>'
    + '<span><b>'+scheduled+'</b> loads scheduled</span><i>/</i>'
    + '<span><b>'+POOL.length+'</b> awaiting a truck</span>';
  $('#nowNow').innerHTML='Current time <b>'+DOW[NOW.getDay()]+' '+mdy(NOW)+' '+ampm(NOW)+'</b>';

  const hold=BLOCKS.filter(x=>x.kind==='hold').length;
  const late=BLOCKS.filter(x=>x.kind==='late').length;
  const pill=$('#alarmPill');
  const bad=hold+late+POOL.length;
  pill.className='alarm-pill'+(bad?'':' calm');
  pill.innerHTML=svg(bad?'alert':'check',13,2)
    + '<span>'+hold+' on hold <i>·</i> '+late+' late <i>·</i> '+POOL.length+' waiting</span>';

  /* the pane tabs carry the one number that decides whether you need them */
  const excs=exceptions(), sev=excs.filter(x=>x.sev==='sev').length;
  const cp=$('#cntPane');
  cp.textContent=POOL.length+excs.length;
  cp.classList.toggle('alarm',sev>0);
  /* the note that used to sit here said what the tab badge, the alarm pill and
     the optbar counts already say three other ways — the row carries the clock
     instead, which nothing else on the page states */

  const nf=Object.entries(S.flt).filter(([k,v])=>v&&!(k==='eld'&&v==='No')).length;
  $('#btnFilters').innerHTML=svg('filter',14,1.9)+'<span>Filters</span>'+(nf?'<span class="cnt">'+nf+'</span>':'');
  syncSpan();
  $('#selSort').value=S.sort; $('#selScope').value=S.scope;
  $('#optAvail').checked=S.onlyAvail; $('#optExpand').checked=S.expandRows; $('#optMiles').checked=S.milesColor;
}

function renderStrip(){
  const ds=visibleDrivers();
  const wk=[W0,addDays(W0,7)];
  const onRoad=ds.filter(d=>{const b=blockAt(d.id,NOW);return b&&isLoad(b)&&b.kind!=='cancelled';}).length;
  const wkBlocks=BLOCKS.filter(x=>isLoad(x)&&x.e>wk[0]&&x.s<wk[1]&&ds.some(d=>d.id===x.drv));
  const rev=wkBlocks.filter(x=>x.kind!=='cancelled').reduce((t,x)=>t+(LOADS[x.ref]?LOADS[x.ref].rate:0),0);
  const mi=wkBlocks.filter(x=>x.kind!=='cancelled').reduce((t,x)=>t+(LOADS[x.ref]?LOADS[x.ref].mi:0),0);
  const capH=ds.length*7*14;
  const usedH=ds.reduce((t,d)=>t+loadedH(d.id,wk[0],wk[1]),0);
  const util=capH?Math.min(100,Math.round(usedH/capH*100)):0;
  const dbl=ds.filter(d=>doubleBooked(d.id)).length;
  const late=BLOCKS.filter(x=>x.kind==='late').length;

  const stat=(k,v,d,cls)=>'<div class="stat'+(cls?' '+cls:'')+'"><div class="k">'+k+'</div>'
    +'<div class="v">'+v+'</div><div class="d">'+d+'</div></div>';
  let h='';
  h+=stat('On the road',onRoad,'of '+ds.length+' drivers');
  h+=stat('Loads this week',wkBlocks.length,ds.filter(isAvailable).length+' drivers free');
  h+=stat('Waiting',POOL.length,POOL.length?'needs a truck':'board is clear',POOL.length?'warn':'good');
  h+=stat('Utilisation',util+'<span class="u">%</span>',Math.round(usedH).toLocaleString()+' of '+capH.toLocaleString()+' h');
  h+=stat('Booked revenue',money0(rev),mi.toLocaleString()+' mi · '+money2(mi?rev/mi:0)+'/mi');
  h+=stat('Running late',late,dbl+' double-booked',(late+dbl)?'bad':'good');

  let bars='';const per=[];let maxr=.35;
  for(let i=0;i<7;i++){
    const a=addDays(W0,i),b=addDays(a,1);
    const used=ds.reduce((t,d)=>t+loadedH(d.id,a,b),0), cap=ds.length*14;
    const r=cap?used/cap:0; maxr=Math.max(maxr,r); per.push({a,r});
  }
  per.forEach(p=>{
    const hgt=Math.max(2,Math.round(p.r/maxr*27));
    bars+='<div class="covbar'+(p.a.getDay()===0||p.a.getDay()===6?' wk':'')+(p.r>.92?' over':'')
      +(sameDay(p.a,NOW)?' today':'')+'" title="'+DOWL[p.a.getDay()]+' '+mdy(p.a)+' — '
      +Math.round(p.r*100)+'% of duty capacity"><div class="b" style="height:'+hgt+'px"></div>'
      +'<div class="t">'+DOW1[p.a.getDay()]+'</div></div>';
  });
  h+='<div class="cover"><div class="lab">Coverage</div><div class="covbars">'+bars+'</div></div>';
  $('#strip').innerHTML=h;
}

function poolSorted(){
  const q=S.poolQ.trim().toLowerCase();
  let out=POOL.map(r=>LOADS[r]).filter(Boolean);
  if(q) out=out.filter(l=>(l.ref+' '+l.cust+' '+l.o+' '+l.d+' '+l.eq).toLowerCase().includes(q));
  const planH=l=>Math.max(6,Math.round(l.mi/45));
  return out.sort({pick:(a,b)=>puOf(a)-puOf(b),rate:(a,b)=>(b.rate/b.mi)-(a.rate/a.mi),
                   rev:(a,b)=>b.rate-a.rate,mi:(a,b)=>b.mi-a.mi}[S.poolSort]);
}
/* a waiting load's pickup is derived from its ref so the demo is stable */
const PU={};
POOL.forEach((r,i)=>{PU[r]=at(4+Math.floor(i/3),[7,9,6,12,5,8,14][i%7]);});
const puOf=l=>PU[l.ref]||at(5,8);
const planHOf=l=>Math.max(6,Math.round(l.mi/45));

    +   (urg?'<span class="wl-urg '+urg+'">'+(h<0?'Pickup passed':h<24?'Covers in '+Math.round(h)+'h':'Covers in '+Math.round(h/24)+'d')+'</span>':'')
    + '</td>'

function exceptions(){
  const out=[];
  BLOCKS.filter(b=>b.kind==='late').forEach(b=>out.push({sev:'sev',ico:'alert',
    t:'Load is running late',d:DRV[b.drv].name+' · '+b.ref+' · due '+dlong(b.e),blk:b.id}));
  BLOCKS.filter(b=>b.kind==='hold').forEach(b=>out.push({sev:'sev',ico:'pause',
    t:'Load is on hold',d:DRV[b.drv].name+' · '+b.ref+' · '+LOADS[b.ref].cust,blk:b.id}));
  DRIVERS.forEach(d=>{ if(doubleBooked(d.id)) out.push({sev:'sev',ico:'target',
    t:'Driver is double-booked',d:d.name+' · two live loads share the same hours',drv:d.id}); });
  FUEL.filter(f=>!f.ok).forEach(f=>out.push({sev:'mid',ico:'fuel',
    t:'Fuel bought off duty',d:DRV[f.drv].name+' · '+f.city+' · <b>'+money(f.amt)+'</b> · '+dlong(f.t),drv:f.drv}));
  DRIVERS.forEach(d=>{ if(d.drive>=10) out.push({sev:'mid',ico:'clock',
    t:'Driving limit within the hour',d:d.name+' · <b>'+d.drive.toFixed(2)+'</b> of 11 h',drv:d.id}); });
  POOL.map(r=>LOADS[r]).forEach(l=>{const h=(puOf(l)-NOW)/HOUR;
    if(h<24) out.push({sev:h<12?'sev':'mid',ico:'inbox',t:'Uncovered inside '+(h<12?'12':'24')+' hours',
      d:l.ref+' · '+l.o+' → '+l.d+' · picks <b>'+dlong(puOf(l))+'</b>',load:l.ref});});
  const rank={sev:0,mid:1};
  return out.sort((a,b)=>rank[a.sev]-rank[b.sev]);
}

function renderWaiting(){

/* The drawer floats over the board, so nothing here re-lays the grid out.
   The record reads top-down: what state it is in, what it is, what it pays,
   when it runs, who is on it, where it stops, what it earns. */
const bdEl=$('#bd');
const KVAR=k=>({transit:'tran',late:'late',sent:'sent',plan:'plan',conf:'plan',delivered:'deliv',
  cancelled:'canc',hold:'hold',off:'off',none:'none'})[k];

function renderDetails(){
  const top=$('#bdTop'), body=$('#bdBody'), foot=$('#bdFoot');
  const open=!!S.sel;
  bdEl.classList.toggle('show',open);
  bdEl.setAttribute('aria-hidden',String(!open));
  if(!open){
    top.innerHTML=''; foot.innerHTML='';
    body.innerHTML='<div class="bd-empty">'+svg('eye',24,1.6)
      +'<div class="t">Nothing selected</div>'
      +'<div class="d">Click a bar on the board to see the load, the driver and what it pays.</div></div>';
    return;
  }

  const isBlk=S.sel.t==='block';
  const b=isBlk?BLOCKS.find(x=>x.id===S.sel.id):null;
  if(isBlk&&!b){S.sel=null;return renderDetails();}
  const l=isBlk?(b.ref?LOADS[b.ref]:null):LOADS[S.sel.id];
  const d=b?DRV[b.drv]:null;
  const kind=b?b.kind:'plan';
  const base=KVAR(kind);
  const tone='--k-ink:var(--'+toneVar(kind)+');--k-line:var(--'+base+'-line);--k-fill:var(--'+base+'-fill)';
  bdEl.setAttribute('style',tone);

  /* ---- the state band, the identity block and the three figures ---- */
  let h='<div class="bd-state"><span class="dot"></span>'
    + '<span class="lab">'+esc(b?KINDS[kind].lab:'Waiting on a driver')+'</span>'
    + '<button class="btn sm bare ic x" id="bdClose" aria-label="Close details">'+svg('x',14,2)+'</button>'
    + '</div>';

  h+='<div class="bd-id">';
  if(l){
    h+='<div class="bd-eyebrow"><span class="bd-ref">'+l.ref+'</span>'
     + '<span class="bd-eq">'+esc(l.eq)+'</span></div>'
     + '<div class="bd-title">'+esc(l.o)+svg('arrow',14,2)+esc(l.d)+'</div>'
     + '<div class="bd-cust">'+esc(l.cust)+'</div>';
  }else{
    h+='<div class="bd-eyebrow"><span class="bd-ref">'+(d?d.truck:'—')+'</span>'
     + '<span class="bd-eq">'+esc(b&&b.kind==='none'?'Open':'Non-revenue')+'</span></div>'
     + '<div class="bd-title">'+esc(b.note||KINDS[kind].lab)+'</div>'
     + '<div class="bd-cust">'+esc(d?d.name:'')+'</div>';
  }
  h+='</div>';

  const tile=(k,v)=>'<div class="bd-tile"><div class="k">'+k+'</div><div class="v">'+v+'</div></div>';
  if(l){
    h+='<div class="bd-tiles">'+tile('Linehaul',money0(l.rate))
      + tile('Distance',l.mi.toLocaleString()+' <small>mi</small>')
      + tile('Per mile',money2(l.rate/l.mi))+'</div>';
  }else if(b){
    h+='<div class="bd-tiles">'+tile('Duration',fmtH(durH(b.s,b.e)))
      + tile('Starts',ampm(b.s))+tile('Ends',ampm(b.e))+'</div>';

  top.innerHTML=h;

  /* ---- the body ---- */
  let c='';
  const flagTxt=b&&isLoad(b)&&doubleBooked(b.drv)

    : (b&&b.kind==='late'?['Running behind the delivery window','The ETA is past the appointment. Call the driver or reset the appointment.']
    : (b&&b.kind==='hold'?['This load is on hold','Nothing moves until the hold is cleared with the customer.']:null));
  if(flagTxt) c+='<div class="bd-flag">'+svg('alert',14,2)
    + '<div><div class="ft">'+esc(flagTxt[0])+'</div><div class="fd">'+esc(flagTxt[1])+'</div></div></div>';

  if(b){
    const dp=b.drivePct||0;
    c+='<div class="bd-sect"><h6>Window</h6>'
     + '<div class="bd-when"><b>'+dlong(b.s)+'</b><span class="arr">→</span><b>'+dlong(b.e)+'</b></div>'
     + (dp?'<div class="bd-meter"><div class="t"><i style="width:'+dp+'%"></i></div>'

     + planHOf(l)+' hours</b></span></div></div></div>';
  }

  if(d){
    c+='<div class="bd-sect"><h6>Driver</h6><div class="bd-driver">'
     + '<div class="av'+(d.duty==='D'||d.duty==='ON'?' on':'')+'">'+d.init+'</div>'
     + '<div style="min-width:0"><div class="nm">'+esc(d.name)
     +   '<span class="duty d-'+d.duty+'">'+d.duty+'</span></div>'
     + '<div class="l2">'+esc(d.city)+' · '+esc(d.eq)+'</div>'
     + '<div class="l3">'+d.truck+' / '+d.trailer+' · '+d.drive.toFixed(2)+' drive / '
     +   d.onduty.toFixed(2)+' duty · '+esc(d.phone)+'</div>'
     + '</div></div></div>';

  if(l){
    const fuelStop=FUEL.find(x=>x.ref===l.ref);
    const t0=b?b.s:puOf(l), t2=b?b.e:new Date(+puOf(l)+planHOf(l)*HOUR);
    const t1=new Date(+t0+(t2-t0)*0.45);
    c+='<div class="bd-sect"><h6>Stops</h6><div class="stops">'
     + stopRow('Pickup',l.o,t0)

     + stopRow('Delivery',l.d,t2)
     + '</div></div>';

    const fuel=Math.round(l.mi*0.42), pay=Math.round(l.mi*0.62), marg=l.rate-fuel-pay;
    c+='<div class="bd-sect"><h6>Margin</h6><div class="bd-led">'
     + row('Linehaul',money(l.rate))

    c+='<div class="bd-sect"><h6>Dispatch</h6><div class="bd-grid">'
     + f('Dispatcher',esc(l.disp))+f('Board',d?esc(d.board):'—')

     + f('Team',d?esc(d.team):'—')+f('Equipment',esc(l.eq))
     + '</div></div>';
  }else if(b){
    c+='<div class="bd-sect"><h6>Dispatch</h6><div class="bd-grid">'
     + f('Entry',esc(b.note||KINDS[kind].lab))+f('Duty now',d.duty)
     + f('Dispatcher',esc(d.disp))+f('Board',esc(d.board))
     + f('Carrier',esc(d.carrier))+f('Terminal',esc(d.term))
     + '</div></div>';
  }
  body.innerHTML=c;
  body.scrollTop=0;

  /* ---- the actions ---- */
  if(b&&b.ref){
    foot.innerHTML='<button class="btn sm pri" data-act="edit">'+svg('ext',14,1.9)+'Open in Edit Load</button>'
      + '<button class="btn sm" data-act="track">'+svg('pin',14,1.9)+'Track load</button>'
      + '<button class="btn sm danger ic" data-act="return" title="Return to open loads" aria-label="Return to open loads">'+svg('undo',14,1.9)+'</button>';
  }else if(b){
    foot.innerHTML='<button class="btn sm" data-act="editblk">'+svg('edit',14,1.9)+'Edit entry</button>'
      + '<button class="btn sm danger ic" data-act="del" title="Remove" aria-label="Remove">'+svg('trash',14,1.9)+'</button>';
  }else{
    foot.innerHTML='<button class="btn sm pri" data-act="assignload">'+svg('plus',14,2)+'Assign to a driver</button>'
      + '<button class="btn sm" data-act="pick">'+svg('target',14,1.9)+'Pick for the board</button>';
  }

  function f(k,v){return '<dl class="bd-f"><dt>'+k+'</dt><dd>'+v+'</dd></dl>';}
  function row(k,v){return '<div class="r"><span>'+k+'</span><span>'+v+'</span></div>';}
  function stopRow(kind,place,t){
    const done=t<NOW;
    return '<div class="stop'+(done?' done':' next')+'">'
      + '<div class="sh"><span class="sn">'+esc(place)+'</span><span class="sk">'+kind+'</span></div>'
      + '<div class="sd"><b>'+dlong(t)+'</b>'+(done?' · complete':'')+'</div></div>';
  }
}

bdEl.addEventListener('click',e=>{ if(e.target.closest('#bdClose')){

const toastEl=$('#toast'); let toastT=null;
function toast(msg,undo){
  toastEl.innerHTML='<span>'+msg+'</span>'+(undo?'<button class="undo">Undo</button>':'');
  toastEl.classList.add('show');
  if(undo) toastEl.querySelector('.undo').onclick=()=>{undo();toastEl.classList.remove('show');};
  clearTimeout(toastT);
  toastT=setTimeout(()=>toastEl.classList.remove('show'),undo?6500:2600);
}

/* ===========================================================================
   10. MUTATIONS
   ======================================================================== */
function renderAll(){measure();renderMasthead();renderStrip();renderHead();renderBody();
  renderWaiting();renderDetails();renderArm();}
function renderSoft(){renderMasthead();renderStrip();renderBody();renderWaiting();renderDetails();renderArm();}

/* ---- the two top-level panes --------------------------------------------
   The board's scroll position is kept across a switch: display:none drops it,
   and re-measuring on the way back is what stops the columns collapsing. */
function setPane(p,quiet){
  if(p===S.pane&&!quiet) return;
  /* remember WHEN the board was looking at, not how far it was scrolled: the
     column width can differ by the width of a scrollbar on the way back, and
     restoring raw pixels then lands on a different day */
  if(S.pane==='board'&&scEl.clientWidth) S._anchor=visibleWindow()[0];
  S.pane=p;
  document.body.dataset.pane=p;
  $('#paneBoard').classList.toggle('hide',p!=='board');
  $('#paneLoads').classList.toggle('hide',p!=='loads');
  $('#paneTrack').classList.toggle('hide',p!=='track');
  $$('#viewTabs button').forEach(b=>{const on=b.dataset.pane===p;
    b.classList.toggle('on',on); b.setAttribute('aria-selected',String(on));});
  if(p==='board'){
    measure(); renderHead(); renderBody();
    if(S._anchor) scEl.scrollLeft=pct(S._anchor)/100*LANEW;
    snapCols(); renderMasthead();
  }else if(p==='track'){ renderTrack(); }
  else{ renderWaiting(); renderMasthead(); }
}
$('#viewTabs').addEventListener('click',e=>{const b=e.target.closest('[data-pane]');
  if(b) setPane(b.dataset.pane);});

function renderArm(){
  const bar=$('#armBar');
  document.body.classList.toggle('arming',!!S.armed);
  if(!S.armed){bar.classList.add('hide');return;}
  const l=LOADS[S.armed];
  bar.classList.remove('hide');
  bar.innerHTML='<span class="ai">'+svg('target',15,1.9)+'</span>'
    + '<span>Scheduling <b>'+l.ref+'</b> ('+esc(l.o)+' → '+esc(l.d)+', '+planHOf(l)+'h). '
    + '<span class="hint">Click open time on a row, or the + beside a driver’s name.</span></span>'
    + '<button class="btn sm" id="armCancel">Cancel</button>';
}

function place(ref,drvId,start){
  const l=LOADS[ref]; if(!l) return;
  const dur=planHOf(l)*HOUR;
  const b={id:'b'+(++SEQ),drv:drvId,kind:'plan',s:new Date(start),e:new Date(+start+dur),
           ref:ref,note:null,drivePct:66};
  BLOCKS.push(b);
  POOL=POOL.filter(r=>r!==ref);
  S.armed=null; S.picked=null;
  const clash=BLOCKS.some(x=>x!==b&&x.drv===drvId&&isLoad(x)&&x.kind!=='cancelled'&&overlaps(x,b));
  const eqBad=DRV[drvId].eq!==l.eq;
  S.sel={t:'block',id:b.id};
  renderSoft();
  toast('<b>'+ref+'</b> preplanned on '+esc(DRV[drvId].name)+' — '+dlong(b.s)
    + (clash?' · <b>overlaps an existing load</b>':'')
    + (eqBad?' · <b>needs a '+l.eq+'</b>':''),
    ()=>{BLOCKS=BLOCKS.filter(x=>x!==b);POOL.unshift(ref);S.sel=null;renderSoft();});
}
function firstOpening(drvId,hours){
  const bs=drvBlocks(drvId).filter(b=>b.kind!=='none').map(b=>[+b.s,+b.e]).sort((a,b)=>a[0]-b[0]);
  const need=hours*HOUR;
  let cur=Math.max(+NOW,+R0);
  for(const m of bs){ if(m[0]-cur>=need) return new Date(cur); cur=Math.max(cur,m[1]); }
  return new Date(cur);
}
function returnToPool(id){
  const i=BLOCKS.findIndex(x=>x.id===id); if(i<0) return;
  const b=BLOCKS[i]; BLOCKS.splice(i,1);
  if(b.ref&&!POOL.includes(b.ref)){POOL.unshift(b.ref); PU[b.ref]=b.s;}
  S.sel=null; renderSoft();
  toast(b.ref?'<b>'+b.ref+'</b> returned to open loads':'Entry removed',
    ()=>{BLOCKS.splice(i,0,b); if(b.ref) POOL=POOL.filter(r=>r!==b.ref); renderSoft();});
}
function moveBlock(b,newStart,newDrv){
  const old={s:b.s,e:b.e,drv:b.drv}, dur=b.e-b.s;
  b.s=new Date(newStart); b.e=new Date(+newStart+dur);
  if(newDrv) b.drv=newDrv;
  const clash=BLOCKS.some(x=>x!==b&&x.drv===b.drv&&isLoad(x)&&isLoad(b)&&overlaps(x,b));
  renderSoft();
  toast((b.ref?'<b>'+b.ref+'</b>':'Entry')+' moved'
    + (newDrv&&newDrv!==old.drv?' to '+esc(DRV[newDrv].name):'')+' — '+dlong(b.s)
    + (clash?' · <b>overlaps an existing load</b>':''),
    ()=>{b.s=old.s;b.e=old.e;b.drv=old.drv;renderSoft();});
}

/* ===========================================================================
   11. POINTER: pan the grid, drag a bar, pull a waiting load onto the board
   One engine, four gestures. Nothing uses HTML5 drag-and-drop, so the preview
   can be a real bar rather than a browser screenshot of one.
   ======================================================================== */
const MINDUR=2*HOUR;
let DRAG=null, justDragged=false;

const snap=()=>COLW>=420?15*60e3:COLW>=170?30*60e3:COLW>=80?HOUR:3*HOUR;
function timeAt(row,clientX){
  const lane=row.querySelector('.lane'), rc=lane.getBoundingClientRect();
  const f=Math.max(0,Math.min(1,(clientX-rc.left)/rc.width));
  const sn=snap();
  return new Date(Math.round((+R0+f*RSPAN)/sn)*sn);
}
const rowUnder=(x,y)=>{const el=document.elementFromPoint(x,y);return el?el.closest('.row'):null;};
function clearDrop(){ if(DRAG&&DRAG.dropEl&&DRAG.dropEl.parentNode) DRAG.dropEl.remove();
  if(DRAG) DRAG.dropEl=null; $$('.row.drop').forEach(r=>r.classList.remove('drop')); }
function placeDrop(row,s,e,label,bad){
  clearDrop(); if(!row) return;
  const lane=row.querySelector('.lane');
  const l=Math.max(0,pct(s)), r=Math.min(100,pct(e));
  const el=document.createElement('div');
  el.className='dropline'+(bad?' bad':'');
  el.style.left='calc('+l.toFixed(4)+'% + 1px)';
  el.style.width='calc('+Math.max(.08,r-l).toFixed(4)+'% - 2px)';
  el.style.top='8px'; el.textContent=label;
  lane.appendChild(el); DRAG.dropEl=el; row.classList.add('drop');
}
function startDrag(e,spec){ if(e.button!==0) return;
  DRAG=Object.assign({x0:e.clientX,y0:e.clientY,active:false},spec);
  window.addEventListener('pointermove',onMove);
  window.addEventListener('pointerup',onUp,{once:true});
}
function onMove(e){
  if(!DRAG) return;
  if(!DRAG.active){
    if(Math.abs(e.clientX-DRAG.x0)+Math.abs(e.clientY-DRAG.y0)<5) return;
    DRAG.active=true;
    if(DRAG.mode==='pan'){scEl.classList.add('grabbing');}
    else{
      document.body.classList.add('dragging');
      if(DRAG.mode==='pool'){
        const l=LOADS[DRAG.ref];
        const g=document.createElement('div'); g.className='ghost'; g.style.width='230px';
        g.innerHTML='<div class="bar k-plan" style="position:static;width:100%;--k-ink:var(--plan-ink);'
          +'--k-line:var(--plan-line);--k-fill:var(--plan-fill)"><div class="bw"><div class="b1">'
          +'<span class="org">'+esc(l.o)+'</span><span class="ref">'+l.ref+'</span></div></div></div>';
        document.body.appendChild(g); DRAG.ghost=g;
      }else if(DRAG.mode==='move') DRAG.el.classList.add('dragging');
    }
  }
  if(DRAG.mode==='pan'){
    scEl.scrollLeft=DRAG.sl0-(e.clientX-DRAG.x0);
    scEl.scrollTop=DRAG.st0-(e.clientY-DRAG.y0);
    return;
  }
  if(DRAG.ghost){DRAG.ghost.style.left=(e.clientX+14)+'px';DRAG.ghost.style.top=(e.clientY-14)+'px';}

  if(DRAG.mode==='resize'){
    const t=timeAt(DRAG.row,e.clientX), b=DRAG.blk;
    let s=b.s,en=b.e;
    if(DRAG.edge==='l') s=new Date(Math.min(+t,+b.e-MINDUR)); else en=new Date(Math.max(+t,+b.s+MINDUR));
    DRAG.next={s,e:en};
    placeDrop(DRAG.row,s,en,fmtH(durH(s,en)),false); return;
  }
  const row=rowUnder(e.clientX,e.clientY);
  if(!row){clearDrop();DRAG.target=null;return;}
  DRAG.target=row;
  const drvId=row.dataset.drv, d=DRV[drvId], t=timeAt(row,e.clientX);
  if(DRAG.mode==='pool'){
    const l=LOADS[DRAG.ref], en=new Date(+t+planHOf(l)*HOUR);
    const clash=BLOCKS.some(x=>x.drv===drvId&&isLoad(x)&&x.kind!=='cancelled'&&x.s<en&&t<x.e);
    const eqBad=d.eq!==l.eq;
    DRAG.next={s:t,e:en,drv:drvId};
    placeDrop(row,t,en,clash?'Overlaps a live load':eqBad?'Pulls a '+d.eq+' — load needs a '+l.eq
      :dlong(t)+' → '+ampm(en),clash||eqBad);
  }else{
    const b=DRAG.blk, dur=b.e-b.s, sn=snap();
    const s=new Date(Math.round((+t-(DRAG.grab||0))/sn)*sn), en=new Date(+s+dur);
    const clash=BLOCKS.some(x=>x!==b&&x.drv===drvId&&isLoad(x)&&isLoad(b)&&x.s<en&&s<x.e);
    DRAG.next={s,e:en,drv:drvId};
    placeDrop(row,s,en,clash?'Overlaps a live load':dlong(s),clash);
  }
}
function onUp(){
  window.removeEventListener('pointermove',onMove);
  const D=DRAG; clearDrop();
  scEl.classList.remove('grabbing'); document.body.classList.remove('dragging');
  if(D&&D.ghost) D.ghost.remove();
  if(D&&D.el) D.el.classList.remove('dragging');
  DRAG=null;
  if(!D||!D.active) return;
  justDragged=true; setTimeout(()=>justDragged=false,90);
  if(D.mode==='pan'){renderMasthead();return;}
  if(!D.next) return;
  if(D.mode==='pool'){ if(D.target) place(D.ref,D.next.drv,D.next.s); }
  else if(D.mode==='move'){ if(D.target) moveBlock(D.blk,D.next.s,D.next.drv); }
  else { const b=D.blk,o={s:b.s,e:b.e}; b.s=D.next.s;b.e=D.next.e; renderSoft();
         toast((b.ref?'<b>'+b.ref+'</b>':'Entry')+' now '+fmtH(durH(b.s,b.e)),
               ()=>{b.s=o.s;b.e=o.e;renderSoft();}); }
}

scEl.addEventListener('pointerdown',e=>{
  const bar=e.target.closest('.bar');
  if(bar){
    const b=BLOCKS.find(x=>x.id===bar.dataset.blk); if(!b) return;
    const row=bar.closest('.row'), lane=row.querySelector('.lane').getBoundingClientRect();
    const rc=bar.getBoundingClientRect();
    if(e.clientX-rc.left<6){startDrag(e,{mode:'resize',blk:b,row,edge:'l',el:bar});return;}
    if(rc.right-e.clientX<6){startDrag(e,{mode:'resize',blk:b,row,edge:'r',el:bar});return;}
    startDrag(e,{mode:'move',blk:b,row,el:bar,grab:(e.clientX-rc.left)/lane.width*RSPAN});
    return;
  }
  if(e.target.closest('button')||e.target.closest('.gut')) return;
  startDrag(e,{mode:'pan',sl0:scEl.scrollLeft,st0:scEl.scrollTop});
});
$('#wlBody').addEventListener('pointerdown',e=>{
  const row=e.target.closest('.wl-row'); if(!row||e.target.closest('button')) return;
  startDrag(e,{mode:'pool',ref:row.dataset.load,el:row});
});

/* ===========================================================================
   11b. THE HOVER CARD
   Resting on a bar reads the load out in full without committing to opening
   the drawer. One node serves the whole board: it is filled, measured, then
   placed, because the flip decision needs its real height.

   It must never take part in the gesture underneath it — pointer-events:none
   in CSS, and the whole thing stays down while DRAG is live, or the card
   would chase a bar that is being moved.
   ======================================================================== */
const bhcEl=$('#barCard');
let bhcT=null, bhcFor=null;
const HOVER_IN=220;
/* how far through its own window the block is, right now */
const progOf=b=>Math.max(0,Math.min(100,Math.round((NOW-b.s)/(b.e-b.s)*100)));

function bhcHide(){
  clearTimeout(bhcT); bhcT=null; bhcFor=null;
  bhcEl.classList.remove('show'); bhcEl.setAttribute('aria-hidden','true');
}

function bhcFill(b){
  const l=b.ref?LOADS[b.ref]:null, d=DRV[b.drv], base=KVAR(b.kind);
  bhcEl.setAttribute('style','--k-ink:var(--'+toneVar(b.kind)+');--k-line:var(--'+base
    +'-line);--k-fill:var(--'+base+'-fill)');

  const end=(k,t,place,cls)=>'<div class="bhc-end'+(cls?' '+cls:'')+'">'
    + '<div class="k">'+k+'</div>'
    + '<div class="d">'+DOW[t.getDay()]+' '+mdy(t)+'</div>'
    + '<div class="h">'+ampm(t)+'</div>'
    + '<div class="p">'+esc(place)+'</div></div>';
  const fig=(k,v,u)=>'<div class="bhc-fig"><div class="k">'+k+'</div>'
    + '<div class="v">'+v+(u?' <small>'+u+'</small>':'')+'</div></div>';

  let h='<div class="bhc-state"><span class="dot"></span>'
    + '<span class="lab">'+esc(KINDS[b.kind].lab)+'</span>'
    + (b.ref?'<span class="rf">'+b.ref+'</span>':'')+'</div>';

  if(l){
    h+='<div class="bhc-id"><div class="bhc-cust">'+esc(l.cust)+'</div>'
     + '<div class="bhc-eq">'+esc(l.eq)+(d?' · '+d.truck+' / '+d.trailer:'')+'</div></div>';

    /* the drawer synthesises pickup / fuel / delivery, so the count matches it */
    const stops=2+(FUEL.some(f=>f.ref===l.ref)?1:0);
    h+='<div class="bhc-j">'+end('Pickup',b.s,l.o)
     + '<div class="bhc-mid"><div class="ln"></div><div class="n">'+stops+' stops</div></div>'
     + end('Delivery',b.e,l.d,'to')+'</div>';

    /* a percentage alone reads as broken on a block whose window has not
       opened yet — say which side of it we are on */
    const p=progOf(b), driven=Math.round(l.mi*p/100);
    const lede=NOW<b.s ? '<b>Not started</b> · in '+fmtH(durH(NOW,b.s))
             : NOW>=b.e ? '<b>100%</b> complete'
             : '<b>'+p+'%</b> complete';
    h+='<div class="bhc-prog"><div class="t"><i style="width:'+p+'%"></i></div>'
     + '<div class="n"><span>'+lede+'</span>'
     + '<span>'+fmtH(durH(b.s,b.e))+' window · '+(b.drivePct||0)+'% driving</span></div></div>';

    h+='<div class="bhc-figs">'+fig('Loaded',l.mi.toLocaleString(),'mi')
     + fig('Driven',driven.toLocaleString(),'mi')
     + fig('Remaining',(l.mi-driven).toLocaleString(),'mi')+'</div>';

    h+='<div class="bhc-foot"><span><b>'+money0(l.rate)+'</b> · '+money2(l.rate/l.mi)+'/mi</span>'
     + '<span class="hint">Click to open details</span></div>';
  }else{
    h+='<div class="bhc-id"><div class="bhc-cust">'+esc(b.note||KINDS[b.kind].lab)+'</div>'
     + '<div class="bhc-eq">'+esc(d?d.name+' · '+d.truck:'Unassigned')+'</div></div>';
    h+='<div class="bhc-figs">'+fig('Duration',fmtH(durH(b.s,b.e)))
     + fig('Starts',ampm(b.s))+fig('Ends',ampm(b.e))+'</div>';
    h+='<div class="bhc-foot"><span>'+dlong(b.s)+'</span>'
     + '<span class="hint">Click to open details</span></div>';
  }
  bhcEl.innerHTML=h;
}

/* above the bar by preference, flipped under it when there is no room, and
   never over the details drawer when that is open */
function bhcPlace(bar){
  const r=bar.getBoundingClientRect(), c=bhcEl.getBoundingClientRect();
  const M=8, PAD=10;
  const drawer=$('#bd').classList.contains('show')?$('#bd').getBoundingClientRect().left-PAD:innerWidth-PAD;
  let x=r.left+r.width/2-c.width/2;
  x=Math.min(x,drawer-c.width);
  x=Math.max(PAD,Math.min(innerWidth-c.width-PAD,x));
  let y=r.top-c.height-M;
  if(y<PAD) y=Math.min(innerHeight-c.height-PAD,r.bottom+M);
  bhcEl.style.left=Math.round(x)+'px';
  bhcEl.style.top=Math.round(y)+'px';
}

scEl.addEventListener('pointerover',e=>{
  const bar=e.target.closest('.bar');
  if(!bar||DRAG||bar.dataset.blk===bhcFor) return;
  clearTimeout(bhcT);
  bhcT=setTimeout(()=>{
    const b=BLOCKS.find(x=>x.id===bar.dataset.blk);
    if(!b||DRAG||!bar.isConnected) return;
    bhcFor=bar.dataset.blk;
    bhcFill(b); bhcPlace(bar);
    bhcEl.classList.add('show'); bhcEl.setAttribute('aria-hidden','false');
  },HOVER_IN);
});
scEl.addEventListener('pointerout',e=>{
  const bar=e.target.closest('.bar');
  if(bar&&e.relatedTarget&&bar.contains(e.relatedTarget)) return;
  if(bar) bhcHide();
});
/* anything that moves the board, redraws it or starts a gesture drops the card */
scEl.addEventListener('pointerleave',bhcHide);
scEl.addEventListener('pointerdown',bhcHide,true);
scEl.addEventListener('scroll',bhcHide,{passive:true});
window.addEventListener('keydown',bhcHide,true);
window.addEventListener('blur',bhcHide);

/* the header label follows the scroll, so the range always names what is

let sTick=null;
scEl.addEventListener('scroll',()=>{ if(sTick) return;

scEl.addEventListener('click',e=>{
  if(justDragged) return;
  const st=e.target.closest('[data-stack]');
  if(st){const id=st.dataset.stack;
    S.openStacks.has(id)?S.openStacks.delete(id):S.openStacks.add(id); renderBody(); return;}
  const mo=e.target.closest('[data-more]');
  if(mo){const id=mo.dataset.more;
    S.openCards.has(id)?S.openCards.delete(id):S.openCards.add(id); renderBody(); return;}
  const nm=e.target.closest('[data-drv]');
  if(nm&&nm.classList.contains('gname')){toast('Driver profile opens for <b>'+esc(DRV[nm.dataset.drv].name)+'</b>');return;}
  const ad=e.target.closest('[data-addto]');
  if(ad){
    const id=ad.dataset.addto;
    if(S.armed){ place(S.armed,id,firstOpening(id,planHOf(LOADS[S.armed]))); }
    else openScheduleModal(null,id);
    return;
  }
  const gp=e.target.closest('[data-gap]');
  if(gp){
    const row=gp.closest('.row'), id=row.dataset.drv;
    const t=timeAt(row,gp.getBoundingClientRect().left+10);
    if(S.armed) place(S.armed,id,t); else openScheduleModal(null,id,t);
    return;
  }
  const bar=e.target.closest('.bar');
  if(bar){S.sel={t:'block',id:bar.dataset.blk};renderBody();renderDetails();return;}
  /* click on open time while the board is armed places the load there */
  const row=e.target.closest('.row');
  if(row&&e.target.closest('.lane')&&S.armed){ place(S.armed,row.dataset.drv,timeAt(row,e.clientX)); }
});
scEl.addEventListener('keydown',e=>{
  const bar=e.target.closest('.bar');
  if(bar&&(e.key==='Enter'||e.key===' ')){e.preventDefault();S.sel={t:'block',id:bar.dataset.blk};
    renderBody();renderDetails();}
});

$('#wlBody').addEventListener('click',e=>{
  if(justDragged) return;
  const as=e.target.closest('[data-assign]');
  if(as){
    const ref=as.dataset.assign;
    if(S.picked===ref){S.picked=null;S.armed=null;renderWaiting();renderDetails();renderArm();return;}
    S.picked=ref;S.armed=ref;S.sel={t:'load',id:ref};
    renderWaiting();renderDetails();renderArm();
    /* the slot you are about to click is on the other pane, so go there */
    setPane('board');
    toast('<b>'+ref+'</b> picked — click open time on a row, or a driver’s <b>+</b>');
    return;
  }
  const row=e.target.closest('.wl-row');
  if(row){S.sel={t:'load',id:row.dataset.load};renderWaiting();renderDetails();return;}
  const ex=e.target.closest('[data-exc]');
  if(ex){
    const rec=($('#wlBody')._excs||[])[+ex.dataset.exc]; if(!rec) return;
    /* an exception about a block lives on the board, so follow it there */
    if(rec.blk){S.sel={t:'block',id:rec.blk};setPane('board');scrollToBlock(rec.blk);
      renderBody();renderDetails();}
    else if(rec.load){S.tab='pool';S.sel={t:'load',id:rec.load};renderWaiting();renderDetails();}
    else if(rec.drv){S.sel=null;setPane('board');renderDetails();
      toast('<b>'+esc(DRV[rec.drv].name)+'</b> · '+rec.t);}
  }
});

$('#bdFoot').addEventListener('click',e=>{

function scrollToBlock(id){

/* ---- the date shuttle ----------------------------------------------------
   Free dragging lands anywhere, which is the point of it. The shuttle, the
   span control and Jump to now all snap to a whole column, so the range they
   produce reads as "Sun 09/20 – Sat 09/26" rather than starting mid-morning. */
const snapCols=()=>{scEl.scrollLeft=Math.round(scEl.scrollLeft/COLW)*COLW;};
function shift(n){
  const gut=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--gut-w'))||280;
  scEl.scrollLeft+=n*Math.max(240,scEl.clientWidth-gut);
  snapCols(); renderMasthead();
}
function jumpToNow(){
  const gut=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--gut-w'))||280;
  const vis=Math.max(240,scEl.clientWidth-gut);
  scEl.scrollLeft=Math.max(0,pct(NOW)/100*LANEW-vis*0.32);
  snapCols(); renderMasthead();
}

/* ===========================================================================
   13. FILTERS DRAWER
   Nine facets, a draft you can cancel out of, and a count on the button.
   ======================================================================== */
const drawer=$('#drawer'), scrim=$('#scrim');
let draft=null;
const FACETS=[
  ['from','Date range from','date'],
  ['to','Date range to','date'],
  ['status','Display',[['','Any driver status'],['D','Driving'],['ON','On duty'],['OF','Off duty'],['SB','Sleeper berth']]],
  ['eld','Show ELD status',[['No','No'],['Yes','Yes']]],
  ['team','Team',null],
  ['disp','Dispatcher',null],
  ['carrier','Carrier',null],
  ['equipment','Equipment',null],
  ['driver','Driver',null],
  ['term','Terminal',null]
];
const OPTS={team:()=>TEAMS.map(v=>[v,v]),disp:()=>DISPS.map(v=>[v,v]),
  carrier:()=>CARRIERS.map(v=>[v,v]),equipment:()=>EQUIP.map(v=>[v,v]),
  driver:()=>DRIVERS.map(d=>[d.id,d.name]),term:()=>TERMS.map(v=>[v,v])};
const PLACE={team:'Select team',disp:'Select dispatcher',carrier:'Select carrier',
  equipment:'Select equipment',driver:'Select driver',term:'Select terminal'};

function openDrawer(){
  draft=Object.assign({},S.flt);
  $('#drawerBody').innerHTML=FACETS.map(([k,lab,kind])=>{
    if(kind==='date') return '<div class="dfld"><label>'+lab+'</label>'
      + '<input class="inp" type="date" data-f="'+k+'" value="'+(draft[k]||'')+'"></div>';
    const opts=Array.isArray(kind)?kind:[['',PLACE[k]]].concat(OPTS[k]());
    return '<div class="dfld"><label>'+lab+'</label><select class="sel" data-f="'+k+'">'
      + opts.map(([v,t])=>'<option value="'+esc(v)+'"'+(String(draft[k])===String(v)?' selected':'')+'>'
      + esc(t)+'</option>').join('')+'</select></div>';
  }).join('');
  scrim.classList.add('show'); drawer.classList.add('show');
  drawer.setAttribute('aria-hidden','false');
}
function closeDrawer(){scrim.classList.remove('show');drawer.classList.remove('show');

$('#btnFilters').onclick=openDrawer;
$('#drawerX').onclick=closeDrawer;
$('#fltCancel').onclick=closeDrawer;

const KINDLIST=[['plan','Preplanned'],['conf','Confirmed'],['sent','Sent to driver'],
  ['transit','In transit'],['late','Late'],['hold','On hold'],['delivered','Delivered'],
  ['cancelled','Cancelled'],['off','Time off / shop'],['none','No dispatch']];

function openScheduleModal(blk,prefDrv,prefStart){
  const b=blk||null;
  const drv=b?b.drv:(prefDrv||visibleDrivers()[0].id);
  const st=b?b.s:(prefStart||new Date(+startOfDay(NOW)+8*HOUR));
  const kind=b?b.kind:'plan';
  const hrs=b?durH(b.s,b.e):10;
  const iso=d=>d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
  modalEl.dataset.assign='';
  modalEl.innerHTML=
     '<h3 id="modalTitle">'+(b?'Edit schedule entry':'Add a schedule entry')+'</h3>'
   + '<div class="msub">'+(b?'Change the driver, the window or the state of this block.'
      :'Block a truck out, or place a load on the board by hand.')+'</div>'
   + '<div class="mbody">'
   +  '<div class="frow"><div class="fld"><label>Driver</label><select class="sel" id="mDrv">'
   +   DRIVERS.map(d=>'<option value="'+d.id+'"'+(d.id===drv?' selected':'')+'>'+esc(d.name)+' — '
   +     d.truck+' · '+esc(d.eq)+'</option>').join('')+'</select></div></div>'
   +  '<div class="frow"><div class="fld"><label>State</label><div class="kindpick" id="mKind">'
   +   KINDLIST.map(([k,l])=>{const base=k.replace('transit','tran').replace('delivered','deliv').replace('cancelled','canc');
        return '<button type="button" data-kind="'+k+'" class="'+(k===kind?'on':'')
        +'" style="--k-ink:var(--'+toneVar(k)+');--k-fill:var(--'+base+'-fill)"><i></i>'+l+'</button>';}).join('')
   +  '</div></div></div>'
   +  '<div class="frow">'
   +   '<div class="fld"><label>Date</label><input class="inp" type="date" id="mDate" value="'+iso(st)+'"></div>'
   +   '<div class="fld"><label>Start</label><input class="inp" type="time" id="mTime" value="'
   +     pad2(st.getHours())+':'+pad2(st.getMinutes())+'" step="900"></div>'
   +   '<div class="fld" style="max-width:104px"><label>Hours</label><input class="inp" type="number" id="mDur" min="1" max="200" step="0.5" value="'+hrs+'"></div>'
   +  '</div>'
   +  '<div class="frow"><div class="fld"><label>Load reference or note</label>'
   +   '<input class="inp" id="mNote" placeholder="DATR-1789260, or ‘Maintenance’" value="'
   +   esc(b?(b.ref||b.note||''):'')+'"></div></div>'
   + '</div>'
   + '<div class="mfoot">'+(b?'<button class="btn sm danger" id="mDel" style="margin-right:auto">Remove</button>':'')
   + '<button class="btn sm" id="mCancel">Cancel</button>'
   + '<button class="btn sm pri" id="mSave">'+(b?'Save changes':'Add to the board')+'</button></div>';
  scrim.classList.add('show'); modalEl.classList.add('show');
  let pick=kind;
  $('#mKind').addEventListener('click',ev=>{const t=ev.target.closest('[data-kind]');if(!t)return;
    pick=t.dataset.kind;$$('#mKind button').forEach(x=>x.classList.toggle('on',x===t));});
  $('#mCancel').onclick=closeModal;
  if($('#mDel')) $('#mDel').onclick=()=>{closeModal();returnToPool(b.id);};
  $('#mSave').onclick=()=>{
    const dv=$('#mDrv').value;
    const [y,mo,da]=$('#mDate').value.split('-').map(Number);
    const [hh,mi]=$('#mTime').value.split(':').map(Number);
    const s0=new Date(y,mo-1,da,hh||0,mi||0);
    const h=Math.max(1,parseFloat($('#mDur').value)||10);
    const e0=new Date(+s0+h*HOUR);
    const raw=$('#mNote').value.trim(), ref=LOADS[raw.toUpperCase()]?raw.toUpperCase():null;
    if(b){ Object.assign(b,{drv:dv,kind:pick,s:s0,e:e0,ref,note:ref?null:(raw||null)});
      closeModal(); S.sel={t:'block',id:b.id}; renderSoft(); toast('Entry updated'); }
    else{ const n={id:'b'+(++SEQ),drv:dv,kind:pick,s:s0,e:e0,ref,note:ref?null:(raw||null),
            drivePct:pick==='off'||pick==='none'?0:64};
      BLOCKS.push(n); if(ref) POOL=POOL.filter(r=>r!==ref);
      closeModal(); S.sel={t:'block',id:n.id}; renderSoft();

        ()=>{BLOCKS=BLOCKS.filter(x=>x!==n);if(ref&&!POOL.includes(ref))POOL.unshift(ref);

  };
  setTimeout(()=>$('#mDrv').focus(),40);
}

/* ===========================================================================
   14b. TRACK LOAD
   One block, one page. The model is derived from the block's window and the
   load's lane: where the truck is on the plan right now, what the ELD last
   said, and the ping log leading up to it. Seeded by the ref, so a page reads
   the same every time it is opened.
   ======================================================================== */
const WAYPTS={
  'Montello, MS|Elkhart, IN':[
    ['Montello, MS',   null,     33.99,-88.92],
    ['Tupelo, MS',     'US-45 N',34.258,-88.703],
    ['Jackson, TN',    'I-40 W', 35.614,-88.814],
    ['Paducah, KY',    'I-24 W', 37.083,-88.600],
    ['Evansville, IN', 'I-69 N', 37.972,-87.571],
    ['Indianapolis, IN','I-69 N',39.768,-86.158],
    ['Kokomo, IN',     'US-31 N',40.486,-86.134],
    ['Elkhart, IN',    'US-31 N',41.682,-85.977]]
};
const WOBBLE=[0,26,-18,22,-14,18,-22,0,16,-12];
function seeded(str){
  let h=2166136261>>>0;
  for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)>>>0;}
  return()=>{h^=h<<13;h>>>=0;h^=h>>>17;h^=h<<5;h>>>=0;return (h%10000)/10000;};
}
const minsAgo=t=>Math.max(0,Math.round((NOW-t)/60e3));
const rel=t=>{const m=minsAgo(t);return m<1?'just now':m<60?m+' min ago':fmtH(m/60)+' ago';};
const hmm=ms=>{const m=Math.round(Math.abs(ms)/60e3),h=Math.floor(m/60);return (h?h+'h ':'')+(m%60)+'m';};

function trackModel(b){
  const l=LOADS[b.ref], d=DRV[b.drv];
  const wps=WAYPTS[l.o+'|'+l.d]||[[l.o,null],['En route','Interstate'],[l.d,'Interstate']];
  const raw=(NOW-b.s)/(b.e-b.s);
  const frac=Math.max(0,Math.min(1,raw));
  const started=raw>0, done=b.kind==='delivered'||raw>=1;
  const live=started&&!done;
  const delay=b.kind==='late'?155*60e3:b.kind==='transit'?-40*60e3:0;
  const eta=new Date(+b.e+delay);
  const rnd=seeded(b.ref);
  const lastPing=live?new Date(NOW-(3+Math.floor(rnd()*6))*60e3):done?b.e:null;
  const speed=live?Math.round(54+rnd()*12):0;
  const legs=wps.length-1;
  /* where a fraction of the lane falls: which leg, how far past its start */
  const at=f=>{
    const i=Math.min(legs-1,Math.floor(f*legs)), within=f*legs-i;
    const legMi=l.mi/legs;
    return {i,within,road:wps[i+1][1],from:wps[i][0],to:wps[i+1][0],miPast:Math.round(within*legMi)};
  };
  const here=at(frac);
  const fuelAt=0.45;
  /* the log walks back from the last ping about every half hour */
  const pings=[];
  if(lastPing){
    let f=frac, t=+lastPing, k=0;
    while(f>0&&k<14){
      const p=at(f);
      let ev='move', sp=Math.round(52+rnd()*14), txt=p.road+' · '+p.miPast+' mi past '+p.from;
      if(k>0&&f<fuelAt&&f+(0.5*57)/l.mi>=fuelAt){ev='stop';sp=0;txt='Fuel · '+p.to;}
      else if(k>0&&rnd()<0.12){ev='idle';sp=0;txt=p.road+' · rest area near '+p.to;}
      pings.push({t:new Date(t),ev,sp,txt,hd:'N'});
      const gapMin=28+Math.round(rnd()*12);
      t-=gapMin*60e3; f-=(gapMin/60*57)/l.mi; k++;
    }
    pings.push({t:new Date(b.s),ev:'event',sp:0,txt:'Departed pickup · '+l.o,hd:''});
  }
  return {l,d,wps,frac,started,done,live,delay,eta,lastPing,speed,here,pings,fuelAt,
    miDone:Math.round(l.mi*frac)};
}

/* the schematic: waypoints spread across the panel, joined by a smooth
   curve; the driven part is the same curve drawn in the state's ink and
   clipped with a dash, so the two stay one line */
function drawSchematic(m){
  const el=$('#tkMap'); if(!el) return;
  const W=Math.max(420,el.clientWidth), H=el.clientHeight||352;
  const n=m.wps.length, x0=72, x1=W-72, yMid=H/2+8;
  const P=m.wps.map((w,i)=>[x0+(x1-x0)*i/(n-1), yMid-(i/(n-1))*44+WOBBLE[i%WOBBLE.length]]);
  let dPath='M'+P[0][0]+' '+P[0][1];
  for(let i=0;i<n-1;i++){
    const p0=P[Math.max(0,i-1)],p1=P[i],p2=P[i+1],p3=P[Math.min(n-1,i+2)];
    const c1=[p1[0]+(p2[0]-p0[0])/6,p1[1]+(p2[1]-p0[1])/6], c2=[p2[0]-(p3[0]-p1[0])/6,p2[1]-(p3[1]-p1[1])/6];
    dPath+=' C'+c1[0]+' '+c1[1]+' '+c2[0]+' '+c2[1]+' '+p2[0]+' '+p2[1];
  }
  const NS='http://www.w3.org/2000/svg';
  const svgEl=document.createElementNS(NS,'svg'); svgEl.setAttribute('viewBox','0 0 '+W+' '+H);
  const mk=(tag,attrs,txt)=>{const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(txt!=null)e.textContent=txt;svgEl.appendChild(e);return e;};
  mk('path',{d:dPath,class:'rest'});
  const done=mk('path',{d:dPath,class:'done'});
  el.querySelectorAll('svg,.tk-ping').forEach(x=>x.remove());
  el.appendChild(svgEl);
  const len=done.getTotalLength();
  done.setAttribute('stroke-dasharray',(len*m.frac)+' '+len);
  m.wps.forEach((w,i)=>{
    const f=i/(n-1), past=m.frac>=f-1e-6&&m.started, end=i===0||i===n-1;
    mk('circle',{cx:P[i][0],cy:P[i][1],r:end?5:3.5,class:'wp'+(past?' past':'')+(end?' end':'')});
    const above=i%2===0;
    if(end) mk('text',{x:P[i][0],y:P[i][1]+(above?-24:32),'text-anchor':'middle',class:'we'},i===0?'PICKUP':'DELIVERY');
    if(end||(x1-x0)/(n-1)>=96||i%2===1)
      mk('text',{x:P[i][0],y:P[i][1]+(above?-11:20),'text-anchor':'middle',class:'wl'+(past?' past':'')},w[0]);
  });
  if(m.started&&!m.done){
    const pt=done.getPointAtLength(len*m.frac);
    mk('circle',{cx:pt.x,cy:pt.y,r:14,class:'ring'});
    mk('circle',{cx:pt.x,cy:pt.y,r:6,class:'truck'});
    const box=document.createElement('div'); box.className='tk-ping';
    box.innerHTML='<div class="k"><i></i>Last ping · '+ampm(m.lastPing)+'</div>'
      + '<div class="v">'+esc(m.here.road+' · '+m.here.miPast+' mi past '+m.here.from)+'</div>'
      + '<div class="d">'+m.speed+' mph · toward '+esc(m.here.to)+' · '+rel(m.lastPing)+'</div>';
    el.appendChild(box);
    if(W<900){box.style.right='12px';box.style.top='34px';box.style.width='196px';return;}
    const flip=pt.x>W*0.55;
    box.style.left=(flip?pt.x-14-196:pt.x+14)+'px'; box.style.top=Math.max(40,Math.min(H-84,pt.y-30))+'px';
    box.style.width='196px';
  }
}

/* ---- the tiled map -------------------------------------------------------
   Leaflet is fetched the first time a track page opens; until it lands (or if
   it never does — offline, blocked) the schematic above stands in. The lane
   needs real coordinates on its waypoints to be drawn on tiles. */
const TILES={
  light:  ['https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}',
           'https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Reference/MapServer/tile/{z}/{y}/{x}'],
  streets:['https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}'],
  dark:   ['https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}',
           'https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Reference/MapServer/tile/{z}/{y}/{x}']
};
const TILE_ATTR='Tiles &copy; Esri';
const tileGroup=st=>LF.layerGroup(TILES[st].map(u=>LF.tileLayer(u,{attribution:TILE_ATTR,maxZoom:16})));
let LEAFLET=null, TKMAP=null;
const LF=new Proxy({},{get:(_,k)=>window.leaflet[k]});
function loadLeaflet(){
  if(window.leaflet) return Promise.resolve(true);
  if(LEAFLET) return LEAFLET;
  LEAFLET=new Promise(res=>{
    const css=document.createElement('link'); css.rel='stylesheet';
    css.href='https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css';
    const js=document.createElement('script');
    js.src='https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js';
    /* the page's own L() is the load constructor; Leaflet also publishes itself as window.leaflet, so hand L back */
    js.onload=()=>{ if(window.leaflet&&window.leaflet.noConflict) window.leaflet.noConflict(); res(!!window.leaflet); }; js.onerror=()=>res(false);
    document.head.append(css,js);
    setTimeout(()=>res(!!window.leaflet),6000);
  });
  return LEAFLET;
}
const tileStyle=()=>S.mapStyle!=='auto'?S.mapStyle
  :(document.documentElement.getAttribute('data-theme')==='dark'?'dark':'light');
function alongRoute(pts,frac){
  const d=[]; let tot=0;
  for(let i=0;i<pts.length-1;i++){const s=LF.latLng(pts[i]).distanceTo(pts[i+1]);d.push(s);tot+=s;}
  let left=frac*tot, i=0;
  while(i<d.length&&left>d[i]){left-=d[i];i++;}
  if(i>=d.length) return {pt:pts[pts.length-1],i:d.length-1};
  const t=d[i]?left/d[i]:0, a=pts[i], b=pts[i+1];
  return {pt:[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t],i};
}
function drawTrackMap(m){
  const real=m.wps.every(w=>w.length>=4);
  if(!real) return drawSchematic(m);
  if(window.leaflet) return drawTiles(m);
  drawSchematic(m);
  loadLeaflet().then(ok=>{ if(ok&&S.pane==='track'&&$('#tkMap')) drawTiles(m); });
}
function drawTiles(m){
  const el=$('#tkMap'); if(!el) return;
  el.querySelectorAll('svg,.tk-ping,.tk-note').forEach(x=>x.remove());
  let host=el.querySelector('.tk-tiles');
  if(TKMAP&&TKMAP.host!==host){ try{TKMAP.map.remove();}catch(e){} TKMAP=null; }
  if(!host){ host=document.createElement('div'); host.className='tk-tiles'; el.prepend(host); }
  const cs=getComputedStyle(el);
  const ink=cs.getPropertyValue('--k-ink').trim(), rest=cs.getPropertyValue('--line-3').trim();
  const pts=m.wps.map(w=>[w[2],w[3]]);
  let map, tiles;
  if(TKMAP){ map=TKMAP.map; tiles=TKMAP.tiles; TKMAP.group.clearLayers(); }
  else{
    map=LF.map(host,{zoomControl:false,scrollWheelZoom:false,attributionControl:true});
    LF.control.zoom({position:'bottomleft'}).addTo(map);
    map.attributionControl.setPrefix('');
    tiles=tileGroup(tileStyle()).addTo(map);
    TKMAP={map,tiles,host,group:LF.layerGroup().addTo(map),style:tileStyle()};
    map.on('move zoom',()=>tkPlacePing());
  }
  const g=TKMAP.group;
  /* the route: driven in the state's ink, the rest a dashed hairline */
  const at=alongRoute(pts,m.frac);
  const done=m.started?pts.slice(0,at.i+1).concat([at.pt]):[];
  const ahead=[at.pt].concat(pts.slice(at.i+1));
  LF.polyline(m.done?pts:ahead,{color:rest,weight:2,dashArray:'2 7',lineCap:'round'}).addTo(g);
  if(done.length>1) LF.polyline(m.done?pts:done,{color:ink,weight:3,lineCap:'round',lineJoin:'round'}).addTo(g);
  /* the stops. Pickup and delivery are always named; the towns between them
     only once the map is close enough for the names not to pile up */
  TKMAP.mid=[];
  m.wps.forEach((w,i)=>{
    const f=i/(m.wps.length-1), past=(m.started&&m.frac>=f-1e-6)||m.done, end=i===0||i===m.wps.length-1;
    const size=end?11:9;
    const mk=LF.marker(pts[i],{icon:LF.divIcon({className:'',html:'<div class="tk-dot'+(past?' past':'')+(end?' end':'')+'"></div>',
      iconSize:[size,size],iconAnchor:[size/2,size/2]}),interactive:false}).addTo(g)
     .bindTooltip((end?(i===0?'Pickup · ':'Delivery · '):'')+esc(w[0]),
       {permanent:true,direction:i%2?'bottom':'top',offset:[0,i%2?7:-7],className:'tk-tip'+(past?' past':'')+(end?' end':'')});
    if(!end) TKMAP.mid.push(mk);
  });
  const tkLabels=()=>{const show=map.getZoom()>=7; TKMAP.mid.forEach(mk=>show?mk.openTooltip():mk.closeTooltip());};
  map.off('zoomend'); map.on('zoomend',tkLabels);
  /* the truck and its card */
  TKMAP.truck=null;
  if(m.started&&!m.done){
    TKMAP.truck=LF.latLng(at.pt);
    LF.marker(at.pt,{icon:LF.divIcon({className:'',html:'<div class="tk-truckm"><i></i><b></b></div>',iconSize:[28,28],iconAnchor:[14,14]}),
      interactive:false,zIndexOffset:1000}).addTo(g);
    const box=document.createElement('div'); box.className='tk-ping';
    box.innerHTML='<div class="k"><i></i>Last ping · '+ampm(m.lastPing)+'</div>'
      + '<div class="v">'+esc(m.here.road+' · '+m.here.miPast+' mi past '+m.here.from)+'</div>'
      + '<div class="d">'+m.speed+' mph · toward '+esc(m.here.to)+' · '+rel(m.lastPing)+'</div>';
    box.style.width='196px'; el.appendChild(box);
  }
  map.invalidateSize();
  map.fitBounds(LF.latLngBounds(pts),{padding:[40,40]});
  tkLabels();
  tkPlacePing();
  /* the layers menu */
  const btn=$('#tkLayers'), menu=$('#tkLayersMenu');
  if(btn&&!btn.dataset.wired){
    btn.dataset.wired='1';
    btn.onclick=e=>{e.stopPropagation(); const on=!menu.classList.contains('show');
      menu.classList.toggle('show',on); btn.setAttribute('aria-expanded',String(on));};
    menu.onclick=e=>{const b=e.target.closest('[data-style]'); if(!b) return;
      menu.classList.remove('show'); btn.setAttribute('aria-expanded','false');
      if(b.dataset.style==='fit') return map.fitBounds(LF.latLngBounds(pts),{padding:[40,40]});
      S.mapStyle=b.dataset.style; Store.set('dpsx.map',S.mapStyle);
      $$('#tkLayersMenu [data-style]').forEach(x=>x.classList.toggle('on',x.dataset.style===S.mapStyle));
      tkApplyTheme();};
  }
}
document.addEventListener('pointerdown',e=>{ const menu=$('#tkLayersMenu');
  if(menu&&menu.classList.contains('show')&&!e.target.closest('.tk-layers')){
    menu.classList.remove('show'); $('#tkLayers').setAttribute('aria-expanded','false'); } },true);
function tkPlacePing(){
  if(!TKMAP) return;
  const el=$('#tkMap'), box=el&&el.querySelector('.tk-ping'); if(!box||!TKMAP.truck) return;
  const p=TKMAP.map.latLngToContainerPoint(TKMAP.truck), W=el.clientWidth, H=el.clientHeight;
  if(W<900){box.style.left='auto';box.style.right='12px';box.style.top='34px';return;}
  const flip=p.x>W*0.55;
  box.style.right='auto';
  box.style.left=Math.max(8,flip?p.x-16-196:p.x+16)+'px';
  box.style.top=Math.max(40,Math.min(H-88,p.y-30))+'px';
}
/* the basemap follows the theme unless the user picked one */
function tkApplyTheme(){
  if(!TKMAP) return;
  const st=tileStyle(); if(st===TKMAP.style) return;
  TKMAP.style=st; TKMAP.map.removeLayer(TKMAP.tiles); TKMAP.tiles=tileGroup(st).addTo(TKMAP.map);
}

/* ===========================================================================
   15. KEYBOARD
   ======================================================================== */
document.addEventListener('keydown',e=>{
  if(S.pane==='track'){
    if(e.key==='Escape'){closeTrack();e.preventDefault();}
    return;
  }
  const typing=/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
  if(e.key==='Escape'){
    if(modalEl.classList.contains('show')) return closeModal();
    if(drawer.classList.contains('show')) return closeDrawer();
    if(S.armed){S.armed=null;S.picked=null;renderArm();renderWaiting();renderBody();return;}
    if(S.sel){S.sel=null;renderBody();renderWaiting();renderDetails();return;}
  }
  if(typing||e.metaKey||e.ctrlKey||e.altKey) return;
  if(e.key==='ArrowLeft'){e.preventDefault();shift(-1);}
  else if(e.key==='ArrowRight'){e.preventDefault();shift(1);}
  else if(e.key==='n'||e.key==='N'){jumpToNow();}
  else if(e.key==='b'||e.key==='B'){setPane('board');}
  else if(e.key==='l'||e.key==='L'){setPane('loads');}
  else if(e.key>='1'&&e.key<='5'){
    setSpan([1,2,3,7,14][+e.key-1]);
  }
  else if(e.key==='e'||e.key==='E'){$('#optExpand').checked=!S.expandRows;
    $('#optExpand').dispatchEvent(new Event('change'));}
  else if(e.key==='m'||e.key==='M'){$('#optMiles').checked=!S.milesColor;
    $('#optMiles').dispatchEvent(new Event('change'));}
  else if((e.key==='Delete'||e.key==='Backspace')&&S.sel&&S.sel.t==='block'){
    e.preventDefault();returnToPool(S.sel.id);}
});

/* ===========================================================================
   15b. SELECT
   Every <select class="sel"> on the page — static or rendered later by the
   drawer and the modals — is drawn by a .sel button and one shared .menu.
   The native element stays in the DOM as the source of truth: code keeps
   reading .value and listening for change; writes to .value re-label the
   button, and focus() lands on it.
   ======================================================================== */
const cmenu=document.createElement('div');
cmenu.className='menu csel-menu'; cmenu.setAttribute('role','listbox'); document.body.appendChild(cmenu);
let CSEL=null;
const SELVAL=Object.getOwnPropertyDescriptor(HTMLSelectElement.prototype,'value');
function enhanceSelect(sel){
  if(sel.dataset.csel) return;
  sel.dataset.csel='1'; sel.classList.add('native');
  const btn=document.createElement('button'); btn.type='button';
  btn.className=sel.className.replace('native','').trim()+' csel';
  btn.setAttribute('aria-haspopup','listbox'); btn.setAttribute('aria-expanded','false');
  if(sel.getAttribute('aria-label')) btn.setAttribute('aria-label',sel.getAttribute('aria-label'));
  if(sel.id){ btn.id=sel.id+'Btn';
    const lab=document.querySelector('label[for="'+sel.id+'"]'); if(lab) lab.setAttribute('for',btn.id); }
  sel.after(btn);
  const sync=()=>{const o=sel.options[sel.selectedIndex];
    btn.innerHTML='<span>'+esc(o?o.textContent:'')+'</span>';
    btn.classList.toggle('is-ph',!!o&&o.value==='');};
  Object.defineProperty(sel,'value',{get(){return SELVAL.get.call(sel);},set(v){SELVAL.set.call(sel,v);sync();}});
  sel.focus=()=>btn.focus();
  sel.addEventListener('change',sync);
  btn.addEventListener('click',()=>CSEL&&CSEL.sel===sel?cselClose():cselOpen(sel,btn));
  btn.addEventListener('keydown',e=>{
    const open=CSEL&&CSEL.sel===sel;
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault(); open?cselMove(e.key==='ArrowDown'?1:-1):cselOpen(sel,btn);}
    else if((e.key==='Enter'||e.key===' ')&&open){e.preventDefault(); cselPick(CSEL.idx);}
    else if(e.key==='Home'&&open){e.preventDefault(); cselMove(-CSEL.idx);}
    else if(e.key==='End'&&open){e.preventDefault(); cselMove(sel.options.length-1-CSEL.idx);}
  });
  sync();
}
function cselOpen(sel,btn){
  cselClose();
  const cur=sel.selectedIndex;
  cmenu.innerHTML=[...sel.options].map((o,i)=>'<button type="button" role="option" data-i="'+i+'"'
    + ' class="'+(i===cur?'on':'')+(o.value===''?' ph':'')+'" aria-selected="'+(i===cur)+'">'
    + '<span class="txt">'+esc(o.textContent)+'</span><span class="tick">'+svg('check',12,2.6)+'</span></button>').join('');
  const r=btn.getBoundingClientRect();
  cmenu.style.minWidth=Math.max(r.width,160)+'px';
  cmenu.style.left=Math.max(8,Math.min(r.left,innerWidth-8-Math.max(r.width,160)))+'px';
  cmenu.style.top='0px'; cmenu.classList.add('show');
  const h=cmenu.offsetHeight, below=innerHeight-r.bottom-8, up=h>below&&r.top>below;
  cmenu.style.top=(up?Math.max(8,r.top-6-h):r.bottom+6)+'px';
  cmenu.classList.toggle('up',up);
  btn.setAttribute('aria-expanded','true');
  CSEL={sel,btn,idx:cur};
  const on=cmenu.querySelector('.on'); if(on) on.scrollIntoView({block:'nearest'});
}
function cselClose(){ if(!CSEL) return; cmenu.classList.remove('show'); CSEL.btn.setAttribute('aria-expanded','false'); CSEL=null; }
function cselMove(d){
  const n=CSEL.sel.options.length; CSEL.idx=(CSEL.idx+d+n)%n;
  [...cmenu.children].forEach((b,i)=>b.classList.toggle('hi',i===CSEL.idx));
  cmenu.children[CSEL.idx].scrollIntoView({block:'nearest'});
}
function cselPick(i){
  const {sel,btn}=CSEL; cselClose();
  if(sel.selectedIndex!==i){ sel.selectedIndex=i; sel.dispatchEvent(new Event('change',{bubbles:true})); }
  btn.focus();
}
cmenu.addEventListener('click',e=>{const b=e.target.closest('[data-i]'); if(b&&CSEL) cselPick(+b.dataset.i);});
cmenu.addEventListener('mousemove',e=>{const b=e.target.closest('[data-i]'); if(b&&CSEL&&+b.dataset.i!==CSEL.idx){CSEL.idx=+b.dataset.i;
  [...cmenu.children].forEach((x,i)=>x.classList.toggle('hi',i===CSEL.idx));}});
document.addEventListener('pointerdown',e=>{ if(CSEL&&!cmenu.contains(e.target)&&!CSEL.btn.contains(e.target)) cselClose(); },true);
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&CSEL){cselClose();e.stopImmediatePropagation();e.preventDefault();} },true);
window.addEventListener('scroll',e=>{ if(e.target!==cmenu) cselClose(); },true);
window.addEventListener('resize',()=>cselClose());
const enhanceAll=()=>$$('select.sel:not([data-csel])').forEach(enhanceSelect);
new MutationObserver(enhanceAll).observe(document.body,{childList:true,subtree:true});
enhanceAll();

/* ===========================================================================
   16. CHROME + INIT
   ======================================================================== */
const MODULES=['Home','Dispatch','Equipment','Customer','Personnel','Safety','Billing','Sales','Reporting','Accounting'];
$('#modnav').innerHTML=MODULES.map(m=>'<a href="#" class="'+(m==='Dispatch'?'on':'')+'">'+m+'</a>').join('');
$('#modnav').addEventListener('click',ev=>{const a=ev.target.closest('a');if(!a)return;ev.preventDefault();
  $$('#modnav a').forEach(x=>x.classList.remove('on'));a.classList.add('on');
  if(a.textContent!=='Dispatch') toast('<b>'+a.textContent+'</b> module opens here');});

$('#rail').innerHTML='<span class="logo-tile" title="Dispatch Pro">DP</span>'
 +[['grid','Home'],['doc','Documents'],['truck','Equipment'],['user','Personnel'],
   ['cal','Scheduler Planner',1],['chat','ProChat'],['bag','Billing'],['pin','Tracking']]
  .map(a=>'<button class="'+(a[2]?'on':'')+'" title="'+a[1]+'" aria-label="'+a[1]+'">'+svg(a[0],16)+'</button>').join('')
 +'<span class="sp"></span>'
 +[['gear','Settings'],['list','Activity']]
  .map(a=>'<button title="'+a[1]+'" aria-label="'+a[1]+'">'+svg(a[0],16)+'</button>').join('')
 +'<button id="btnTheme" title="Switch to dark mode" aria-label="Switch to dark mode" aria-pressed="false">'
 +'<svg id="themeIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" '
 +'stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+I.moon+'</svg></button>';
$('#rail').addEventListener('click',ev=>{const b=ev.target.closest('button');if(!b)return;
  if(b.id==='btnTheme')return;   /* the toggle is an action, not a destination */
  $$('#rail button').forEach(x=>x.classList.remove('on'));b.classList.add('on');
  if(b.title!=='Scheduler Planner') toast('<b>'+b.title+'</b> opens here');});

const btnTheme=$('#btnTheme');
function applyTheme(dark){
  document.documentElement.setAttribute('data-theme',dark?'dark':'light');
  $('#themeIcon').innerHTML=dark?I.sun:I.moon;
  const lab=dark?'Switch to light mode':'Switch to dark mode';
  btnTheme.title=lab; btnTheme.setAttribute('aria-label',lab); btnTheme.setAttribute('aria-pressed',String(dark));
  tkApplyTheme();
}
btnTheme.addEventListener('click',()=>{
  const dark=document.documentElement.getAttribute('data-theme')!=='dark';
  applyTheme(dark); Store.set('dpsx.theme',dark?'dark':'light'); toast(dark?'Dark mode on':'Light mode on');
});

/* ---- boot ---------------------------------------------------------------- */
applyTheme(Store.get('dpsx.theme','light')==='dark');
S.span=Store.get('dpsx.span',7);
S.mapStyle=Store.get('dpsx.map','auto');
S.sort=Store.get('dpsx.sort','name');
document.body.dataset.pane=S.pane;
renderLegend();
renderAll();
jumpToNow();

/* the viewport decides how wide a day is, so a resize is a re-layout */
let rT=null;
const onResize=()=>{ if(rT||S.pane!=='board'||!scEl.clientWidth) return;
  rT=requestAnimationFrame(()=>{rT=null;
    if(!scEl.clientWidth) return;
    const a=visibleWindow()[0];
    measure(); renderHead(); renderBody();
    scEl.scrollLeft=pct(a)/100*LANEW; renderMasthead();});
};
window.addEventListener('resize',onResize);
let tkT=null;
window.addEventListener('resize',()=>{ if(S.pane!=='track'||tkT) return;
  tkT=setTimeout(()=>{tkT=null; if(TKMAP&&$('#tkMap')){TKMAP.map.invalidateSize();tkPlacePing();return;}
    const b=BLOCKS.find(x=>x.id===TRACK_ID); if(b&&b.ref) drawTrackMap(trackModel(b));},80); });
if(window.ResizeObserver) new ResizeObserver(onResize).observe(scEl);

/* the now line and the "current time" read age out if the tab is left open */
setInterval(()=>{
  NOW.setTime(Date.now());
  renderHead(); renderMasthead(); renderStrip();
  const n=$('.bands .now'); if(n) n.style.left=pct(NOW).toFixed(4)+'%';
},60000);
</script>
