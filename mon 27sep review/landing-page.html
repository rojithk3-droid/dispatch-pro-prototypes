<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dispatch Pro TMS — Home</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&display=swap" rel="stylesheet">
<style>
/* ============================================================================
   DISPATCH PRO TMS — HOME  ·  shadcn/ui at 80%, editorial
   ----------------------------------------------------------------------------
   Every component below is a shadcn/ui recipe (Button, Badge, Card, Tabs,
   Input, Select, DropdownMenu, Popover, Dialog, Sheet, Table, Pagination,
   Calendar, Avatar, Tooltip, Sonner, Item, Empty) rendered at 80% of its
   spec so it sits at the app's density. The values are written as PAINTED
   pixels — no body zoom — so the board's own geometry (drag, resize,
   fixed-position menus, ResizeObserver charts) needs no compensation.

   Type: Inter everywhere — figures, codes and axes use Inter with tabular numerals.
   Ink: one neutral ramp, hairlines at --border, one accent (--blue) that is
   the hover colour for everything interactive. No elevation shadows —
   surfaces are separated by hairlines and background steps only.
   ========================================================================= */
:root{
  /* ---- brand + text ---------------------------------------------------- */
  --blue:#0F6FFF;  --blue-dark:#1667CA;  --blue-bg:#EFF6FF;  --blue-border:#DBEAFE;
  --red:#E7000B;
  --text-dark:#101828;  --text-heading:#1E2939;  --text-body:#364153;
  --text-muted:#6A7282; --text-faint:#99A1AF;
  --border:#E5E7EB;  --border-soft:#F3F4F6;  --input-border:#E4E7EC;
  --page-bg:#F9FAFB; --surface:#FFFFFF;  --segmented-track:#F3F4F6;
  --icon-default:#4A5468;
  --accent:#F4F4F5;  --accent-fg:#18181B;  --popover:#FFFFFF;  --muted-fg:#71717A;
  --ring:rgba(15,111,255,.5);  --ring-danger:rgba(231,0,11,.2);
  --shadow-xs:none; --shadow-sm:none; --shadow-md:none; --shadow-lg:none;
  --green:#19C936; --green-bg:#ECFDF5; --green-border:#A7F3D0;
  --amber:#B45309; --amber-bg:#FFFBEB; --amber-border:#FDE68A;
  --red-bg:#FEF2F2; --red-border:#FFE2E2;
  /* ---- three more accents, for icon chips and category colour only ------ */
  --orange:#F97316; --orange-bg:#FDF2EC;
  --violet:#7C3AED; --violet-bg:#F1EDFC;
  --teal:#2DD4BF;   --teal-bg:#E6F5F3;
  --pink:#EC4899;   --pink-bg:#FDF2F8;
  --gold:#F59E0B;   --gold-bg:#FDF3E2;
  --row-hover:#FAFAFA;
  --scrim:rgba(16,24,40,.32);
  /* ---- chart series: accent, ink, grey ---------------------------------- */
  --c1:#0F6FFF; --c2:#101828; --c3:#9CA3AF;
  /* ---- type scale (painted, all line-heights EVEN) ---------------------- */
  --fs-xs:10px;  --lh-xs:14px;
  --fs-sm:11px;  --lh-sm:16px;
  --fs-base:13px;--lh-base:20px;
  --fs-lg:14px;  --lh-lg:22px;
  --fs-xl:16px;  --lh-xl:22px;
  --fs-2xl:19px; --lh-2xl:26px;
  /* ---- control heights + radii ----------------------------------------- */
  --h-7:22px; --h-8:26px; --h-9:30px; --h-10:32px;
  --r-sm:3px; --r-md:5px; --r-lg:6px; --r-xl:10px;
  --ring-w:2px;
  --mono:'Inter',system-ui,sans-serif;   /* one face: figures rely on tabular-nums, not a second family */
  --rail-w:52px;
  --gap:12px;
  --roll-ms:1500;
}
:root[data-theme="dark"]{
  --page-bg:#0B1220;  --surface:#121B2E;  --segmented-track:#17202F;
  --border:#263248;  --border-soft:#1C2537;  --input-border:#2A3346;
  --text-dark:#F3F5F9; --text-heading:#E9EDF4; --text-body:#A6B0C3;
  --text-muted:#8B96AC; --text-faint:#7C879B;
  --blue-bg:#16233A; --blue-border:#2C3E60; --icon-default:#AEB6C7;
  --accent:#1B2539; --accent-fg:#FAFAFA; --popover:#121B2E; --muted-fg:#8B96AC;
  --ring:rgba(15,111,255,.55); --ring-danger:rgba(248,113,113,.26);
  --green:#19C936; --green-bg:#0E2A22; --green-border:#1C4638;
  --amber:#FCD34D; --amber-bg:#2A2113; --amber-border:#4A3A18;
  --red-bg:#2C1416; --red-border:#4A1F24;
  --orange:#F97316; --orange-bg:#33241F;
  --violet:#7C3AED; --violet-bg:#262445;
  --teal:#2DD4BF;   --teal-bg:#152B33;
  --pink:#EC4899;   --pink-bg:#331C2B;
  --gold:#F59E0B;   --gold-bg:#332710;
  --row-hover:rgba(255,255,255,.03);
  --scrim:rgba(0,0,0,.55);
  --c1:#0F6FFF; --c2:#E9EDF4; --c3:#64708A;
}
html{color-scheme:light}
html[data-theme="dark"]{color-scheme:dark}

*{box-sizing:border-box}
/* one face for the whole document — set on html so anything mounted outside
   body (and every SVG glyph) inherits Inter rather than a UA serif */
html,body{height:100%;font-family:'Inter',system-ui,-apple-system,"Segoe UI",sans-serif}
svg text,svg tspan{font-family:inherit}
body{
  margin:0;background:var(--page-bg);color:var(--text-body);
  font-family:'Inter',system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:var(--fs-sm);line-height:var(--lh-sm);
  font-feature-settings:"cv11","ss03";font-optical-sizing:auto;font-synthesis-weight:none;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;
  overflow:hidden;
}
h1,h2,h3,h4,h5{margin:0;font-weight:600;color:var(--text-dark);letter-spacing:-.2px}
p{margin:0}
a{color:inherit;text-decoration:none}
button,input,select,textarea,optgroup{font-family:inherit;font-size:inherit;line-height:inherit;color:inherit;font-feature-settings:inherit}
button{cursor:pointer}
svg{display:block}
.hide{display:none !important}
.tnum,.mono{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);letter-spacing:0;font-weight:500}
:focus-visible{outline:none;box-shadow:0 0 0 var(--ring-w) var(--ring)}
::selection{background:var(--blue-bg);color:var(--blue-dark)}

/* ---------- motion ------------------------------------------------------- */
@keyframes barIn{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes barInH{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes lineIn{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes cardIn{from{opacity:0}to{opacity:1}}
.anim-bar{transform-box:fill-box;transform-origin:bottom;transform:scaleY(0)}
.anim-barh{transform-box:fill-box;transform-origin:left;transform:scaleX(0)}
.anim-line{stroke-dasharray:1;stroke-dashoffset:1}
.anim-dot,.anim-txt{opacity:0}
.in .anim-bar{animation:barIn .8s cubic-bezier(.22,.9,.3,1) both}
.in .anim-barh{animation:barInH .8s cubic-bezier(.22,.9,.3,1) both}
.in .anim-line{animation:lineIn 1.1s cubic-bezier(.4,.6,.3,1) both}
.in .anim-dot{animation:fadeIn .4s ease .55s both}
.in .anim-txt{animation:fadeIn .45s ease .75s both}
.anim-area{opacity:1}
.in .anim-area{animation:fadeIn .85s ease .2s both}
/* opacity-only: a transform on a card would trap its fixed-position menus */
.card.fresh{animation:cardIn .32s ease both}
@media (prefers-reduced-motion:reduce){
  .anim-bar,.anim-barh{transform:none}
  .anim-line{stroke-dasharray:none;stroke-dashoffset:0}
  .anim-dot,.anim-txt{opacity:1}
  .in .anim-bar,.in .anim-barh,.in .anim-line,.in .anim-dot,.in .anim-txt,.in .anim-area,
  .card.fresh{animation:none}
  *{transition:none !important}
}

/* ---------- scrollbars --------------------------------------------------- */
*{scrollbar-width:thin;scrollbar-color:var(--input-border) transparent}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--input-border);border-radius:999px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:var(--text-faint);background-clip:padding-box}
::-webkit-scrollbar-corner{background:transparent}

/* ============================================================================
   PRIMITIVES — Button, Badge, Input, Select, Checkbox, Kbd, Avatar, Meter
   ========================================================================= */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  height:var(--h-9);padding:0 13px;border-radius:var(--r-md);
  border:1px solid transparent;background:var(--blue);color:#fff;
  font-size:var(--fs-sm);line-height:var(--lh-sm);font-weight:500;white-space:nowrap;
  box-shadow:var(--shadow-xs);
  transition:background .15s,border-color .15s,color .15s,box-shadow .15s}
.btn svg{width:14px;height:14px;flex:0 0 auto;pointer-events:none}
.btn:hover{background:var(--blue-dark)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.out,.btn[data-variant="outline"]{background:var(--surface);color:var(--text-heading);border-color:var(--input-border)}
.btn.out:hover,.btn[data-variant="outline"]:hover{border-color:var(--blue);color:var(--blue);background:var(--surface)}
.btn.ghost,.btn[data-variant="ghost"]{background:transparent;color:var(--text-body);border-color:transparent}
.btn.ghost:hover,.btn[data-variant="ghost"]:hover{background:var(--blue-bg);color:var(--blue)}
.btn.sec,.btn[data-variant="secondary"]{background:var(--accent);color:var(--accent-fg);border-color:transparent}
.btn.sec:hover,.btn[data-variant="secondary"]:hover{background:var(--blue-bg);color:var(--blue)}
.btn.pri{background:var(--blue);color:#fff;border-color:transparent}
.btn.pri:hover{background:var(--blue-dark)}
.btn.sm,.btn[data-size="sm"]{height:var(--h-8);padding:0 10px;gap:5px}
.btn.xs{height:var(--h-7);padding:0 8px;font-size:var(--fs-xs);line-height:var(--lh-xs);gap:4px;border-radius:var(--r-sm)}
.btn.icon,.btn[data-size="icon"]{width:var(--h-9);height:var(--h-9);padding:0}
.btn.icon-sm,.btn[data-size="icon-sm"]{width:var(--h-8);height:var(--h-8);padding:0}
.btn.link{background:none;border-color:transparent;color:var(--blue);padding:0;height:auto}
.btn.link:hover{text-decoration:underline;text-underline-offset:3px;background:none}
/* Link-styled text action (shadcn Button variant="link") */
.linky{display:inline-flex;align-items:center;gap:5px;height:var(--h-8);padding:0 8px;border:0;border-radius:var(--r-md);
  background:transparent;color:var(--text-body);font-size:var(--fs-sm);line-height:var(--lh-sm);font-weight:500;
  transition:background .15s,color .15s}
.linky svg{width:14px;height:14px}
.linky:hover{background:var(--blue-bg);color:var(--blue)}

/* ButtonGroup — one seam, outer corners only */
.split{display:inline-flex;position:relative;width:fit-content}
.split>.btn:first-child{border-radius:var(--r-md) 0 0 var(--r-md)}
.split>.btn.cap{border-radius:0 var(--r-md) var(--r-md) 0;width:var(--h-8);padding:0;margin-left:-1px;border-left-color:var(--input-border)}
.split>.btn:hover,.split>.btn:focus-visible{z-index:1}
.split>.btn.cap svg{transition:transform .16s}
.split.open>.btn.cap{background:var(--blue-bg);color:var(--blue);border-color:var(--blue)}
.split.open>.btn.cap svg{transform:rotate(180deg)}

/* ButtonGroup — several controls (each its own .split/.gwrap, for its own
   dropdown's position:relative anchor) fused into one banded control. Only
   the outer two corners round; the seam in between is squared and
   1px-collapsed so the group reads as one piece, not stacked buttons.
   Each wrapper also holds its own dropdown panel as a trailing sibling div,
   so ":last-child" lands on that panel, not the button — corners are keyed
   off the button classes instead. */
.btngroup{display:inline-flex;position:relative}
.btngroup>.split,.btngroup>.gwrap{display:inline-flex}
.btngroup>*:not(:first-child)>.btn:first-child{margin-left:-1px}
.btngroup .split>.btn.cap{border-radius:0}
.btngroup .gwrap>.btn{border-radius:0 var(--r-md) var(--r-md) 0}
.btngroup .gwrap>.btn:hover,.btngroup .gwrap>.btn:focus-visible{z-index:1}

.badge{display:inline-flex;align-items:center;justify-content:center;gap:4px;width:fit-content;
  padding:1px 6px;border-radius:var(--r-md);border:1px solid var(--border);background:var(--accent);
  color:var(--muted-fg);font-size:var(--fs-xs);line-height:14px;font-weight:500;white-space:nowrap;flex:0 0 auto}
.badge svg{width:10px;height:10px;flex:0 0 auto}
.badge.mono{font-family:var(--mono)}
.badge[data-variant="info"]{background:var(--blue-bg);border-color:var(--blue-border);color:var(--blue-dark)}
.badge[data-variant="success"]{background:var(--green-bg);border-color:var(--green-border);color:var(--green)}
.badge[data-variant="warning"]{background:var(--amber-bg);border-color:var(--amber-border);color:var(--amber)}
.badge[data-variant="danger"]{background:var(--red-bg);border-color:var(--red-border);color:var(--red)}
.badge[data-variant="solid"]{background:var(--text-dark);border-color:var(--text-dark);color:var(--surface)}
.badge[data-variant="outline"]{background:transparent}
:root[data-theme="dark"] .badge[data-variant="info"]{color:#93C5FD}
:root[data-theme="dark"] .badge[data-variant="danger"]{color:#FCA5A5}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor;display:inline-block;flex:0 0 auto}

.kbd{display:inline-flex;align-items:center;height:16px;padding:0 4px;border-radius:var(--r-sm);
  border:1px solid var(--border);background:var(--page-bg);color:var(--muted-fg);
  font-family:var(--mono);font-size:var(--fs-xs);line-height:14px;font-weight:500}

/* Input + Select (native select, shadcn trigger skin) */
.text-input,.sel{
  height:var(--h-9);border:1px solid var(--input-border);border-radius:var(--r-md);background:var(--surface);
  padding:0 10px;font-size:var(--fs-sm);line-height:var(--lh-sm);color:var(--text-body);
  box-shadow:var(--shadow-xs);transition:border-color .15s,box-shadow .15s}
.text-input::placeholder{color:var(--muted-fg)}
.sel{appearance:none;padding-right:26px;min-width:132px;cursor:pointer;font-weight:500;color:var(--text-heading);
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%2371717A' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='m6 9 6 6 6-6'/></svg>");
  background-repeat:no-repeat;background-position:right 8px center}
:root[data-theme="dark"] .sel{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%238B96AC' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='m6 9 6 6 6-6'/></svg>")}
.text-input:hover,.sel:hover{border-color:var(--blue)}
.text-input:focus,.sel:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 var(--ring-w) var(--ring)}
.sel[disabled]{opacity:.5;cursor:not-allowed}
.sel.sm{height:var(--h-8);min-width:0;padding:0 24px 0 8px}

/* Checkbox */
.cb{appearance:none;width:14px;height:14px;margin:0;flex:0 0 14px;border:1px solid var(--input-border);border-radius:var(--r-sm);
  background:var(--surface);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;
  transition:background .12s,border-color .12s}
.cb:hover{border-color:var(--blue)}
.cb:checked{background:var(--blue);border-color:var(--blue)}
.cb:checked::after{content:"";width:9px;height:9px;
  background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='white' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'><polyline points='20 6 9 17 4 12'/></svg>") center/contain no-repeat}

/* Avatar */
.av{position:relative;width:28px;height:28px;border-radius:50%;flex:0 0 28px;display:grid;place-items:center;
  background:var(--accent);border:1px solid var(--border);color:var(--text-heading);
  font-size:var(--fs-xs);line-height:14px;font-weight:600;letter-spacing:.2px}
.av .pres{position:absolute;right:-1px;bottom:-1px;width:6px;height:6px;border-radius:50%;background:var(--green);
  border:2px solid var(--surface);box-sizing:content-box}
.av .pres.off{background:var(--text-faint)}


/* Tooltip (CSS, for controls that carry data-tip) — scoped outside #board:
   board content has its own cursor-following JS tooltip (see "message row
   tooltip" below), and letting this generic ::after also match board rows
   collided with their own ::after pseudo-elements (e.g. .msg's divider
   line), producing a stray unstyled box on hover. */
.pagehead [data-tip]{position:relative}
.pagehead [data-tip]::after{content:attr(data-tip);position:absolute;top:calc(100% + 6px);left:50%;transform:translateX(-50%);
  background:var(--text-dark);color:var(--surface);font-size:var(--fs-xs);line-height:14px;font-weight:500;white-space:nowrap;
  padding:4px 7px;border-radius:var(--r-md);opacity:0;pointer-events:none;transition:opacity .14s;z-index:160}
.pagehead [data-tip]:hover::after{opacity:1}
.pagehead [data-tip][aria-expanded="true"]::after{opacity:0 !important}

/* ============================================================================
   APP SHELL — topbar, module nav, icon rail, scroll region
   ========================================================================= */
.app{display:flex;flex-direction:column;height:100%}
.appbar{
  background:var(--surface);color:var(--text-body);height:55px;flex:0 0 55px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:12px;padding:0 14px 0 12px;z-index:70;position:relative}
.logo{display:flex;align-items:center;gap:8px;padding-right:12px;border-right:1px solid var(--border);height:26px}
.logo i{width:26px;height:26px;border-radius:var(--r-lg);background:var(--text-dark);color:var(--surface);
  display:grid;place-items:center;font-style:normal;font-weight:700;font-size:var(--fs-xs);line-height:14px;letter-spacing:.3px}
.logo b{font-size:var(--fs-base);line-height:var(--lh-base);font-weight:600;color:var(--text-dark);letter-spacing:-.2px;white-space:nowrap}
.tenant{font-size:var(--fs-sm);font-weight:500;color:var(--text-muted);white-space:nowrap;display:flex;align-items:center;gap:6px}
.tenant .dot{background:var(--green)}
.gsearch{position:relative;margin-left:auto;width:min(360px,32vw);display:flex;align-items:center;height:var(--h-9);
  border:1px solid var(--input-border);border-radius:var(--r-md);background:var(--page-bg);padding:0 6px 0 9px;gap:7px;
  transition:border-color .15s,box-shadow .15s,background .15s}
.gsearch:hover{border-color:var(--blue)}
.gsearch:focus-within{border-color:var(--blue);box-shadow:0 0 0 var(--ring-w) var(--ring);background:var(--surface)}
.gsearch>svg{width:14px;height:14px;color:var(--muted-fg);flex:0 0 auto}
.gsearch input{flex:1;min-width:0;height:100%;border:0;background:transparent;padding:0;color:var(--text-heading);outline:none}
.gsearch input::placeholder{color:var(--muted-fg)}
.gsearch button{border:0;background:transparent;padding:0;color:var(--muted-fg);display:grid;place-items:center;height:20px}
.gsearch button:hover .kbd{color:var(--blue);border-color:var(--blue)}
.abicons{display:flex;align-items:center;gap:2px;margin-left:auto}
.abicons button{width:var(--h-9);height:var(--h-9);border:0;border-radius:var(--r-md);background:transparent;color:var(--icon-default);
  display:grid;place-items:center;position:relative;transition:background .14s,color .14s}
.abicons button svg{width:16px;height:16px}
.abicons button:hover{background:var(--blue-bg);color:var(--blue)}
.abicons .pip{position:absolute;top:6px;right:7px;width:6px;height:6px;border-radius:50%;background:var(--red);border:2px solid var(--surface);box-sizing:content-box}
.me{display:flex;align-items:center;gap:8px;height:var(--h-9);padding:0 6px 0 4px;margin-left:6px;border-radius:var(--r-md);
  cursor:pointer;white-space:nowrap;transition:background .14s}
.me:hover{background:var(--blue-bg)}
.me:hover span{color:var(--blue)}
.me .face{width:24px;height:24px;border-radius:50%;background:var(--accent);border:1px solid var(--border);display:grid;place-items:center;
  font-size:var(--fs-xs);line-height:14px;font-weight:600;color:var(--text-heading)}
.me span{font-size:var(--fs-sm);font-weight:500;color:var(--text-heading)}
.me svg{width:12px;height:12px;color:var(--muted-fg)}

/* module nav — shadcn Tabs, line variant */
.modnav{background:var(--surface);border-bottom:1px solid var(--border);height:37px;flex:0 0 37px;
  display:flex;align-items:stretch;padding:0 14px 0 calc(var(--rail-w) + 10px);gap:2px;overflow-x:auto;z-index:60}
.modnav a{display:flex;align-items:center;padding:0 10px;font-size:var(--fs-sm);font-weight:500;color:var(--text-muted);
  border-bottom:2px solid transparent;white-space:nowrap;transition:color .14s,border-color .14s;margin-bottom:-1px}
.modnav a:hover{color:var(--blue)}
.modnav a.on{color:var(--text-dark);border-bottom-color:var(--blue)}

/* left icon rail */
.rail{position:fixed;left:0;top:55px;bottom:0;width:var(--rail-w);background:var(--surface);border-right:1px solid var(--border);
  display:flex;flex-direction:column;align-items:center;padding:8px 0;gap:2px;z-index:65}
.rail button{width:32px;height:30px;border:0;border-radius:var(--r-md);background:transparent;color:var(--icon-default);
  display:grid;place-items:center;transition:background .14s,color .14s;position:relative}
.rail button svg{width:16px;height:16px}
.rail button:hover{background:var(--blue-bg);color:var(--blue)}
.rail button.on{background:var(--blue-bg);color:var(--blue)}
.rail button.on::before{content:"";position:absolute;left:-10px;top:8px;bottom:8px;width:2px;border-radius:2px;background:var(--blue)}
.rail .sp{flex:1}

/* main scroll region */
.main{flex:1;min-height:0;overflow:auto;padding:0 0 40px var(--rail-w);scroll-behavior:smooth}

/* ============================================================================
   PAGE HEAD — title block + toolbar
   ========================================================================= */
.pagehead{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;padding:18px 18px 14px}
.pagehead .ttl h1{font-size:var(--fs-2xl);line-height:var(--lh-2xl);font-weight:600;letter-spacing:-.4px}
.pagehead .ttl p{font-size:var(--fs-sm);line-height:var(--lh-sm);color:var(--text-muted);margin-top:2px;display:flex;align-items:center;gap:6px}
.pagehead .ttl p .dot{background:var(--text-faint);width:4px;height:4px}
.controls{margin-left:auto;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.fld{display:flex;align-items:center}
.gwrap{position:relative}
#btnGraphs .badge{margin-left:2px}

/* ============================================================================
   MENUS — DropdownMenu (Create Profile), Popover (Graphs picker)
   ========================================================================= */
.menu{position:absolute;top:calc(100% + 4px);right:0;min-width:232px;background:var(--popover);border:1px solid var(--border);
  border-radius:var(--r-lg);box-shadow:var(--shadow-md);padding:4px;z-index:120;max-height:min(72vh,560px);overflow:auto;
  opacity:0;pointer-events:none;transition:opacity .12s}
.menu.show{opacity:1;pointer-events:auto}
.menu h5{font-size:var(--fs-xs);line-height:var(--lh-xs);font-weight:500;color:var(--muted-fg);letter-spacing:.3px;text-transform:uppercase;padding:6px 8px 4px}
.menu button{width:100%;display:flex;align-items:center;gap:8px;min-height:28px;padding:4px 8px;border:0;border-radius:var(--r-sm);
  background:transparent;text-align:left;font-size:var(--fs-sm);line-height:var(--lh-sm);font-weight:400;color:var(--text-heading);
  transition:background .12s,color .12s}
.menu button>svg{width:14px;height:14px;flex:0 0 auto;color:var(--muted-fg)}
.menu button:hover{background:var(--blue-bg);color:var(--blue)}
.menu button:hover>svg,.menu button:hover .tick{color:var(--blue)}
.menu button .tick{margin-left:auto;color:var(--blue);opacity:0;display:flex}
.menu button .tick svg{width:14px;height:14px}
.menu button.on .tick{opacity:1}
.menu button.on{font-weight:500;color:var(--text-dark)}
.menu hr{border:0;border-top:1px solid var(--border-soft);margin:4px -4px}
.menu .sub{font-size:var(--fs-xs);line-height:var(--lh-xs);color:var(--muted-fg);font-weight:400;display:block}
.menu button:hover .sub{color:var(--blue)}
.menu button .txt{display:flex;flex-direction:column;min-width:0;flex:1}
.menu .dflt{margin-left:auto;font-size:var(--fs-xs);line-height:14px;color:var(--muted-fg);border:1px solid var(--border);border-radius:var(--r-sm);padding:0 4px;background:var(--accent)}
.menu button.danger{color:var(--red)}
.menu button.danger>svg{color:var(--red)}
.menu button.danger:hover{background:var(--red-bg);color:var(--red)}
.menu button.danger:hover>svg{color:var(--red)}

/* Graphs picker — Popover with a Command-style checklist */
.gpanel{position:absolute;top:calc(100% + 4px);right:0;width:300px;background:var(--popover);border:1px solid var(--border);
  border-radius:var(--r-lg);box-shadow:var(--shadow-md);z-index:150;overflow:hidden;
  opacity:0;pointer-events:none;transition:opacity .12s}
.gpanel.show{opacity:1;pointer-events:auto}
.gp-top{display:flex;align-items:center;gap:4px;padding:8px 8px;border-bottom:1px solid var(--border-soft)}
.gp-top .gp-ttl{font-size:var(--fs-sm);font-weight:600;color:var(--text-dark);margin-right:auto;padding-left:4px}
.gp-top button{height:var(--h-7);padding:0 7px;border:0;border-radius:var(--r-sm);background:transparent;color:var(--text-muted);
  font-size:var(--fs-xs);line-height:var(--lh-xs);font-weight:500;transition:background .12s,color .12s}
.gp-top button:hover{background:var(--blue-bg);color:var(--blue)}
.gp-list{max-height:340px;overflow:auto;padding:4px}
.gp-row{display:flex;align-items:center;gap:9px;padding:0 8px;height:28px;border-radius:var(--r-sm);cursor:pointer;transition:background .12s}
.gp-row:hover{background:var(--blue-bg)}
.gp-row:hover span{color:var(--blue)}
.gp-row span{font-size:var(--fs-sm);line-height:var(--lh-sm);font-weight:500;color:var(--text-heading);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gp-row.off span{color:var(--text-muted);font-weight:400}
.gp-row .badge{margin-left:auto}
.gp-foot{border-top:1px solid var(--border-soft);padding:6px}
.gp-foot button{width:100%;display:flex;align-items:center;gap:7px;height:28px;padding:0 8px;border:0;border-radius:var(--r-sm);
  background:transparent;color:var(--text-heading);font-size:var(--fs-sm);font-weight:500;transition:background .12s,color .12s}
.gp-foot button svg{width:14px;height:14px;color:var(--muted-fg)}
.gp-foot button:hover{background:var(--blue-bg);color:var(--blue)}
.gp-foot button:hover svg{color:var(--blue)}

/* ============================================================================
   BOARD + CARD
   ========================================================================= */
.board{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:var(--gap);align-items:start;padding:0 18px;position:relative}
.card{grid-column:span 3;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-xl);
  box-shadow:var(--shadow-sm);display:flex;flex-direction:column;min-width:0;overflow:hidden;position:relative;
  transition:border-color .16s}
.card:hover{border-color:var(--blue-border)}
:root[data-theme="dark"] .card:hover{border-color:#34507A}
.card.dragging{position:fixed;margin:0;z-index:200;pointer-events:none;opacity:1;cursor:grabbing;will-change:transform;
  border-color:var(--blue);background:var(--surface)}
.card-ph{border:1px dashed var(--blue);border-radius:var(--r-xl);background:var(--blue-bg);min-width:0}
.card.shifting{transition:transform .22s cubic-bezier(.22,.9,.3,1)}
.card.landing{transition:transform .19s cubic-bezier(.22,.9,.3,1)}
body.dragging *{cursor:grabbing !important}
body.dragging,body.dragging *{user-select:none !important;-webkit-user-select:none !important}
.card.resizing{border-color:var(--blue);user-select:none}
.card.menuopen{border-color:var(--blue)}

/* masthead: title + live meta line, tools revealed on hover */
.chead{display:flex;align-items:center;gap:8px;padding:9px 10px 9px 14px;border-bottom:1px solid var(--border-soft);
  cursor:grab;flex:0 0 auto;user-select:none;-webkit-user-select:none;touch-action:none}
.chead:active{cursor:grabbing}
.ctext{min-width:0;flex:1;display:flex;flex-direction:column}
.clead{flex:0 0 auto;display:flex;color:var(--text-dark)}
.chead h3{font-size:var(--fs-base);line-height:18px;font-weight:600;color:var(--text-dark);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.2px}
.cmeta{font-size:var(--fs-xs);line-height:var(--lh-xs);color:var(--muted-fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  display:flex;align-items:center;gap:5px;min-height:14px}
.cmeta .dot{width:4px;height:4px;background:var(--text-faint)}
.cmeta .mono{font-size:var(--fs-xs)}
.ctools{display:flex;align-items:center;gap:2px;flex:0 0 auto;opacity:0;transition:opacity .14s}
.card:hover .ctools,.card:focus-within .ctools,.card.menuopen .ctools,.card.dragging .ctools,.card.resizing .ctools{opacity:1}
.copt{display:grid;place-items:center;width:var(--h-8);height:var(--h-8);padding:0;border:0;border-radius:var(--r-md);
  background:transparent;color:var(--muted-fg);flex:0 0 auto;transition:background .14s,color .14s}
.copt svg{width:14px;height:14px}
.copt:hover{background:var(--blue-bg);color:var(--blue)}
.card.menuopen .copt{background:var(--blue-bg);color:var(--blue)}
.chead .grip{width:var(--h-8);height:var(--h-8);display:grid;place-items:center;color:var(--text-faint);border-radius:var(--r-md);cursor:grab;flex:0 0 auto;transition:color .14s,background .14s}
.chead .grip svg{width:14px;height:14px}
.chead .grip:hover{color:var(--blue);background:var(--blue-bg)}
.chead .grip:active{cursor:grabbing}
.cbody{flex:1;min-height:0;overflow:auto;padding:10px 14px 12px;container-type:inline-size}
.cbody.flush{padding:0}

/* resize handle */
.rsz{position:absolute;right:0;bottom:0;width:18px;height:18px;cursor:nwse-resize;z-index:6;opacity:0;transition:opacity .14s}
.card:hover .rsz{opacity:1}
.rsz::after{content:"";position:absolute;right:5px;bottom:5px;width:7px;height:7px;border-right:1px solid var(--text-faint);border-bottom:1px solid var(--text-faint);border-radius:0 0 2px 0}
.rsz:hover::after{border-color:var(--blue)}
.ghosthint{position:fixed;z-index:200;background:var(--text-dark);color:var(--surface);font-size:var(--fs-xs);line-height:14px;font-weight:500;
  font-family:var(--mono);padding:4px 7px;border-radius:var(--r-md);pointer-events:none;opacity:0;transition:opacity .12s}
.ghosthint.show{opacity:1}

/* card tabs — segmented control, sm */
.tabs{display:inline-flex;align-items:center;height:var(--h-8);padding:2px;gap:0;margin:10px 14px 0;flex:0 0 auto;width:fit-content;
  background:var(--segmented-track);border:1px solid var(--border);border-radius:var(--r-lg)}
.tabs button{height:100%;padding:0 9px;border:0;border-radius:var(--r-sm);background:transparent;color:var(--muted-fg);
  font-size:var(--fs-xs);line-height:var(--lh-xs);font-weight:500;white-space:nowrap;transition:background .14s,color .14s}
.tabs button:not(.on):hover{background:var(--blue-bg);color:var(--blue)}
.tabs button.on{background:var(--surface);color:var(--text-dark);border:1px solid var(--border)}
.tabs + .cbody{padding-top:8px}


/* ---------- Communication Center -----------------------------------------
   The action button is hover/focus-only — resting state is just the row's
   own content plus, if it's unread, the count pip. The button is still laid
   out at rest (opacity 0, collapsed to 0 width via max-width, not
   display:none), so nothing reflows when it appears: it grows in from the
   right and the pip — which never moved, it just had empty space to its
   right the whole time — reads as sliding left to make room for it. */
.msg{display:flex;align-items:center;gap:10px;padding:8px 8px;margin:0 -8px;border-radius:var(--r-lg);cursor:pointer;
  position:relative}
.msg::after{content:"";position:absolute;left:46px;right:8px;bottom:0;border-bottom:1px solid var(--border-soft)}
.msg:last-child::after{display:none}
.msg .who{min-width:0;flex:1 1 40%}
.msg .who b{font-size:var(--fs-sm);line-height:var(--lh-sm);font-weight:600;color:var(--text-dark);display:flex;align-items:center;gap:6px;min-width:0}
.msg .who b .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.msg .who p{font-size:var(--fs-sm);line-height:var(--lh-sm);color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msg .who p em{display:inline-block;vertical-align:top;line-height:16px;font-style:normal;font-family:var(--mono);font-size:var(--fs-xs);color:var(--text-faint);margin-right:6px}
.msg:hover .who p,.msg:focus-within .who p{color:var(--blue-dark)}
.msg .act{flex:0 0 auto;display:flex;align-items:center;gap:6px;min-height:22px}
.msg .act .btn{min-width:0;max-width:0;padding-left:0;padding-right:0;opacity:0;overflow:hidden;
  white-space:nowrap;pointer-events:none;
  transition:max-width .18s cubic-bezier(.22,.9,.3,1),padding .18s cubic-bezier(.22,.9,.3,1),opacity .14s ease}
.msg:hover .act .btn,.msg:focus-within .act .btn{min-width:64px;max-width:80px;padding-left:8px;padding-right:8px;
  opacity:1;pointer-events:auto}
.pipn{display:inline-grid;place-items:center;min-width:16px;height:16px;padding:0 4px;border-radius:999px;background:var(--blue);color:#fff;
  font-size:var(--fs-xs);line-height:14px;font-weight:600;font-variant-numeric:tabular-nums;flex:0 0 auto}

/* ---------- Calendar (My Time Off) -------------------------------------- */
.calhead{display:flex;align-items:center;gap:4px;margin-bottom:6px;height:var(--h-8)}
.calhead b{font-size:var(--fs-sm);font-weight:600;color:var(--text-dark);margin-right:auto;padding-left:2px}
.calhead .btn.icon-sm{color:var(--muted-fg)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px;text-align:center}
.cal .dw{font-size:var(--fs-xs);line-height:var(--lh-xs);font-weight:500;color:var(--muted-fg);padding:3px 0 4px}
.cal .dw,.cal .d{min-width:0}
.cal .d{height:26px;display:grid;place-items:center;font-size:var(--fs-sm);line-height:var(--lh-sm);border-radius:var(--r-md);
  font-variant-numeric:tabular-nums;cursor:pointer;color:var(--text-heading);transition:background .12s,color .12s;position:relative}
.cal .d.mut{color:var(--text-faint)}
.cal .d.mark{font-weight:600}
.cal .d.mark::after{content:"";position:absolute;bottom:3px;left:50%;margin-left:-2px;width:4px;height:4px;border-radius:50%;background:var(--dot-c,var(--blue))}
.cal .d.pending{border-radius:999px;box-shadow:inset 0 0 0 1.5px var(--gold)}
.cal .d.sel{border-radius:999px;box-shadow:inset 0 0 0 1.5px var(--blue);font-weight:600}
.cal .d:hover:not(.sel){background:var(--blue-bg);color:var(--blue)}
.toff-foot{position:sticky;bottom:-12px;background:var(--surface);padding:8px 0 12px;margin-top:6px;border-top:1px solid var(--border-soft)}
.balance{font-size:var(--fs-xs);line-height:var(--lh-xs);font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--text-faint)}
/* three allowances, each its own accent — a fine track, not a masked pill */
.balrows{display:flex;flex-direction:column;gap:9px;margin-top:8px}
.balrows .r{display:flex;align-items:center;gap:10px}
.balrows .n{width:68px;flex:none;display:flex;align-items:center;gap:6px;font-size:var(--fs-sm);line-height:var(--lh-sm);font-weight:600;color:var(--text-body);white-space:nowrap}
.balrows .n i{width:7px;height:7px;border-radius:50%;flex:none}
/* named .track, not .rail — that class is the left sidebar's, position:fixed
   and everything, so a descendant here would inherit it and vanish */
.balrows .track{flex:1;height:4px;border-radius:2px;background:var(--segmented-track);overflow:hidden}
.balrows .track i{display:block;height:100%;border-radius:2px;transform-origin:left;animation:railIn .9s cubic-bezier(.22,.9,.3,1) both}
.balrows .v{width:56px;flex:none;text-align:right;font-family:var(--mono);font-size:var(--fs-sm);font-weight:600;
  font-variant-numeric:tabular-nums;color:var(--text-dark)}
.balrows .v s{text-decoration:none;font-weight:500;color:var(--text-faint)}

/* ---------- Dashboard tiles (stretched icon grid) -------------------------
   Two earlier attempts here: a 3x3 grid of square badges clipped longer
   labels ("Dispatch Hub", "Quarter End"); a 2-column command-row list fixed
   that but, sized to its own content, left a block of dead space under it
   inside the card's fixed h:296. This keeps the 3x3 grid — it's the shape
   that actually uses a square card's space well — but the row heights now
   come from `grid-auto-rows:1fr` on a full-height `.tiles`, so the nine
   cells stretch to fill whatever height the card has instead of the grid
   sizing to content and leaving a gap. The label can wrap to a second line
   instead of being clipped, since each cell now has the room for it. */
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-auto-rows:1fr;gap:8px;height:100%}
.tile{border:1px solid var(--border);border-radius:var(--r-xl);padding:8px 6px;background:var(--surface);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;transition:border-color .14s,background .14s}
.tile .tico{width:34px;height:34px;border-radius:var(--r-lg);display:grid;place-items:center;flex:none;
  background:var(--accent);color:var(--icon-default);transition:background .14s,color .14s}
.tile .tico svg{width:17px;height:17px}
.tile span:last-child{font-size:var(--fs-xs);line-height:var(--lh-xs);font-weight:600;color:var(--text-body);
  text-align:center;transition:color .14s}
.tile:hover,.tile:focus-visible{border-color:var(--blue);background:var(--blue-bg)}
.tile:hover .tico,.tile:focus-visible .tico{background:var(--blue);color:#fff}
.tile:hover span:last-child,.tile:focus-visible span:last-child{color:var(--blue-dark)}

/* ---------- Dawson News: photo carousel -----------------------------------
   Ported verbatim from dashboard-home.html's own build of this card, at the
   user's request to match it exactly: a full-bleed press photo under a
   bottom-weighted scrim, the department tag floating over it, masthead and
   controls on top, a vertical dot rail. The one card that deliberately sits
   outside the rest of the board's flat-surface, bordered-card language. */
.newscard{background:#0B1724;border-color:#0B1724}
.newscard:hover{border-color:#22344A}
.newscard .cbody{padding:0;position:relative;background:transparent;overflow:hidden}
/* a "bare" card has no header strip — the artwork runs full height and the
   controls float on top, appearing only on hover; the title stays in the DOM
   for screen readers. */
.card.bare .chead{position:absolute;top:0;left:0;right:0;z-index:5;
  justify-content:flex-end;padding:12px 14px;cursor:grab;background:0;border:0}
.card.bare .chead::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(rgba(0,0,0,.42),rgba(0,0,0,0));opacity:0;transition:opacity .16s}
.card.bare:hover .chead::before,.card.bare:focus-within .chead::before,
.card.bare.menuopen .chead::before,.card.bare.dragging .chead::before,
.card.bare.resizing .chead::before{opacity:1}
.card.bare .ctools{opacity:0;transition:opacity .16s}
.card.bare:hover .ctools,.card.bare:focus-within .ctools,.card.bare.menuopen .ctools,
.card.bare.dragging .ctools,.card.bare.resizing .ctools{opacity:1}
.card.bare .chead h3,.card.bare .chead .cmeta,.card.bare .clead{position:absolute;width:1px;height:1px;
  overflow:hidden;clip-path:inset(50%);white-space:nowrap;margin:0;padding:0}
.card.bare .copt,.card.bare .chead .grip{position:relative;z-index:1;color:#fff}
.card.bare .copt{background:rgba(255,255,255,.18)}
.card.bare .copt:hover{background:rgba(255,255,255,.34);color:#fff}
.card.bare.menuopen .copt{background:rgba(255,255,255,.4);color:#fff}
.card.bare .chead .grip{filter:drop-shadow(0 1px 4px rgba(0,0,0,.7))}
.card.bare .chead .grip:hover{filter:drop-shadow(0 1px 5px rgba(0,0,0,.9))}
.nw{position:absolute;inset:0}
.nw-stage{position:absolute;inset:0;overflow:hidden}
.nw-page{position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity .5s ease}
.nw-page.on{opacity:1;pointer-events:auto}
.card.dragging .nw-page{pointer-events:none}
.nw-ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.nw-scrim{position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(0,0,0,.08) 0%,rgba(0,0,0,.18) 30%,
    rgba(0,0,0,.72) 62%,rgba(0,0,0,.93) 100%)}
/* the section masthead belongs to the card, not any one story, so it sits
   outside the pages and stays put while they cross-fade — always visible,
   independent of the hover-only options/grip strip above it. */
.nw-mast{position:absolute;left:16px;top:14px;z-index:6;display:inline-flex;align-items:center;gap:6px;
  pointer-events:none;font-size:12px;font-weight:600;letter-spacing:-.01em;color:#fff;
  text-shadow:0 1px 8px rgba(0,0,0,.75),0 0 2px rgba(0,0,0,.55)}
.nw-mast svg{opacity:.9;filter:drop-shadow(0 1px 4px rgba(0,0,0,.6))}
/* the category tag tints and outlines itself from the department's own
   accent — one inline --nwrgb drives the fill, border and byline dot */
.nw-tag{position:absolute;left:16px;top:42px;z-index:3;display:inline-flex;align-items:center;height:21px;
  padding:0 10px;border-radius:999px;background:rgba(var(--nwrgb),.16);
  border:1px solid rgba(var(--nwrgb),.44);backdrop-filter:blur(6px);
  font-size:9px;font-weight:700;letter-spacing:1.44px;text-transform:uppercase;color:#fff}
.nw-in{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:8px 20px 16px;color:#fff}
.nw-story{background:0;border:0;padding:0;text-align:left;cursor:pointer;color:#fff;width:100%}
.nw-story h4{font-size:17px;font-weight:600;line-height:23px;letter-spacing:0;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.nw-story:hover h4{text-decoration:underline;text-underline-offset:3px}
.nw-sum{font-size:11.5px;line-height:18.7px;color:rgba(255,255,255,.78);padding-top:4px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.nw-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:12px;min-width:0}
.nw-by{display:flex;align-items:center;gap:10px;min-width:0}
.nw-date{flex:none;background:rgba(255,255,255,.12);border-radius:4px;padding:2px 8px;font-style:normal;
  font-size:10.5px;font-weight:500;line-height:15.75px;color:rgba(255,255,255,.85);font-variant-numeric:tabular-nums}
.nw-desk{display:flex;align-items:center;gap:4px;min-width:0;font-size:10.5px;line-height:15.75px;
  color:rgba(255,255,255,.55);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdot{width:6px;height:6px;border-radius:999px;background:var(--nwc);flex:none}
.nw-more{flex:none;display:inline-flex;align-items:center;gap:4px;background:0;border:0;padding:0;
  cursor:pointer;color:#fff;font-size:10.5px;font-weight:600;line-height:15.75px}
.nw-more svg{transition:transform .16s cubic-bezier(.22,.9,.3,1)}
.nw-more:hover svg{transform:translateX(2px)}
/* a card squeezed to span 2 drops the byline rather than ellipsing every
   part of the footer */
@container (max-width:250px){ .nw-desk{display:none} }
/* arrows, dot rail, hover bubble — the rail runs down the right edge and the
   active story is a stretched pill rather than a filled circle */
.narw{position:absolute;top:50%;transform:translateY(-50%);z-index:4;width:24px;height:24px;
  border-radius:50%;background:rgba(255,255,255,.18);border:0;color:#fff;display:grid;
  place-items:center;cursor:pointer;opacity:0;transition:.14s opacity,.14s background}
.newscard:hover .narw{opacity:1}
.narw:hover{background:rgba(255,255,255,.36)}
.narw.l{left:8px}.narw.r{right:8px}
.nw-dots{position:absolute;right:16px;top:16px;z-index:5;display:flex;flex-direction:column;align-items:center;gap:6px}
.nw-dots i{width:5px;height:5px;border-radius:999px;background:rgba(255,255,255,.3);cursor:pointer;
  transition:.16s height,.16s width,.16s background}
.nw-dots i.on{width:6px;height:18px;background:#fff}
.nw-bub{position:absolute;right:100%;margin-right:8px;top:50%;transform:translateY(-50%);z-index:6;
  background:rgba(10,20,32,.94);color:#fff;font-size:11px;font-weight:600;white-space:nowrap;
  padding:5px 9px;border-radius:6px;opacity:0;pointer-events:none;transition:opacity .14s;
  box-shadow:0 6px 18px rgba(0,0,0,.4)}
.nw-bub.on{opacity:1}
/* product updates: a changelog list on a brand panel instead of a photo —
   same page frame, so it rides the same masthead, tag and rail. */
.nw-page.upd{background:linear-gradient(155deg,#14315E 0%,#0B1A33 100%)}
/* .nw-tag sits at top:42/height:21 (bottom edge 63px) — the list starts
   comfortably clear of it, not flush against it */
.upd-list{position:absolute;inset:76px 0 0;z-index:2;padding:0 16px 14px;
  display:flex;flex-direction:column;gap:10px;overflow:auto}
.upd-row{background:0;border:0;padding:0;width:100%;text-align:left;display:grid;gap:3px;cursor:pointer}
.upd-h{display:flex;align-items:center;gap:6px;min-width:0}
.upd-h b{font-size:12px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.upd-v{flex:none;font-size:9.5px;font-weight:700;color:rgba(255,255,255,.66);
  background:rgba(255,255,255,.13);border-radius:999px;padding:1px 7px;font-variant-numeric:tabular-nums}
.upd-k{flex:none;font-size:8.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  border-radius:999px;padding:1px 7px}
.upd-row p{margin:0;font-size:10.5px;line-height:1.45;color:rgba(255,255,255,.6);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
@media (prefers-reduced-motion:reduce){ .nw-page{transition:none} }

/* the shared "linked figure" primitive — a drill-down opens on click,
   wherever it's used (Analytics tiles, Status rows/tiles, ranked rows) */
.drill{font-family:var(--mono);font-weight:500;font-size:var(--fs-base);line-height:18px;padding-bottom:1px;font-variant-numeric:tabular-nums;color:var(--text-dark);
  background:0;border:0;padding:0 0 1px;border-bottom:1px solid var(--border);transition:color .14s,border-color .14s}
.drill:hover{color:var(--blue);border-bottom-color:var(--blue)}

/* ---------- Analytics: stat tiles, each its own 8-block meter -----------
   Named .atile, not .stat — that class already belongs to Company Stats'
   plain number+caption tile, a different shape entirely. */
.atiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.atile{border:1px solid var(--border);border-radius:var(--r-xl);padding:10px 11px 11px;transition:border-color .14s,background .14s}
.atile:hover{border-color:var(--blue)}
.atile .sl{font-size:var(--fs-sm);line-height:var(--lh-sm);font-weight:600;color:var(--text-muted)}
.atile .sv{margin:2px 0 8px}
.atile .sv .drill{font-size:20px;line-height:1;font-weight:700;letter-spacing:-.03em;font-family:inherit;
  font-variant-numeric:tabular-nums;color:var(--text-dark);border-bottom:0;padding:0}
.atile .sv .drill:hover{color:var(--blue)}
.atile .blocks{display:flex;gap:2.5px}
.atile .blocks i{flex:1;height:13px;border-radius:3px;background:var(--segmented-track)}
.atile .blocks i.on{background:var(--blue)}
.atile.warn{border-color:var(--amber-border);background:var(--amber-bg)}
.atile.warn .sl,.atile.warn .sv .drill{color:var(--amber)}
.atile.warn .sv .drill:hover{color:var(--blue)}
.atile.warn .blocks i.on{background:var(--gold)}

/* ---------- Status: flow rows on a shared bar, exceptions as tiles ------ */
.splitbody{display:flex;flex-direction:column;height:100%}
.srows{display:flex;flex-direction:column;gap:7px}
.srow{display:flex;align-items:center;gap:10px}
/* "Pending Confirmation" is the long pole — wrap it rather than cut it */
.srow .sl{width:44%;flex:none;font-size:var(--fs-sm);line-height:1.2;font-weight:600;color:var(--text-body)}
.sw{flex:1;height:24px;border-radius:var(--r-lg);background:var(--segmented-track);overflow:hidden}
.sw i.drill{display:flex;align-items:center;justify-content:flex-end;height:100%;min-width:34px;
  border-radius:var(--r-lg);border-bottom:0;padding:0 9px;font-family:inherit;font-size:var(--fs-sm);
  font-weight:700;color:#fff;font-variant-numeric:tabular-nums;transform-origin:left;
  animation:railIn .85s cubic-bezier(.22,.9,.3,1) both}
.sw i.drill:hover{color:#fff;filter:brightness(1.12)}
@keyframes railIn{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.exc{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin-top:auto;padding-top:13px;
  border-top:1px solid var(--border-soft)}
.exct{border:1px solid var(--border);border-radius:var(--r-xl);padding:9px 10px;text-align:left;
  background:var(--surface);transition:border-color .14s,background .14s}
.exct:hover{border-color:var(--blue)}
.exct .el{display:flex;align-items:center;gap:5px;font-size:var(--fs-xs);line-height:var(--lh-xs);
  font-weight:600;color:var(--text-muted)}
.exct .el svg{color:var(--text-faint);flex:0 0 auto}
.exct .ev{font-size:19px;font-weight:700;letter-spacing:-.03em;margin-top:4px;color:var(--text-dark);
  font-variant-numeric:tabular-nums}
.exct.warn{border-color:var(--amber-border);background:var(--amber-bg)}
.exct.warn .el,.exct.warn .ev{color:var(--amber)}

/* ---------- Fleet at Work: one stacked bar, its own legend below -------- */
.fw-v{display:flex;align-items:baseline;gap:10px}
.fw-v b{font-size:28px;font-weight:700;letter-spacing:-.035em;line-height:1;color:var(--text-dark)}
.fw-v span{font-size:var(--fs-sm);font-weight:700;color:var(--green)}
.fw-d{display:flex;justify-content:space-between;font-size:var(--fs-sm);color:var(--text-faint);margin:14px 0 7px}
.sbar{display:flex;gap:4px;height:34px}
.sbar i{border-radius:7px;transform-origin:left;animation:railIn .85s cubic-bezier(.22,.9,.3,1) both;
  transition:filter .14s}
.sbar:hover i{filter:saturate(.55) opacity(.6)}
.sbar i:hover{filter:none}
.fleg{display:grid;grid-template-columns:1fr 1fr;gap:11px 12px;margin-top:15px}
.fleg .r{display:flex;gap:8px;border-radius:var(--r-sm);padding:2px 4px;margin:-2px -4px;transition:background .12s}
.fleg .r:hover{background:var(--accent)}
.fleg i{width:8px;height:8px;border-radius:50%;margin-top:5px;flex:none}
.fleg b{display:block;font-size:var(--fs-sm);font-weight:700;color:var(--text-dark)}
.fleg span{display:block;font-size:var(--fs-sm);color:var(--text-faint);font-variant-numeric:tabular-nums}
/* ---------- Goals: radial gauges -----------------------------------------
   Five bullet-bar rows read heavy for something that reduces to one number
   and a met/short verdict. Each goal is now a small ring — the fill and the
   percentage are the whole story at rest; the two numbers behind it (actual,
   goal) move into the board's shared hover/focus card (.htip, wired below)
   instead of sitting permanently under every row. */
.ggrid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px 4px;padding:4px 0 2px;justify-items:center}
.ggauge{display:flex;flex-direction:column;align-items:center;gap:7px;padding:6px 4px;border-radius:var(--r-lg);
  outline:none;opacity:0;transform:scale(.88)}
.in .ggauge{animation:gaugeIn .45s cubic-bezier(.22,.9,.3,1) both}
@keyframes gaugeIn{to{opacity:1;transform:scale(1)}}
.ggauge:hover,.ggauge:focus-visible{background:var(--accent)}
.gring{position:relative;width:58px;height:58px;border-radius:50%;flex:none;
  background:conic-gradient(var(--ring-c,var(--blue)) calc(var(--p)*1%),var(--border-soft) 0)}
.gring.under{--ring-c:var(--gold)}
.gring::before{content:"";position:absolute;inset:6px;border-radius:50%;background:var(--surface)}
.gtick{position:absolute;inset:0;border-radius:50%;transform:rotate(288deg);pointer-events:none}
.gtick::after{content:"";position:absolute;top:0;left:50%;width:2px;height:7px;margin-left:-1px;
  background:var(--text-dark);opacity:.4;border-radius:1px}
.gval{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--mono);font-size:12px;
  font-weight:700;color:var(--text-dark);font-variant-numeric:tabular-nums}
.glabel{font-size:var(--fs-xs);line-height:var(--lh-xs);font-weight:500;color:var(--muted-fg);text-align:center}

/* ---------- Board hover card (.htip) --------------------------------------
   The one hover/focus card every data point on the board uses — Goals
   gauges, message rows, CPM/Fleet bar segments and legend rows all render
   through this (see the "board hover card" JS block). position:fixed on
   body so a card's own overflow:hidden/auto never clips it; anchored to
   the hovered element's own rect, not the cursor. Visually mirrors .ctip
   (the chart hover card) so every hoverable point in the app reads the
   same way, but kept as its own class/toggle so the two systems — one
   SVG-hit-test-driven, one plain DOM-rect-driven — don't have to couple
   to each other. */
.htip{position:fixed;z-index:220;pointer-events:none;opacity:0;transform:translateY(4px);
  background:var(--popover);border:1px solid var(--border);border-radius:var(--r-lg);
  box-shadow:var(--shadow-md);padding:6px 9px;white-space:nowrap;
  transition:opacity .13s ease,transform .13s cubic-bezier(.22,.9,.3,1)}
.htip.show{opacity:1;transform:translateY(0)}
.htip .th{font-family:var(--mono);font-size:var(--fs-xs);line-height:var(--lh-xs);font-weight:500;color:var(--muted-fg);margin-bottom:4px}
.htip .tr{display:flex;align-items:center;gap:7px;line-height:18px}
.htip .tr i{width:8px;height:8px;border-radius:2px;flex:0 0 8px}
.htip .tr span{font-size:var(--fs-sm);color:var(--text-body)}
.htip .tr b{margin-left:auto;font-family:var(--mono);font-size:var(--fs-sm);font-weight:500;color:var(--text-dark);font-variant-numeric:tabular-nums;padding-left:12px}

/* ---------- KPI hero + charts ------------------------------------------- */
.cbody.chartbody{display:flex;flex-direction:column}
.kpi{display:flex;align-items:flex-end;gap:10px;padding:2px 0 8px;flex:0 0 auto}
.kpi .v{font-size:23px;line-height:26px;font-weight:600;letter-spacing:-.6px;color:var(--text-dark);font-variant-numeric:tabular-nums}
.kpi .pill{margin-bottom:5px}
.kpi .sub{font-size:var(--fs-xs);line-height:var(--lh-xs);color:var(--muted-fg);margin-left:auto;margin-bottom:5px;white-space:nowrap}
.chart-wrap{position:relative;width:100%;flex:1;min-height:100px}
.chart-wrap svg{display:block;overflow:visible}
.legend{display:flex;gap:12px;padding:0 0 6px;font-size:var(--fs-xs);line-height:var(--lh-xs);color:var(--text-muted);flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:8px;height:8px;border-radius:2px;display:inline-block;background:var(--c1)}
.legend i.c2{background:var(--c2)} .legend i.c3{background:var(--c3)}
.ax,.axv{font-size:9px;fill:var(--text-muted);font-family:var(--mono)}
.axv{font-variant-numeric:tabular-nums}
.pt-label{font-size:9px;fill:var(--text-body);font-family:var(--mono);font-weight:500;font-variant-numeric:tabular-nums}
.gl{stroke:var(--border-soft);stroke-width:1}
.bar-rect{transition:fill .13s ease,opacity .16s ease}
.dotm{transition:r .13s ease,stroke-width .13s ease,opacity .16s ease;fill:var(--surface)}
.pt-label,.linem,.aream{transition:opacity .16s ease}
/* focus: hovering one category greys every other mark so the hovered one
   reads alone. !important is needed — the entrance animations run with
   fill-mode:both, and a filled animation outranks a plain declaration in the
   cascade; a transition still outranks !important, so the fade survives. */
.bar-rect.dim,.dotm.dim{opacity:.15!important}
.pt-label.dim{opacity:.12!important}
.linem.dim,.aream.dim{opacity:.2!important}
.guide{stroke:var(--text-faint);stroke-width:1;stroke-dasharray:3 3;opacity:0;transition:opacity .13s}
.guide.on{opacity:.8}
.ctip{position:absolute;z-index:9;pointer-events:none;opacity:0;transform:translate(-50%,-118%);
  background:var(--popover);border:1px solid var(--border);border-radius:var(--r-lg);padding:6px 9px;
  transition:opacity .13s ease,transform .13s cubic-bezier(.22,.9,.3,1);white-space:nowrap}
.ctip.on{opacity:1;transform:translate(-50%,-126%)}
.ctip .th{font-family:var(--mono);font-size:var(--fs-xs);line-height:var(--lh-xs);font-weight:500;color:var(--muted-fg);margin-bottom:4px}
.ctip .tr{display:flex;align-items:center;gap:7px;line-height:18px}
.ctip .tr i{width:8px;height:8px;border-radius:2px;flex:0 0 8px}
.ctip .tr span{font-size:var(--fs-sm);color:var(--text-body)}
.ctip .tr b{margin-left:auto;font-family:var(--mono);font-size:var(--fs-sm);font-weight:500;color:var(--text-dark);font-variant-numeric:tabular-nums;padding-left:12px}
.statgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.stat{border:1px solid var(--border);border-radius:var(--r-lg);padding:9px 10px;background:var(--surface);display:flex;flex-direction:column;gap:2px;transition:border-color .14s}
.stat:hover{border-color:var(--blue-border)}
.stat b{display:flex;align-items:center;gap:4px;font-size:var(--fs-2xl);line-height:var(--lh-2xl);font-weight:600;letter-spacing:-.5px;color:var(--text-dark);font-variant-numeric:tabular-nums}
.stat b svg{width:12px;height:12px}
.stat span{font-size:var(--fs-xs);line-height:var(--lh-xs);color:var(--muted-fg);font-weight:500}
.stat.up b{color:var(--green)} .stat.dn b{color:var(--amber)}

/* empty board */
.emptyboard{grid-column:span 12;border:1px dashed var(--border);border-radius:var(--r-xl);background:var(--surface);
  padding:40px 20px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;color:var(--text-muted)}
.emptyboard .eico{width:36px;height:36px;border-radius:var(--r-lg);border:1px solid var(--border);background:var(--page-bg);display:grid;place-items:center;color:var(--muted-fg)}
.emptyboard .eico svg{width:16px;height:16px}
.emptyboard b{display:block;font-size:var(--fs-base);line-height:var(--lh-base);font-weight:600;color:var(--text-dark)}
.emptyboard p{max-width:340px}

/* ============================================================================
   GRAPHS DRAWER — Sheet (side="right")
   ========================================================================= */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:130;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.show{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:336px;max-width:92vw;background:var(--surface);z-index:140;border-left:1px solid var(--border);
  display:flex;flex-direction:column;transform:translateX(104%);transition:transform .24s cubic-bezier(.22,.9,.3,1)}
.drawer.show{transform:none}
.dhead{display:flex;align-items:flex-start;gap:9px;padding:14px 14px 12px 16px;border-bottom:1px solid var(--border-soft);flex:0 0 auto}
.dhead .dtitle{min-width:0;flex:1}
.dhead b{font-size:var(--fs-xl);line-height:var(--lh-xl);font-weight:600;color:var(--text-dark);display:block;letter-spacing:-.3px}
.dhead .dnote{font-size:var(--fs-sm);line-height:var(--lh-sm);color:var(--text-muted);margin-top:2px}
.dhead .x{width:var(--h-8);height:var(--h-8);border-radius:var(--r-md);border:0;background:transparent;color:var(--muted-fg);display:grid;place-items:center;flex:0 0 auto;transition:background .14s,color .14s}
.dhead .x svg{width:14px;height:14px}
.dhead .x:hover{background:var(--blue-bg);color:var(--blue)}
.dlist{flex:1;overflow:auto;padding:8px 10px 16px;display:flex;flex-direction:column;gap:4px}
.gitem{display:flex;align-items:center;gap:10px;padding:7px 8px 7px 8px;border:1px solid var(--border);border-radius:var(--r-lg);
  background:var(--surface);cursor:pointer;transition:background .12s,border-color .12s}
.gitem:hover{background:var(--blue-bg);border-color:var(--blue)}
.gitem .gi{width:26px;height:26px;flex:0 0 26px;display:grid;place-items:center;border-radius:var(--r-md);border:1px solid var(--border);background:var(--page-bg);color:var(--text-heading);transition:color .12s,border-color .12s,background .12s}
.gitem .gi svg{width:14px;height:14px}
.gitem:hover .gi{color:var(--blue);border-color:var(--blue);background:var(--surface)}
.gitem .gn{font-size:var(--fs-sm);line-height:var(--lh-sm);font-weight:500;color:var(--text-dark);flex:1;min-width:0}
.gitem .gn-note{display:block;font-weight:400;font-size:var(--fs-xs);line-height:var(--lh-xs);color:var(--muted-fg)}
.gitem:hover .gn,.gitem:hover .gn-note{color:var(--blue)}
.gitem .chev{width:var(--h-7);height:var(--h-7);display:grid;place-items:center;color:var(--muted-fg);flex:0 0 auto;border-radius:var(--r-sm);transition:transform .16s,background .12s}
.gitem .chev svg{width:12px;height:12px}
.gitem .chev:hover{background:var(--surface)}
.gitem.open .chev{transform:rotate(90deg)}
.gitem .add{width:var(--h-7);height:var(--h-7);display:grid;place-items:center;flex:0 0 auto;color:var(--muted-fg);border-radius:var(--r-sm);border:1px solid transparent;transition:color .12s,border-color .12s,background .12s}
.gitem .add svg{width:12px;height:12px}
.gitem:hover .add{color:var(--blue);border-color:var(--blue);background:var(--surface)}
.gitem .done{width:var(--h-7);height:var(--h-7);display:grid;place-items:center;flex:0 0 auto;color:var(--green)}
.gitem .done svg{width:12px;height:12px}
.gitem.added{background:var(--page-bg)}
.gitem.added .gn{color:var(--text-muted);font-weight:400}
/* an item with a breakdown opens in place — the sub-rows drop into the SAME
   box as the parent (flush, no gap, only the bottom corners round), so
   clicking "Revenue" reads as one card unfolding, not a stack of new boxes. */
.gitem.hassub.open{border-radius:var(--r-lg) var(--r-lg) 0 0;border-bottom-color:var(--border-soft)}
.gsub{display:none;flex-direction:column;padding:3px 6px 5px;margin-top:-4px;
  border:1px solid var(--border);border-top:0;border-radius:0 0 var(--r-lg) var(--r-lg);background:var(--page-bg)}
.gsub.show{display:flex}
/* sub-rows are plain — no border, no card chrome — just an indented list */
.gsub .gitem{border:0;border-radius:var(--r-sm);padding:6px 6px 6px 8px;background:transparent}
.gsub .gitem .gi{width:22px;height:22px;flex:0 0 22px;border-color:transparent;background:transparent}
.gsub .gitem:hover{background:var(--surface);border-color:transparent}
.gsub .gitem:hover .gi{background:var(--surface);border-color:var(--blue)}

/* ============================================================================
   DRILL-DOWN — breadcrumb, toolbar, Table, Pagination
   ========================================================================= */
.detail{padding:16px 18px 0}
.dtop{display:flex;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.crumb{display:flex;align-items:center;gap:6px;font-size:var(--fs-sm);line-height:var(--lh-sm);color:var(--text-muted);margin-bottom:2px}
.crumb button{display:inline-flex;align-items:center;gap:4px;background:0;border:0;color:var(--text-muted);font-weight:500;padding:0;transition:color .12s}
.crumb button svg{width:12px;height:12px}
.crumb button:hover{color:var(--blue)}
.crumb .cur{color:var(--text-dark);font-weight:500}
.crumb .sl{color:var(--text-faint)}
.dtop h2{font-size:var(--fs-2xl);line-height:var(--lh-2xl);font-weight:600;letter-spacing:-.4px}
.dtools{display:flex;align-items:center;gap:6px;margin-left:auto}
.dsearch{position:relative;flex:1;max-width:420px}
.dsearch input{width:100%;height:var(--h-9);border:1px solid var(--input-border);border-radius:var(--r-md);background:var(--surface);padding:0 10px 0 30px;color:var(--text-heading)}
.dsearch input::placeholder{color:var(--muted-fg)}
.dsearch input:hover{border-color:var(--blue)}
.dsearch input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 var(--ring-w) var(--ring)}

/* ===========================================================================
   0. UTILITIES
   ======================================================================== */
const $  = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const REDUCED = ()=>matchMedia('(prefers-reduced-motion:reduce)').matches;
const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const usd0 = v => '$ '+Math.round(v).toLocaleString('en-US');
const usd2 = v => '$ '+v.toFixed(2);
const money = v => '$'+v.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));

/* deterministic pseudo-random so generated tables are stable between renders */
function seeded(seed){ let s=seed; return ()=>{ s=(s*1664525+1013904223)>>>0; return s/4294967296; }; }
const pick = (rnd,arr)=>arr[Math.floor(rnd()*arr.length)];

let toastT;
function toast(html){
  const t=$('#toast');
  t.innerHTML=`<span class="ti">${svg('check',10,3)}</span><span>${html}</span>`;
  t.classList.add('show');
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2600);
}

/* count-up, ported from the Valor dashboard.
   ROLL remembers the true final text of any element mid-roll, so a second
   roll that starts before the first has finished (renderBoard, then
   an options change 60ms later) never captures "$ 0.00M" as its target. */
const ROLL=new WeakMap();
function rollNumbers(nodes,dur){
  if(REDUCED()) return;
  const items=[...nodes].map(el=>{
    const final=ROLL.has(el)?ROLL.get(el):el.textContent;
    ROLL.set(el,final);
    const toks=[...final.matchAll(/\d[\d,]*(?:\.\d+)?/g)].map(m=>({
      i:m.index,s:m[0],v:parseFloat(m[0].replace(/,/g,'')),
      dec:(m[0].split('.')[1]||'').length,grp:m[0].includes(',')}));
    return {el,final,toks};
  }).filter(o=>o.toks.length);
  if(!items.length) return;
  const t0=performance.now(),ease=t=>1-Math.pow(1-t,3);
  (function step(now){
    const k=Math.min(1,(now-t0)/dur),e=ease(k);
    items.forEach(o=>{
      if(k>=1){o.el.textContent=o.final;ROLL.delete(o.el);return;}
      let out='',last=0;
      o.toks.forEach(t=>{
        out+=o.final.slice(last,t.i);
        const v=t.v*e;
        out+=t.grp?v.toLocaleString('en-US',{minimumFractionDigits:t.dec,maximumFractionDigits:t.dec})
                  :v.toFixed(t.dec);
        last=t.i+t.s.length;
      });
      o.el.textContent=out+o.final.slice(last);
    });
    if(k<1) requestAnimationFrame(step);
  })(performance.now());
}

/* storage: host store, then localStorage, then memory. Keys are namespaced
   dps.* so this build never shares a layout or theme with the other boards. */
const MEM={};
const Store={
  async get(k){
    k='dps.'+k.replace(/^dpt\./,'');
    try{ const r=await window.storage.get(k); return r? JSON.parse(r.value):null; }
    catch(e){
      try{ const r=localStorage.getItem(k); if(r!=null) return JSON.parse(r); }catch(err){}
      return k in MEM? MEM[k]:null;
    }
  },
  async set(k,v){
    k='dps.'+k.replace(/^dpt\./,'');
    MEM[k]=v;
    try{ localStorage.setItem(k,JSON.stringify(v)); }catch(err){}
    try{ await window.storage.set(k,JSON.stringify(v)); }catch(e){}
  }
};

  pie:'<path d="M12 3a9 9 0 1 0 9 9h-9V3Z"/><path d="M15 3.5A9 9 0 0 1 20.5 9H15V3.5Z"/>',

  chart:'<path d="M4 20V10M10 20V4M16 20v-7M21 20H3"/>',
