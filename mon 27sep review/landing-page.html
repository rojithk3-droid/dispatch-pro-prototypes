/* ===========================================================================
   4. CHART ENGINE — hand-rolled SVG, redrawn at true pixel size on resize
   ======================================================================== */
const NS='http://www.w3.org/2000/svg';
/* Series palette: accent, ink, grey — read from the theme's --c1/--c2/--c3
   at init and on every theme switch, so a chart repaints in the right ink.
   They stay hex strings because the tooltip swatches need one. */
let C_BLUE='#0F6FFF', C_ORANGE='#101828', C_TEAL='#9CA3AF';
function syncPalette(){
  const cs=getComputedStyle(document.documentElement);
  const rd=(k,d)=>{ const v=cs.getPropertyValue(k).trim(); return /^#[0-9a-f]{6}$/i.test(v)?v:d; };
  C_BLUE=rd('--c1',C_BLUE); C_ORANGE=rd('--c2',C_ORANGE); C_TEAL=rd('--c3',C_TEAL);
}
function e(t,a,kids){
  const n=document.createElementNS(NS,t);
  for(const k in a) if(a[k]!=null) n.setAttribute(k,a[k]);
  (kids||[]).forEach(c=>n.appendChild(typeof c==='string'?document.createTextNode(c):c));
  return n;
}
function autoTicks(vals,opt={}){
  const zero = opt.zero!==false;
  let lo = zero?0:Math.min(...vals), hi=Math.max(...vals);
  if(hi===lo) hi=lo+1;
  if(!zero){ const pad=(hi-lo)*.18; lo=Math.max(0,lo-pad); }
  const raw=(hi-lo)/(opt.count||4);
  const mag=Math.pow(10,Math.floor(Math.log10(raw)));
  const step=[1,2,2.5,5,10].map(m=>m*mag).find(s=>s>=raw)||mag*10;
  const start=Math.floor(lo/step)*step, out=[];
  for(let t=start;t<hi+step*.001;t+=step) out.push(+t.toFixed(6));
  if(out[out.length-1]<hi) out.push(+(out[out.length-1]+step).toFixed(6));
  return out;
}
function frame(svg,{W,H,L,R,T,B,ticks,fmt}){
  const span=ticks[ticks.length-1]-ticks[0];
  ticks.forEach(t=>{
    const y=T+(H-T-B)*(1-(t-ticks[0])/span);
    svg.appendChild(e('line',{x1:L,x2:W-R,y1:y,y2:y,class:'gl'}));
    svg.appendChild(e('text',{x:L-6,y:y+3.4,'text-anchor':'end',class:'axv'},[fmt(t)]));
  });
  return t=>T+(H-T-B)*(1-(t-ticks[0])/span);
}
function xAxis(svg,names,{L,R,W,H,B},skip){
  const step=(W-R-L)/names.length;
  names.forEach((n,i)=>{
    if(skip && i%skip) return;
    svg.appendChild(e('text',{x:L+step*i+step/2,y:H-B+13,'text-anchor':'middle',class:'ax'},[n]));
  });
  return {step,at:i=>L+step*i+step/2};
}
function fitSkip(count,W){ const per=(W-60)/count; return per<30?Math.ceil(30/per):1; }

/* Mix a hex toward white — the hovered bar lift seen in the reference clip. */
/* Catmull-Rom through the points, converted to cubic beziers — the curved
   line option. Straight segments are used when there are too few points. */
function smoothPath(pts){
  if(pts.length<3) return pts.map((q,i)=>`${i?'L':'M'}${q[0]},${q[1]}`).join(' ');
  let d=`M${pts[0][0]},${pts[0][1]}`;
  for(let i=0;i<pts.length-1;i++){
    const p0=pts[i-1]||pts[i], p1=pts[i], p2=pts[i+1], p3=pts[i+2]||p2;
    d+=` C${p1[0]+(p2[0]-p0[0])/6},${p1[1]+(p2[1]-p0[1])/6}`
      +` ${p2[0]-(p3[0]-p1[0])/6},${p2[1]-(p3[1]-p1[1])/6}`
      +` ${p2[0]},${p2[1]}`;
  }
  return d;
}

function drawChart(host,spec,W,H){
  host.innerHTML='';
  W=Math.max(160,Math.round(W)); H=Math.max(110,Math.round(H));
  const svg=e('svg',{width:W,height:H,viewBox:`0 0 ${W} ${H}`,role:'img',
                     'aria-label':spec.alt||'chart'});
  const tiny=H<190;
  const L=spec.L??46, R=spec.R??10, T=tiny?14:22, B=24;
  const showLab = spec.labels!==false && !tiny && W/(spec.names?spec.names.length:6) > 42;
  const lp=spec.labelPos||'out';
  /* data-li ties a value label to its category so it dims with its bar */
  const barLab=(cx,top,base,txt,delay,i)=>{
    let y=top-5,fill='';
    const tall=Math.abs(base-top)>22;
    if(lp==='in'&&tall){ y=top+13; fill=';fill:var(--surface)'; }
    else if(lp==='center'&&tall){ y=(top+base)/2+4; fill=';fill:var(--surface)'; }
    return e('text',{x:cx,y,'text-anchor':'middle',class:'pt-label anim-txt','data-li':i,
      style:`animation-delay:${delay}ms`+fill},[txt]);
  };
  const hits=[];                 // one entry per category
  /* p = position along the hit-test axis; tx/ty anchor the tooltip */
  const mark=(i,p,tx,ty,items)=>{
    const h=hits[i]||(hits[i]={p,tx,ty:1e9,name:spec.names[i],items:[]});
    h.p=p; h.tx=tx; h.ty=Math.min(h.ty,ty); h.items.push(...items);
  };
  let step=40, guide=null, axis='x';

  if(spec.type==='bar'){
    const ticks=spec.ticks||autoTicks(spec.data,{count:tiny?3:4});
    const y=frame(svg,{W,H,L,R,T,B,ticks,fmt:spec.fmt});
    const x=xAxis(svg,spec.names,{L,R,W,H,B},fitSkip(spec.names.length,W)); step=x.step;
    const base=y(ticks[0]), bw=Math.min(x.step*.55,54), fill=spec.color||C_BLUE;
    spec.data.forEach((v,i)=>{
      const top=y(v);
      svg.appendChild(e('rect',{x:x.at(i)-bw/2,y:Math.min(top,base),width:bw,
        height:Math.abs(base-top),rx:7,fill,'data-i':i,
        class:'bar-rect anim-bar',style:`animation-delay:${i*55}ms`}));
      if(showLab) svg.appendChild(barLab(x.at(i),top,base,spec.lab(v),560+i*55,i));
      mark(i,x.at(i),x.at(i),top,[{label:spec.slabel||'Value',color:fill,text:spec.lab(v)}]);
    });
  }

  /* horizontal bars: categories down the left, values across */
  if(spec.type==='hbar'){
    axis='y';
    const ser=spec.series&&spec.series.length?spec.series
             :[{v:spec.data,c:spec.color||C_BLUE,label:spec.slabel||'Value'}];
    const all=ser.flatMap(s2=>s2.v);
    const ticks=spec.ticks||autoTicks(all,{count:tiny?3:4});
    const LL=Math.min(120,Math.max(58,Math.round(W*.26))), RR=spec.R??14, TT=10, BB=22;
    const span=ticks[ticks.length-1]-ticks[0];
    const x=t=>LL+(W-RR-LL)*((t-ticks[0])/span);
    ticks.forEach(t=>{
      svg.appendChild(e('line',{x1:x(t),x2:x(t),y1:TT,y2:H-BB,class:'gl'}));
      svg.appendChild(e('text',{x:x(t),y:H-BB+13,'text-anchor':'middle',class:'axv'},[spec.fmt(t)]));
    });
    const n=spec.names.length, slot=(H-BB-TT)/n;
    step=slot;
    const bh=Math.min(slot/(ser.length+0.6),26);
    spec.names.forEach((nm,i)=>{
      const cy=TT+slot*i+slot/2;
      svg.appendChild(e('text',{x:LL-8,y:cy+3.4,'text-anchor':'end',class:'ax'},[nm]));
      ser.forEach((s2,si)=>{
        const v=s2.v[i], off=(si-(ser.length-1)/2)*(bh+2);
        const x0=x(ticks[0]), x1=x(v);
        svg.appendChild(e('rect',{x:Math.min(x0,x1),y:cy+off-bh/2,
          width:Math.abs(x1-x0),height:bh,rx:7,fill:s2.c,'data-i':i,
          class:'bar-rect anim-barh',style:`animation-delay:${(i*ser.length+si)*50}ms`}));
        if(showLab&&ser.length===1)
          svg.appendChild(e('text',{x:x1+6,y:cy+3.4,class:'pt-label anim-txt','data-li':i,
            style:`animation-delay:${540+i*50}ms`},[spec.lab(v)]));
        mark(i,cy,x1,cy-bh/2-4,[{label:s2.label||'Value',color:s2.c,text:spec.lab(v)}]);
      });
    });
  }

  if(spec.type==='grouped'){
    const ticks=spec.ticks||autoTicks([...spec.a,...spec.b],{count:tiny?3:4});
    const y=frame(svg,{W,H,L,R,T,B,ticks,fmt:spec.fmt});
    const x=xAxis(svg,spec.names,{L,R,W,H,B},fitSkip(spec.names.length,W)); step=x.step;
    const base=y(ticks[0]), bw=Math.min(x.step*.30,26);
    spec.names.forEach((_,i)=>{
      const cx=x.at(i);
      [[spec.a[i],C_BLUE,-bw*.56,spec.aLabel||'A'],[spec.b[i],C_ORANGE,bw*.56,spec.bLabel||'B']]
      .forEach(([v,cc,off,lb],j)=>{
        const top=y(v);
        svg.appendChild(e('rect',{x:cx+off-bw/2,y:Math.min(top,base),width:bw,
          height:Math.abs(base-top),rx:7,fill:cc,'data-i':i,
          class:'bar-rect anim-bar',style:`animation-delay:${(i*2+j)*45}ms`}));
        if(showLab&&v>0) svg.appendChild(barLab(cx+off,top,base,spec.lab(v),580+i*45,i));
        mark(i,cx,cx,top,[{label:lb,color:cc,text:spec.lab(v)}]);
      });
    });
  }

  if(spec.type==='combo'){
    const ticks=spec.ticks||autoTicks([...spec.bars,...spec.line],{count:tiny?3:4});
    const y=frame(svg,{W,H,L,R,T,B,ticks,fmt:spec.fmt});
    const x=xAxis(svg,spec.names,{L,R,W,H,B},fitSkip(spec.names.length,W)); step=x.step;
    const base=y(ticks[0]), bw=Math.min(x.step*.42,44), lc=spec.lineColor||C_ORANGE;
    guide=e('line',{y1:T,y2:H-B,class:'guide'}); svg.appendChild(guide);
    spec.bars.forEach((v,i)=>{
      const top=y(v);
      svg.appendChild(e('rect',{x:x.at(i)-bw/2,y:Math.min(top,base),width:bw,
        height:Math.abs(base-top),rx:7,fill:C_BLUE,'data-i':i,
        class:'bar-rect anim-bar',style:`animation-delay:${i*55}ms`}));
      if(showLab) svg.appendChild(barLab(x.at(i),top,base,spec.lab(v),560+i*55,i));
      mark(i,x.at(i),x.at(i),top,[{label:spec.barLabel||'Actual',color:C_BLUE,text:spec.lab(v)}]);
    });
    const pts=spec.line.map((v,i)=>[x.at(i),y(v)]);
    svg.appendChild(e('path',{d:spec.curve?smoothPath(pts):pts.map((q,i)=>`${i?'L':'M'}${q[0]},${q[1]}`).join(' '),
      fill:'none',stroke:lc,'stroke-width':2,'stroke-linecap':'round','stroke-linejoin':'round',
      pathLength:1,class:'linem anim-line'}));
    spec.line.forEach((v,i)=>{
      svg.appendChild(e('circle',{cx:x.at(i),cy:y(v),r:3.2,stroke:lc,'stroke-width':2,
        'data-i':i,'data-r':3.2,class:'dotm anim-dot',style:`animation-delay:${540+i*45}ms`}));
      if(showLab) svg.appendChild(e('text',{x:x.at(i),y:y(v)+15,'text-anchor':'middle',
        class:'pt-label anim-txt','data-li':i,style:`animation-delay:${620+i*45}ms`},
        [spec.lab2?spec.lab2(v):spec.lab(v)]));
      mark(i,x.at(i),x.at(i),y(v),[{label:spec.lineLabel||'Goal',color:lc,
        text:(spec.lab2||spec.lab)(v)}]);
    });
  }

  if(spec.type==='multiline'){
    const ticks=spec.ticks||autoTicks(spec.series.flatMap(s2=>s2.v),{count:tiny?3:5});
    const y=frame(svg,{W,H,L,R,T,B,ticks,fmt:spec.fmt});
    const x=xAxis(svg,spec.names,{L,R,W,H,B},fitSkip(spec.names.length,W)); step=x.step;
    guide=e('line',{y1:T,y2:H-B,class:'guide'}); svg.appendChild(guide);
    const path=s2=>{
      const pts=s2.v.map((v,i)=>[x.at(i),y(v)]);
      return spec.curve?smoothPath(pts):pts.map((q,i)=>`${i?'L':'M'}${q[0]},${q[1]}`).join(' ');
    };
    if(spec.area && spec.series.length && !spec.dotsOnly){
      const s0=spec.series[0], gid='ag'+Math.random().toString(36).slice(2,7);
      svg.appendChild(e('defs',{},[e('linearGradient',{id:gid,x1:0,y1:0,x2:0,y2:1},[
        e('stop',{offset:0,'stop-color':s0.c,'stop-opacity':.30}),
        e('stop',{offset:1,'stop-color':s0.c,'stop-opacity':0})])]));
      svg.appendChild(e('path',{d:path(s0)+` L${x.at(s0.v.length-1)},${H-B} L${x.at(0)},${H-B} Z`,
        fill:`url(#${gid})`,class:'aream anim-area'}));
    }
    if(!spec.dotsOnly) spec.series.forEach((s2,si)=>{
      svg.appendChild(e('path',{d:path(s2),fill:'none',stroke:s2.c,'stroke-width':2.1,
        'stroke-linecap':'round','stroke-linejoin':'round',pathLength:1,
        class:'linem anim-line',style:`animation-delay:${si*130}ms`}));
    });
    const top0=T+4, bot=H-B-6, dense=x.step<44;
    spec.series.forEach((s2,si)=>{
      s2.v.forEach((v,i)=>{
        const py=y(v), r=spec.dotsOnly?4:2.8;
        svg.appendChild(e('circle',{cx:x.at(i),cy:py,r,stroke:s2.c,
          'stroke-width':spec.dotsOnly?2.2:1.9,'data-i':i,'data-r':r,
          class:'dotm anim-dot',style:`animation-delay:${560+i*22}ms`}));
        if(showLab && !dense){
          let ly=si?py+15:py-8;
          if(ly>bot) ly=py-8;
          if(ly<top0) ly=py+15;
          svg.appendChild(e('text',{x:x.at(i),y:ly,'text-anchor':'middle',class:'pt-label anim-txt','data-li':i,
            style:`animation-delay:${660+i*22}ms`},[spec.lab(v)]));
        }
        mark(i,x.at(i),x.at(i),py,[{label:s2.label||('Series '+(si+1)),color:s2.c,text:spec.lab(v)}]);
      });
    });
  }

  host.appendChild(svg);
  const tip=document.createElement('div');
  tip.className='ctip';
  host.appendChild(tip);
  host._chart={hits,step,svg,tip,guide,W,H,axis,at:-1};
}

/* ---- page defaults + per-card chart settings -----------------------------
   MASTER_DEF is the page default; a card's own Options menu overrides
   it for that card only. */
const MASTER_DEF={period:'Weeks',type:'',labOn:true,labPos:'out'};
function master(){ return Object.assign({},MASTER_DEF,STATE.master||{}); }
function effOpt(card){
  const M=master();
  let co={}; try{ co=JSON.parse((card&&card.dataset.opt)||'{}'); }catch(err){}
  return {
    period: co.period || M.period,
    type:   co.type   || M.type,
    labels: co.labels || (M.labOn ? M.labPos : 'none'),
    range:  co.range  || STATE.range || 'today'
  };
}
function seriesOf(sp){
  if(sp.type==='multiline') return sp.series;
  if(sp.type==='bar')   return [{v:sp.data,c:sp.color||C_BLUE,label:sp.slabel||'Value'}];
  if(sp.type==='grouped')return [{v:sp.a,c:C_BLUE,label:sp.aLabel||'A'},
                                 {v:sp.b,c:C_ORANGE,label:sp.bLabel||'B'}];
  if(sp.type==='combo') return [{v:sp.bars,c:C_BLUE,label:sp.barLabel||'Actual'},
                                {v:sp.line,c:C_ORANGE,label:sp.lineLabel||'Goal'}];
  return [];
}
function morphSpec(sp,type){
  if(!type) return sp;                        // Chart Default
  const ser=seriesOf(sp); if(!ser.length) return sp;
  if(type==='line')    return {...sp,type:'multiline',series:ser,area:false,curve:false,dotsOnly:false};
  if(type==='curve')   return {...sp,type:'multiline',series:ser,area:false,curve:true,dotsOnly:false};
  if(type==='area')    return {...sp,type:'multiline',series:ser,area:true,curve:true,dotsOnly:false};
  if(type==='scatter') return {...sp,type:'multiline',series:ser,area:false,curve:false,dotsOnly:true};
  if(type==='hbar')    return {...sp,type:'hbar',series:ser,L:null};
  if(type==='bar'){
    if(ser.length>1) return {...sp,type:'grouped',a:ser[0].v,b:ser[1].v,
      aLabel:ser[0].label,bLabel:ser[1].label};
    return {...sp,type:'bar',data:ser[0].v,color:ser[0].c,slabel:ser[0].label};
  }
  if(type==='combo'&&ser.length>1)
    return {...sp,type:'combo',bars:ser[0].v,line:ser[1].v,
      barLabel:ser[0].label,lineLabel:ser[1].label};
  return sp;
}

/* ---- date range: each card can follow the page default or hold its own.
   The range picks the window of periods the card reports on. --------------- */
const RANGE_OPTS=[
  ['','Page default (today)'],
  ['wtd','This Week'],['mtd','This Month'],['qtd','This Quarter'],['ytd','This Year'],
  ['lw','Last Week'],['lm','Last Month'],['lq','Last Quarter'],['ly','Last Year']
];
const RANGE_NAME=Object.fromEntries(RANGE_OPTS.map(([k,v])=>[k,v]));
const WIN={today:{n:7},yest:{n:7,lag:1},wtd:{n:7},mtd:{n:12},qtd:{n:13},ytd:{n:0},custom:{n:0},
           lw:{n:7,lag:7},lm:{n:12,lag:4},lq:{n:13,lag:13},ly:{n:0}};
function applyRange(sp,range){
  const w=WIN[range];
  if(!w||!w.n) return sp;
  if(sp.cat) return sp;                       // a categorical axis has no dates to window
  const ser=seriesOf(sp); if(!ser.length) return sp;
  const len=ser[0].v.length;
  const n=Math.max(2,Math.min(len,w.n));
  let end=len-(w.lag?Math.min(w.lag,len-n):0);
  let start=Math.max(0,end-n);
  if(end-start<2){ start=Math.max(0,len-2); end=len; }
  if(start===0&&end===len) return sp;
  const cut=a=>a.slice(start,end), s2={...sp};
  if(s2.data) s2.data=cut(s2.data);
  if(s2.a){ s2.a=cut(s2.a); s2.b=cut(s2.b); }
  if(s2.bars){ s2.bars=cut(s2.bars); s2.line=cut(s2.line); }
  if(s2.series) s2.series=s2.series.map(x=>({...x,v:cut(x.v)}));
  s2.names=cut(s2.names);
  s2.ticks=undefined;
  return s2;
}
function bucket(arr,n,avg){
  const out=[];
  for(let i=0;i<arr.length;i+=n){
    const g=arr.slice(i,i+n), t=g.reduce((a,b)=>a+b,0);
    out.push(avg? t/g.length : t);
  }
  return out;
}
function applyPeriod(sp,period){
  if(sp.cat) return sp;                       // categories are not periods
  const size={Days:1,Weeks:1,Months:4,Quarters:13}[period]||1;
  const ser=seriesOf(sp), len=ser.length?ser[0].v.length:0;
  if(size<2 || len<=size) return sp;          // nothing to gain from re-bucketing
  const avg=sp.agg==='avg', s2={...sp};
  if(s2.data) s2.data=bucket(s2.data,size,avg);
  if(s2.a){ s2.a=bucket(s2.a,size,avg); s2.b=bucket(s2.b,size,avg); }
  if(s2.bars){ s2.bars=bucket(s2.bars,size,avg); s2.line=bucket(s2.line,size,avg); }
  if(s2.series) s2.series=s2.series.map(x=>({...x,v:bucket(x.v,size,avg)}));
  const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  s2.names=Array.from({length:Math.ceil(len/size)},(_,i)=>
    period==='Months' ? MON[i%12] : 'Q'+((i%4)+1));
  s2.ticks=undefined;
  return s2;
}

/* ---- hover: the hovered category keeps its colour, everything else greys
   back, and a tooltip parks above it -------------------------------------- */
const MARKS='[data-i],[data-li]';      /* bars, dots and their value labels  */
const SOFT='.linem,.aream';            /* line + area fade as one group      */
const markIdx=n=>+(n.dataset.i!==undefined?n.dataset.i:n.dataset.li);
function restDot(n){
  if(!n.dataset.sw) n.dataset.sw=n.getAttribute('stroke-width');
  n.setAttribute('r',n.dataset.r); n.setAttribute('stroke-width',n.dataset.sw);
}
function clearHover(wrap){
  const c=wrap._chart; if(!c||c.at===-1) return;
  c.at=-1;
  $$(MARKS,c.svg).forEach(n=>{
    n.classList.remove('dim');
    if(n.classList.contains('dotm')) restDot(n);
  });
  $$(SOFT,c.svg).forEach(n=>n.classList.remove('dim'));
  if(c.guide) c.guide.setAttribute('class','guide');
  c.tip.classList.remove('on');
}
function setHover(wrap,i){
  const c=wrap._chart, h=c.hits[i];
  if(!h || c.at===i) return;
  clearHover(wrap); c.at=i;
  $$(MARKS,c.svg).forEach(n=>{
    const dot=n.classList.contains('dotm');
    if(markIdx(n)===i){
      n.classList.remove('dim');
      if(dot){ if(!n.dataset.sw) n.dataset.sw=n.getAttribute('stroke-width');
               n.setAttribute('r',+n.dataset.r+2.2); n.setAttribute('stroke-width',2.6); }
    } else {
      n.classList.add('dim');
      if(dot) restDot(n);
    }
  });
  $$(SOFT,c.svg).forEach(n=>n.classList.add('dim'));
  if(c.guide){ c.guide.setAttribute('x1',h.p); c.guide.setAttribute('x2',h.p);
               c.guide.setAttribute('class','guide on'); }
  c.tip.innerHTML =
    (h.name?`<div class="th">${esc(h.name)}</div>`:'') +
    h.items.map(it=>`<div class="tr"><i style="background:${it.color}"></i>`+
      `<span>${esc(it.label)}</span><b>${esc(it.text)}</b></div>`).join('');
  const tw=c.tip.offsetWidth, th=c.tip.offsetHeight;
  c.tip.style.left=clamp(h.tx,tw/2+3,c.W-tw/2-3)+'px';
  let ty=h.ty-th-10;
  if(ty<2) ty=Math.min(c.H-th-4,h.ty+14);
  c.tip.style.top=ty+'px';
  c.tip.classList.add('on');
}
function wireHover(wrap){
  wrap.addEventListener('pointermove',ev=>{
    const c=wrap._chart; if(!c||!c.hits.length) return;
    const r=wrap.getBoundingClientRect();
    const pos = c.axis==='y' ? ev.clientY-r.top : ev.clientX-r.left;
    let idx=-1,best=1e9;
    c.hits.forEach((h,i)=>{ if(!h) return; const d=Math.abs(pos-h.p); if(d<best){best=d;idx=i;} });
    if(idx<0 || best>c.step*0.8) clearHover(wrap); else setHover(wrap,idx);
  });
  wrap.addEventListener('pointerleave',()=>clearHover(wrap));
}

  const m=METRICS[card.dataset.id], el=$('.cmeta',card); if(!m||!el) return;
  let parts=[];
  if(m.spec){
    const o=effOpt(card), co=cardOpt(card), sp=m.spec();
    parts.push(co.range ? RANGE_NAME[co.range] : RANGE_LABEL[STATE.range||'today'].replace(/^./,c=>c.toUpperCase()));

  } else {

function paint(wrap,anim){
  const m=METRICS[wrap.dataset.metric]; if(!m||!m.spec) return;
  const r=wrap.getBoundingClientRect();
  if(r.width<8||r.height<8) return;
  const o=effOpt(wrap.closest('.card'));
  let sp=applyRange(m.spec(),o.range);
  sp=applyPeriod(sp,o.period);
  sp=morphSpec(sp,o.type);
  sp.labels = o.labels!=='none';
  sp.labelPos = o.labels==='none'?'out':o.labels;
  drawChart(wrap,sp,r.width,r.height);
  if(!wrap._wired){ wireHover(wrap); wrap._wired=1; }
  if(!anim) $$('[class*="anim-"]',wrap).forEach(n=>{
    n.setAttribute('class',n.getAttribute('class').replace(/anim-[a-z]+/g,'').trim());
    n.removeAttribute('style');
  });
}
const chartRO=new ResizeObserver(ents=>ents.forEach(en=>{
  const w=en.target;
  if(w.dataset.drawn){ paint(w,false); } else { w.dataset.drawn='1'; paint(w,true); }
}));


function buildCard(cd){
  const m=METRICS[cd.id]; if(!m) return null;
  const el=document.createElement('section');
  el.className='card fresh'+(m.cls?' '+m.cls:'')+(m.bare?' bare':'');
  el.dataset.id=cd.id;
  el.style.gridColumn='span '+cd.span;
  el.style.height=cd.h+'px';
  el.dataset.opt=JSON.stringify(cd.opt||{});
  if(cd.uh) el.dataset.uh='1';

  const per = `<button class="copt" aria-haspopup="true" aria-label="Card options" title="Options">${svg('dots',14,2)}</button>`;
  const tabs = m.tabs ? `<div class="tabs" role="tablist">${m.tabs.map((t,i)=>
    `<button role="tab" aria-selected="${i?'false':'true'}" class="${i?'':'on'}">${t}</button>`).join('')}</div>` : '';

  let inner, bodyCls='';
  if(m.kind==='chart'){
    /* swatches take the series colour by INDEX, from CSS, so a theme switch
       recolours them along with the chart instead of leaving a stale hex */
    const leg = m.legend ? `<div class="legend">${m.legend.map(([l],i)=>
      `<span><i class="c${i+1}"></i>${l}</span>`).join('')}</div>` : '';
    const kp = m.kpi ? `<div class="kpi"><span class="v roll">${m.kpi.v}</span>
      <span class="badge pill" data-variant="${m.kpi.dir==='dn'?'danger':'success'}">${svg(m.kpi.dir,10,2.4)}${m.kpi.d}</span>
      <span class="sub">vs prior period</span></div>` : '';
    inner = `${kp}${leg}<div class="chart-wrap" data-metric="${cd.id}"></div>`;
    bodyCls=' chartbody';
  } else {
    inner = m.body();
  }

  el.innerHTML=`
    <header class="chead">
      ${m.lead?`<span class="clead" aria-hidden="true">${svg(m.lead,14,1.8)}</span>`:''}
      <div class="ctext"><h3>${esc(m.title)}</h3><p class="cmeta"></p></div>
      <div class="ctools">
        ${per}
        <span class="grip" title="Drag to move this card">${svg('grip',14,1.8)}</span>
      </div>
    </header>
    ${tabs}
    <div class="cbody${m.flush?' flush':''}${bodyCls}">${inner}</div>
    <span class="rsz" title="Drag to resize"></span>`;
  syncMeta(el);
  return el;
}

/* ---- board hover card -----------------------------------------------
   One hover/focus card for every data point on the board — message rows,
   Goals gauges, CPM/Fleet bar segments and legend rows all carry a
   data-htip='{"t":title,"r":[[color,label,value],...]}' attribute instead
   of a plain data-tip string, so they render with the same title + colour
   -swatch rows as the chart hover card (.ctip) rather than each having its
   own look. Lives on <body> and is position:fixed, same reasoning as
   before: never clipped by a card's own overflow:hidden/auto, and anchored
   to the hovered element's own rect rather than the cursor. */
const htip=document.createElement('div');
htip.className='htip';
document.body.appendChild(htip);
function hideHTip(){ htip.classList.remove('show'); }
function showHTip(el){
  let d; try{ d=JSON.parse(el.dataset.htip); }catch(err){ return; }
  if(!d) return;
  htip.innerHTML=`<div class="th">${esc(d.t)}</div>`+
    d.r.map(([c,label,v])=>`<div class="tr"><i style="background:${c}"></i><span>${esc(label)}</span><b>${esc(v)}</b></div>`).join('');
  htip.classList.add('show');
  const r=el.getBoundingClientRect(), w=htip.offsetWidth, h=htip.offsetHeight;
  let x=Math.max(8,Math.min(innerWidth-w-8,r.left+r.width/2-w/2));
  let y=r.top-h-10; if(y<8) y=r.bottom+10;
  htip.style.left=x+'px'; htip.style.top=y+'px';
}
board.addEventListener('pointerover',ev=>{
  const el=ev.target.closest('[data-htip]');
  if(!el||drag||rsz){ hideHTip(); return; }
  showHTip(el);
});
board.addEventListener('pointerout',ev=>{
  const el=ev.target.closest('[data-htip]');
  if(el && ev.relatedTarget && el.contains(ev.relatedTarget)) return;
  if(el) hideHTip();
});
board.addEventListener('focusin',ev=>{
  const el=ev.target.closest('[data-htip]'); if(el) showHTip(el);
});
board.addEventListener('focusout',ev=>{
  const el=ev.target.closest('[data-htip]');
  if(el && ev.relatedTarget && el.contains(ev.relatedTarget)) return;
  if(el) hideHTip();
});
$('#main').addEventListener('scroll',hideHTip,{passive:true});

/* ---- rows share one height ---------------------------------------------
   Cards land on a grid row together, so a row reads as a band rather than a
   ragged edge. Auto cards are reset to their natural height first, then every
   auto card in the row takes the row's tallest — so removing a tall card lets
   the row come back down instead of ratcheting upwards. A card the user has
   resized keeps its own height and is exempt. */
function naturalH(el){ return ((METRICS[el.dataset.id]||{}).h)||296; }
function equalizeRows(){
  const cards=$$('.card',board); if(!cards.length) return;
  cards.forEach(el=>{ if(el.dataset.uh!=='1') el.style.height=naturalH(el)+'px'; });
  const rows=new Map();                       // grid rows all share an offsetTop
  cards.forEach(el=>{
    const t=Math.round(el.offsetTop);
    if(!rows.has(t)) rows.set(t,[]);
    rows.get(t).push(el);
  });
  rows.forEach(r=>{
    const h=Math.max(...r.map(el=>Math.round(el.getBoundingClientRect().height)));
    r.forEach(el=>{ if(el.dataset.uh!=='1') el.style.height=h+'px'; });
  });
}
let eqT;
function equalizeSoon(){ clearTimeout(eqT); eqT=setTimeout(equalizeRows,90); }
window.addEventListener('resize',equalizeSoon);

/* ---- drag to reorder ----------------------------------------------------
   The card detaches, follows the pointer, and a placeholder tracks where it
   will land. Siblings are animated with a FLIP pass so the board rearranges
   smoothly rather than jumping. Nothing is committed until the pointer is
   released. */
let drag=null;

function flip(measure){
  if(REDUCED()){ measure(); return; }
  const cards=$$('.card',board).filter(c=>c!==(drag&&drag.card));
  const before=new Map(cards.map(c=>[c,c.getBoundingClientRect()]));
  measure();
  cards.forEach(c=>{
    const a=before.get(c), b=c.getBoundingClientRect();
    const dx=a.left-b.left, dy=a.top-b.top;
    if(!dx&&!dy) return;
    c.classList.remove('shifting');
    c.style.transform=`translate(${dx}px,${dy}px)`;
    void c.offsetWidth;                       // flush, so the next change animates
    c.classList.add('shifting');
    c.style.transform='';
    clearTimeout(c._flip);
    c._flip=setTimeout(()=>{ c.classList.remove('shifting'); c.style.transform=''; },240);
  });
}

function startDrag(){
  const card=drag.card, r=card.getBoundingClientRect();
  drag.r=r; drag.gc=card.style.gridColumn; drag.h=card.style.height;
  const ph=document.createElement('div');
  ph.className='card-ph';
  ph.style.gridColumn=drag.gc;
  ph.style.height=r.height+'px';
  card.after(ph);
  drag.ph=ph;
  card.style.width=r.width+'px';
  card.style.height=r.height+'px';
  card.style.left=r.left+'px';
  card.style.top=r.top+'px';
  card.classList.add('dragging');
  document.body.classList.add('dragging');
  drag.live=true;
}

board.addEventListener('pointerdown',ev=>{
  const head=ev.target.closest('.chead'); if(!head) return;
  if(ev.target.closest('select,button,input,a')) return;
  const card=head.closest('.card'); if(!card) return;
  ev.preventDefault();                        // stops the native text selection
  drag={card,x0:ev.clientX,y0:ev.clientY,live:false};
  head.setPointerCapture(ev.pointerId);
});

board.addEventListener('pointermove',ev=>{
  if(!drag) return;
  if(!drag.live){
    if(Math.hypot(ev.clientX-drag.x0,ev.clientY-drag.y0)<5) return;
    startDrag();
  }
  drag.card.style.transform=
    `translate(${ev.clientX-drag.x0}px,${ev.clientY-drag.y0}px) scale(1.02)`;

  const under=document.elementFromPoint(ev.clientX,ev.clientY);
  const tgt=under&&under.closest?under.closest('.card'):null;
  if(!tgt||tgt===drag.card||tgt.parentElement!==board) return;
  const tr=tgt.getBoundingClientRect();
  const after=(ev.clientX-tr.left)/tr.width>.5;
  const ref=after?tgt.nextSibling:tgt;
  if(ref===drag.ph) return;                   // placeholder already sits there
  if(!after && drag.ph.nextSibling===tgt) return;
  flip(()=>board.insertBefore(drag.ph,ref));
});

function endDrag(){
  if(!drag) return;
  if(!drag.live){ drag=null; return; }
  const card=drag.card, ph=drag.ph, r=drag.r, gc=drag.gc, h=drag.h;
  drag=null;
  document.body.classList.remove('dragging');

  const to=ph.getBoundingClientRect();        // glide into the slot, then commit
  card.classList.add('landing');
  card.style.transform=`translate(${to.left-r.left}px,${to.top-r.top}px)`;

  let done=false;
  const settle=()=>{
    if(done) return; done=true;
    card.removeEventListener('transitionend',settle);
    ph.replaceWith(card);
    card.classList.remove('dragging','landing');
    card.style.position=card.style.left=card.style.top=
      card.style.width=card.style.transform=card.style.zIndex='';
    card.style.gridColumn=gc; card.style.height=h;
    equalizeRows(); syncCards();
    toast('Layout updated. <b>Order saved</b>');
  };
  /* transitions are off under reduced motion, so transitionend never fires —
     drop straight into place rather than waiting out the fallback timer. */
  if(REDUCED()){ settle(); return; }
  card.addEventListener('transitionend',settle);
  setTimeout(settle,280);                     // fallback if the transition is skipped
}

board.addEventListener('pointercancel',endDrag);

/* ---- resize ------------------------------------------------------------- */
let rsz=null;
board.addEventListener('pointerdown',ev=>{
  const h=ev.target.closest('.rsz'); if(!h) return;
  ev.preventDefault(); ev.stopPropagation();
  const card=h.closest('.card'), r=card.getBoundingClientRect();
  const gap=parseFloat(getComputedStyle(board).columnGap)||14;
  const inner=board.clientWidth-36;
  rsz={card,x0:ev.clientX,y0:ev.clientY,w0:r.width,h0:r.height,colW:(inner-gap*11)/12,gap};
  card.classList.add('resizing');
  h.setPointerCapture(ev.pointerId);
  hint(ev,'');
});
window.addEventListener('pointermove',ev=>{
  if(!rsz) return;
  const span=clamp(Math.round((rsz.w0+ev.clientX-rsz.x0+rsz.gap)/(rsz.colW+rsz.gap)),2,12);
  const hgt=clamp(Math.round(rsz.h0+ev.clientY-rsz.y0),84,1600);
  rsz.card.style.gridColumn='span '+span;
  rsz.card.style.height=hgt+'px';
  hintMove(ev);
  setHint(`${span} / 12 columns · ${Math.round(rsz.card.getBoundingClientRect().height)} px`);
});
window.addEventListener('pointerup',()=>{
  if(!rsz) return;
  rsz.card.classList.remove('resizing');
  if(Math.abs(rsz.card.getBoundingClientRect().height-rsz.h0)>1) rsz.card.dataset.uh='1';
  const w=$('.chart-wrap',rsz.card); if(w) paint(w,false);
  const card=rsz.card; rsz=null; hideHint();
  equalizeRows(); syncCards();
  const w2=$('.chart-wrap',card); if(w2) paint(w2,false);
});

function setHint(t){ hintEl.textContent=t; }

/* ===========================================================================
   8b. CARD OPTIONS FLYOUT  (Time Period / Chart Type / Label Choices)
   ======================================================================== */
const OPT_PANES={
  range:{h:'Date range · this card only',l:'Date range',key:'range',opts:RANGE_OPTS},
  period:{h:'Time period',l:'Time period',key:'period',opts:[['Days','Days'],['Weeks','Weeks'],
          ['Months','Months'],['Quarters','Quarters']]},
  type:{h:'Chart type',l:'Chart type',key:'type',opts:[['','Chart Default'],
        ['line','Line Graph (Simple)'],['curve','Line Graph (Curved)'],
        ['area','Area Graph'],['hbar','Bar Graph (Horizontal)'],
        ['bar','Bar Graph (Vertical)'],['combo','Combo (Bar + Line)'],
        ['scatter','Scattergram']]},
  labels:{h:'Label choices',l:'Labels',key:'labels',opts:[['','Default (outside end)'],['out','Outside End'],
          ['in','Inside End'],['center','Center'],['none','No labels']]},
  card:{h:'Card layout',l:'Card layout',key:'_act',opts:[['wide','Make full width'],['half','Half width'],
        ['third','Quarter width'],['tall','Reset height'],['remove','Remove from page']]}
};
const LAB_NAME={'':'Default',out:'Outside end',in:'Inside end',center:'Center',none:'Off'};
const SPAN_NAME={12:'Full width',6:'Half width',3:'Quarter width'};
function doCardAct(card,act){
  if(act==='remove'){
    const t=$('h3',card).textContent;
    card.remove(); closeOpt(); syncCards(); renderGPanel();
    toast(`Removed <b>${esc(t)}</b>`);
    if(!$$('.card',board).length) renderBoard();
    return;
  }
  const label={wide:'Full width',half:'Half width',third:'Quarter width',
               tall:'Height reset — back in step with its row'}[act];
  if(act==='wide')  card.style.gridColumn='span 12';
  if(act==='half')  card.style.gridColumn='span 6';
  if(act==='third') card.style.gridColumn='span 3';
  if(act==='tall'){ delete card.dataset.uh; card.style.height=naturalH(card)+'px'; }
  equalizeRows();
  syncCards();
  const w=$('.chart-wrap',card); if(w) paint(w,false);
  renderOpt();                   // refresh the highlighted width, stay open
  toast(`<b>${esc($('h3',card).textContent)}</b> &middot; ${label}`);
}
let optMenu=null, optCard=null, optAnchor=null, optPane='period';
function closeOpt(){
  if(!optMenu) return;
  optMenu.classList.remove('show');
  if(optCard) optCard.classList.remove('menuopen');
  optCard=null; optAnchor=null;
}
function cardOpt(card){ try{ return JSON.parse(card.dataset.opt||'{}'); }catch(e){ return {}; } }
function renderOpt(){
  if(!optCard) return;
  const isChart=!!(METRICS[optCard.dataset.id]||{}).spec;
  const eff=effOpt(optCard), co=cardOpt(optCard), P=OPT_PANES[optPane];
  const span = parseInt((String(optCard.style.gridColumn).match(/\d+/)||[3])[0],10);
  const sel = optPane==='period' ? (co.period||eff.period)
            : optPane==='card'   ? ({12:'wide',6:'half',3:'third'}[span]||'')
            : (co[P.key]||'');
  /* each setting shows its CURRENT value under its name, so the left pane
     reads as a summary of the card before anything is opened */
  const cur={
    range: co.range ? RANGE_NAME[co.range] : 'Today',
    period: isChart ? eff.period : '—',
    type: isChart ? (co.type ? TYPE_NAME[co.type] : 'Chart default') : '—',
    labels: isChart ? (co.labels ? LAB_NAME[co.labels] : 'Default') : '—',
    card: SPAN_NAME[span] || `${span} of 12 columns`
  };
  const left=['range','period','type','labels','card'].map(k=>{
    const dis = !isChart && (k==='period'||k==='type'||k==='labels');
    return `<button type="button" data-pane="${k}" class="${optPane===k?'on':''}" ${dis?'disabled':''}>
      <span class="lt"><b>${OPT_PANES[k].l}</b><i>${esc(cur[k])}</i></span>
      <span class="c">${svg('chev',12,2.2)}</span></button>`;
  }).join('');
  const right=P.opts.map(([v,l])=>{
    const danger=v==='remove';
    return `${danger?'<div class="opt-sep"></div>':''}
      <button type="button" data-set="${P.key}" data-v="${v}" class="${v===sel?'on':''}${danger?' danger':''}">
        <span class="ck">${svg(danger?'trash':'check',13,2.4)}</span>${l}</button>`;
  }).join('');
  optMenu.innerHTML=`
    <div class="opt-l">
      <div class="opt-name" title="${esc($('h3',optCard).textContent)}">${esc($('h3',optCard).textContent)}</div>
      ${left}
    </div>
    <div class="opt-r">
      <div class="opt-h">${P.h}</div>
      ${right}
    </div>`;
  placeOpt();
}

/* The panes are different heights — Card Layout has five rows where Time
   Period has four — so the menu has to be re-measured after every render.
   Positioning only on open left the lower entries below the fold. */
function placeOpt(){
  if(!optMenu||!optAnchor) return;
  optMenu.style.maxHeight=Math.max(180,innerHeight-16)+'px';
  const r=optAnchor.getBoundingClientRect();
  const w=optMenu.offsetWidth, h=optMenu.offsetHeight;
  const below=r.bottom+6, above=r.top-h-6;
  let top = (below+h<=innerHeight-8) ? below
          : (above>=8 ? above : Math.max(8,innerHeight-h-8));
  optMenu.style.left=Math.max(8,Math.min(r.left,innerWidth-w-8))+'px';
  optMenu.style.top=top+'px';
}
function openOpt(card,btn){
  if(!optMenu){
    optMenu=document.createElement('div');
    optMenu.className='optmenu';
    document.body.appendChild(optMenu);
    optMenu.addEventListener('click',ev=>{
      /* renderOpt() replaces innerHTML, so the clicked node is detached by the
         time this event reaches document — where the outside-click guard would
         read it as a click outside the menu and close it. Stop it here. */
      ev.stopPropagation();
      const l=ev.target.closest('[data-pane]');
      if(l){ if(!l.disabled){ optPane=l.dataset.pane; renderOpt(); } return; }
      const r=ev.target.closest('[data-set]'); if(!r) return;
      if(!optCard||!optCard.isConnected){ closeOpt(); return; }
      const k=r.dataset.set, v=r.dataset.v;
      if(k==='_act'){ doCardAct(optCard,v); return; }
      const co=cardOpt(optCard);
      if(v==='') delete co[k]; else co[k]=v;
      optCard.dataset.opt=JSON.stringify(co);
      syncCards(); syncMeta(optCard);
      const w=$('.chart-wrap',optCard); if(w) paint(w,true);
      rollNumbers($$('.roll',optCard),900);
      renderOpt();
      toast(`<b>${esc($('h3',optCard).textContent)}</b> &middot; ${esc(r.textContent.trim())}`);
    });
  }
  $$('.card.menuopen',board).forEach(x=>x.classList.remove('menuopen'));
  optCard=card; optAnchor=btn; optCard.classList.add('menuopen');
  optPane='range';
  optMenu.classList.add('show');   // must be visible before it can be measured
  renderOpt();
}
document.addEventListener('click',ev=>{
  if(optMenu&&optCard&&!optMenu.contains(ev.target)&&!ev.target.closest('.copt')) closeOpt();
});
/* The board scrolls under the flyout, so follow the anchor rather than
   stranding the menu where it was first drawn. */
window.addEventListener('resize',()=>{ if(optCard) placeOpt(); });
$('#main').addEventListener('scroll',()=>{
  if(!optCard) return;
  if(!optCard.isConnected||!optAnchor.isConnected){ closeOpt(); return; }
  placeOpt();
},{passive:true});

let DV={key:null,rows:[],sort:null,dir:1,q:'',page:0,size:10};

function numify(v){
  const n=parseFloat(String(v).replace(/[^0-9.\-]/g,''));
  return isNaN(n)?null:n;
}
function openDetail(key){
  const ds=DATASETS[key]; if(!ds){ toast('No detail view is wired to that figure yet'); return; }
  DV={key,rows:ds.rows(),sort:null,dir:1,q:'',page:0,size:10};
  viewHome.classList.add('hide'); viewDetail.classList.remove('hide');
  renderDetail(); $('#main').scrollTop=0;
}
function closeDetail(){
  viewDetail.classList.add('hide'); viewHome.classList.remove('hide');
  $$('.chart-wrap',board).forEach(w=>paint(w,false));
}
function dvFiltered(){
  const ds=DATASETS[DV.key];
  let rows=DV.rows;
  if(DV.q){
    const q=DV.q.toLowerCase();
    rows=rows.filter(r=>ds.cols.some(cl=>!cl.plain&&String(r[cl.k]??'').toLowerCase().includes(q)));
  }
  if(DV.sort){
    const k=DV.sort;
    rows=[...rows].sort((a,b)=>{
      const na=numify(a[k]), nb=numify(b[k]);
      if(na!==null&&nb!==null) return (na-nb)*DV.dir;
      return String(a[k]).localeCompare(String(b[k]))*DV.dir;
    });
  }
  return rows;
}
function renderDetail(){
  const ds=DATASETS[DV.key];
  const all=dvFiltered();
  const pages=Math.max(1,Math.ceil(all.length/DV.size));
  DV.page=clamp(DV.page,0,pages-1);
  const rows=all.slice(DV.page*DV.size,(DV.page+1)*DV.size);

  const caret=cl=>{
    if(cl.plain) return '';
    const on=DV.sort===cl.k;
    const ic=!on?'<path d="m8 9 4-4 4 4M8 15l4 4 4-4"/>':(DV.dir>0?'<path d="m6 15 6-6 6 6"/>':'<path d="m6 9 6 6 6-6"/>');
    return `<span class="car"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">${ic}</svg></span>`;
  };
  const head=ds.cols.map(cl=>`<th data-k="${cl.k}" class="${DV.sort===cl.k?'sorted':''}${cl.num?' tnum':''}">${esc(cl.h)}${caret(cl)}</th>`).join('');

  const body=rows.length? rows.map(r=>`<tr>${ds.cols.map(cl=>{
    if(cl.render) return `<td>${cl.render(r)}</td>`;
    const v=r[cl.k]??'';
    return `<td class="${cl.num?'tnum':''}">${cl.link?`<a>${esc(v)}</a>`:esc(v)}</td>`;
  }).join('')}</tr>`).join('')
  : `<tr><td colspan="${ds.cols.length}"><div class="norows">Nothing matches that search.</div></td></tr>`;

  viewDetail.innerHTML=`
    <div class="dtop">
      <div>
        <div class="crumb">
          <button id="crumbHome">${svg('back',12,2.4)} Home</button>
          <span class="sl">/</span><span class="cur">${esc(ds.title)}</span>
        </div>
        <h2>${esc(ds.title)}</h2>
      </div>
      <div class="dtools">
        <button class="btn ghost sm" id="dvHide">${svg('eye',13,1.8)} View/Hide Widgets</button>
        <button class="btn out sm" id="dvEdit">${svg('layout',13,1.8)} Edit Widgets</button>
      </div>
    </div>

    <div class="subbar">
      <span class="cnt">${esc(ds.showCount||ds.title)} <span class="badge mono">${ds.count}</span></span>
      <div class="dsearch">
        ${svg('search',14,2)}
        <input id="dvQ" type="text" placeholder="Search ${esc((ds.showCount||ds.title).toLowerCase())}…" value="${esc(DV.q)}" aria-label="Search ${esc(ds.title)}">
      </div>
      <span class="rt">
        <button class="btn ghost sm" id="dvFilters">${svg('filter',13,1.8)} Filters</button>
        <button class="btn out sm" id="dvCols">${svg('cols',13,1.8)} Columns</button>
      </span>
    </div>

    <div class="tablewrap joined">
      <table class="dt"><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>
    </div>

    <div class="pager">
      <button id="dvPrev" ${DV.page===0?'disabled':''}>${svg('back',12,2.4)} Previous</button>
      <span class="mid">
        <span>Rows per page</span>
        <select class="sel pgsel" id="dvSize" aria-label="Rows per page">
          ${[10,25,50].map(n=>`<option ${n===DV.size?'selected':''}>${n}</option>`).join('')}
        </select>
        <span class="rng">${all.length?DV.page*DV.size+1:0}&ndash;${Math.min(all.length,(DV.page+1)*DV.size)} of ${all.length}</span>
      </span>
      <button id="dvNext" ${DV.page>=pages-1?'disabled':''}>Next ${svg('chev',12,2.4)}</button>
    </div>
    <div style="height:26px"></div>`;

  $('#crumbHome').onclick=closeDetail;
  $('#dvPrev').onclick=()=>{DV.page--;renderDetail();};
  $('#dvNext').onclick=()=>{DV.page++;renderDetail();};
  $('#dvSize').onchange=e=>{DV.size=+e.target.value;DV.page=0;renderDetail();};
  $('#dvHide').onclick=()=>toast('Widget visibility is managed in <b>Edit Widgets</b>');
  $('#dvEdit').onclick=()=>toast('Column layout editor opens here');
  $('#dvFilters').onclick=()=>toast('Column filters open here');
  $('#dvCols').onclick=()=>toast('Choose which columns show on this table');
  const q=$('#dvQ');
  q.oninput=()=>{ DV.q=q.value; DV.page=0; renderDetail();
    const n=$('#dvQ'); n.focus(); n.setSelectionRange(n.value.length,n.value.length); };
  $$('#viewDetail th[data-k]').forEach(th=>th.onclick=()=>{
    const k=th.dataset.k;
    if(DV.sort===k) DV.dir=-DV.dir; else { DV.sort=k; DV.dir=1; }
    renderDetail();
  });
}

/* ===========================================================================
   11. CHROME + INIT
   ======================================================================== */
const MODULES=['Home','Dispatch','Equipment','Customer','Personnel','Safety','Billing','Sales','Reporting','Accounting'];
$('#modnav').innerHTML=MODULES.map((m,i)=>`<a href="#" class="${i===0?'on':''}">${m}</a>`).join('');
$('#modnav').addEventListener('click',ev=>{
  const a=ev.target.closest('a'); if(!a) return; ev.preventDefault();
  $$('#modnav a').forEach(x=>x.classList.remove('on')); a.classList.add('on');
  if(a.textContent!=='Home') toast(`<b>${a.textContent}</b> module opens here`);
  else { closeDetail(); }
});
$('#rail').innerHTML=
  [['grid','Home',1],['doc','Documents'],['truck','Equipment'],['user','Personnel'],
   ['cal','Calendar'],['chat','ProChat'],['bag','Billing'],['pin','Tracking']]
  .map(([ic,t,on])=>`<button class="${on?'on':''}" title="${t}" aria-label="${t}">${svg(ic,19)}</button>`).join('')
  +`<span class="sp"></span>`
  +[['gear','Settings'],['list','Activity']]
  .map(([ic,t])=>`<button title="${t}" aria-label="${t}">${svg(ic,19)}</button>`).join('');
$('#rail').addEventListener('click',ev=>{
  const b=ev.target.closest('button'); if(!b) return;
  $$('#rail button').forEach(x=>x.classList.remove('on')); b.classList.add('on');
});

/* ---- theme ------------------------------------------------------------- */
const btnTheme=$('#btnTheme');
function applyTheme(dark){
  document.documentElement.setAttribute('data-theme',dark?'dark':'light');
  syncPalette();
  $('#themeIcon').innerHTML=dark?I.sun:I.moon;
  const label=dark?'Switch to light mode':'Switch to dark mode';
  btnTheme.title=label; btnTheme.setAttribute('aria-label',label);
  btnTheme.setAttribute('aria-pressed',String(dark));
}
btnTheme.addEventListener('click',async()=>{
  const dark=document.documentElement.getAttribute('data-theme')!=='dark';
  applyTheme(dark);
  await Store.set('dpt.theme',dark?'dark':'light');
  /* charts read their colours from CSS variables, so repaint after the swap */
  $$('.chart-wrap',board).forEach(w=>paint(w,false));
  toast(dark?'Dark mode on':'Light mode on');
});

(async function init(){
  const saved=await Store.get('dpt.theme');
  applyTheme(saved ? saved==='dark'
                   : matchMedia('(prefers-color-scheme:dark)').matches);
  await loadState();
  if(STATE.defaultId && STATE.profiles.some(p=>p.id===STATE.defaultId)) STATE.activeId=STATE.defaultId;
  renderProfileSelect(); renderCreateMenu(); renderBoard(); renderGPanel();
})();
</script>
