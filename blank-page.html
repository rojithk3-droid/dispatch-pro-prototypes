<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dispatch Pro — Blank Page</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Inter as a VARIABLE font (opsz + wght axes), not the 5 static instances
     this file used to request. The variable face is what shadcn/ui ships
     with, and it lets font-optical-sizing actually do something at the small
     sizes this UI uses. -->
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300..800&display=swap" rel="stylesheet">
<!-- Lucide: the icon set Basecoat ships its components with. Every
     <i data-lucide="name"> in the markup below is swapped for an inline
     <svg> at runtime; dpIcons() re-runs it after JS builds new rows. -->
<script src="https://cdn.jsdelivr.net/npm/lucide@0.544.0/dist/umd/lucide.min.js"></script>
<style>
  /* ---------------- TOKENS ---------------- */
  :root{
    --blue:            #0F6FFF;
    --blue-dark:       #1667CA;
    --blue-bg:         #EFF6FF;
    --blue-border:     #DBEAFE;
    --red:             #E7000B;
    --text-dark:       #101828;
    --text-heading:    #1E2939;
    --text-body:       #364153;
    --text-muted:      #6A7282;
    --text-faint:      #99A1AF;
    --border:          #E5E7EB;
    --border-soft:     #F3F4F6;
    --page-bg:         #F9FAFB;
    --sidebar-bg:      #FFFFFF;

    --navy-deep:       #101B33;
    --card-navy:       #16274A;
    --blue-pill:       #2E7DF7;
    --icon-muted-dark: #66739A;
    --hairline-dark:   rgba(255,255,255,0.08);

    --surface:         #FFFFFF;
    --segmented-track: #F3F4F6;
    --input-border:    #E4E7EC;
    --icon-default:    #4A5468;
  }
  /* Dark theme palette calibrated to login.html's own — same file that
     the button dimensions above and the dropdown hover color were ported
     from. login.html's dark tokens (its 2FA/OTP step included) are
     --bg:#0b1220 --surface:#121b2e --border:#263248 --heading/--text-
     strong:#f3f5f9 --text-color:#a6b0c3 --text-faint:#7c879b — mapped
     onto this file's own (more granular, 2-tier heading / +muted-tier)
     token names below rather than flattening our scale to match theirs. */
  [data-theme="dark"]{
    --page-bg:         #0B1220;
    --surface:         #121B2E;
    --segmented-track: #17202F;
    --border:          #263248;
    --border-soft:     #1C2537;
    --input-border:    #2A3346;
    --text-dark:       #F3F5F9;
    --text-heading:    #E9EDF4;
    --text-body:       #A6B0C3;
    --text-muted:      #8B96AC;
    --text-faint:      #7C879B;
    --blue-bg:         #16233A;
    /* The blue accent needs a dark border of its own, exactly as the green,
       amber and red families get one in the CONTENT palette further down.
       Without it the light value (#DBEAFE) leaks into dark mode and paints a
       near-white outline on the navy fill - which is what made the step-2
       explainer alert look like it came from a different design. Lifted off
       --blue-bg by about what --border is lifted off --surface, with the
       blue channel kept high so it still reads as the info accent and not
       as a neutral hairline. */
    --blue-border:     #2C3E60;
    --icon-default:    #AEB6C7;
  }

  :root{
    /* shadcn neutral semantics this file didn't have. --accent is the
       menu/option hover fill: neutral, not the blue tint used before. */
    --accent:          #F4F4F5;
    --accent-fg:       #18181B;
    --popover:         #FFFFFF;
    --muted-fg:        #71717A;

    --ring:            rgba(15,111,255,0.50);
    --ring-danger:     rgba(231,0,11,0.20);
    /* shadcn shadow-xs / shadow-sm / shadow-md / shadow-lg */
    /* Drop shadows removed by request: every elevation surface (cards,
       buttons, inputs, the dropdown panel, the dialog, toasts,
       the stepper shell, the summary rail, the active tab) resolves these
       tokens, so nulling them here turns all of it off in one place and
       keeps it trivially reversible. Focus RINGS are unaffected - they are
       spread-only `0 0 0 Npx` box-shadows written inline, not elevation. */
    --shadow-xs:       none;
    --shadow-sm:       none;
    --shadow-md:       none;
    --shadow-lg:       none;

    --green:           #047857;
    --green-bg:        #ECFDF5;
    --green-border:    #A7F3D0;
    --amber:           #B45309;
    --amber-bg:        #FFFBEB;
    --amber-border:    #FDE68A;
    --red-bg:          #FEF2F2;
    --red-border:      #FFE2E2;
    --row-hover:       #FAFAFA;

    /* Type scale — rendered size in the comment. */
    /* Rendered size in the comment (declared x 0.8), all whole pixels.
       Every LINE-HEIGHT also renders EVEN. That is deliberate: a line box
       is constantly centred against a container (a button, a table cell, a
       card footer, a flex row), and an odd line box inside an even box
       centres onto a half-pixel. --lh-xs at 16.25px rendered 13px and
       --lh-base at 23.75px rendered 19px, which put the card footers, the
       review "Edit" links and the GL cells all on halves. */
    --fs-xs:    12.5px;   --lh-xs:   17.5px;   /* 10 / 14 */
    --fs-sm:    13.75px;  --lh-sm:   20px;     /* 11 / 16 */
    --fs-base:  16.25px;  --lh-base: 25px;     /* 13 / 20 */
    --fs-lg:    17.5px;   --lh-lg:   27.5px;   /* 14 / 22 */
    --fs-xl:    20px;     --lh-xl:   27.5px;   /* 16 / 22 */
    --fs-2xl:   23.75px;  --lh-2xl:  32.5px;   /* 19 / 26 */

    /* Control heights + radii */
    --h-8:      32.5px;   /* 26 - shadcn size="sm" at 80% */
    /* 30, not 29: an EVEN painted height. A flex/inline child centred in an
       odd-height box lands on a half-pixel (an even 16px line box in a 29px
       trigger sat at y+6.5), which softens the text. Even container heights
       centre even children exactly. */
    --h-9:      37.5px;   /* 30 - shadcn default at 80%   */
    --h-10:     40px;     /* 32 - shadcn size="lg" at 80% */
    --r-sm:     3.75px;   /* 3  - rounded-sm  */
    --r-md:     6.25px;   /* 5  - rounded-md  */
    --r-lg:     7.5px;    /* 6  - rounded-lg  */
    --r-xl:     12.5px;   /* 10 - rounded-xl  */
    --ring-w:   2.5px;    /* 2  - ring        */
  }
  [data-theme="dark"]{
    --accent:          #27272A;
    --accent-fg:       #FAFAFA;
    --popover:         #121B2E;
    --muted-fg:        #8B96AC;

    --ring:            rgba(58,140,255,0.55);
    --ring-danger:     rgba(248,113,113,0.26);
    --shadow-xs:       none;
    --shadow-sm:       none;
    --shadow-md:       none;
    --shadow-lg:       none;

    --green:           #6EE7B7;
    --green-bg:        #0E2A22;
    --green-border:    #1C4638;
    --amber:           #FCD34D;
    --amber-bg:        #2A2113;
    --amber-border:    #4A3A18;
    --red-bg:          #2C1416;
    --red-border:      #4A1F24;
    --row-hover:       rgba(255,255,255,0.03);
  }

  /* ---------------- BASE ---------------- */
  *{ box-sizing:border-box; }
  [hidden]{ display:none !important; }
  html,body{ margin:0; padding:0; height:100%; }
  body{
    font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
    /* An explicit base size, ON the 1.25 grid. Without one, body inherits the
       UA's 16px, and 16 x 0.8 = 12.8px painted - a fractional glyph size, which
       is the one thing that genuinely softens text here (see the note on zoom
       below). Nothing visible inherited it today, but anything added without
       its own font-size would have rendered blurry for no obvious reason.
       13.75px -> 11px painted, matching --fs-sm, the body copy size.

       Font-size only, deliberately: every element that paints text sets its
       own line-height from the scale, so adding one here would only change
       the inline-box height of containers that currently use `normal` -
       layout churn for no glyph-quality gain. */
    font-size:var(--fs-sm);
    /* -webkit-font-smoothing / -moz-osx-font-smoothing:grayscale and
       text-rendering:optimizeLegibility used to sit here, with a comment
       claiming they fixed colour fringing from zoom:0.8 on Windows Chrome.
       Measured 1:1 against every alternative (antialiased / auto /
       subpixel-antialiased, and auto / optimizeLegibility / geometricPrecision
       / optimizeSpeed) at 11px and 22px: byte-identical rendering and
       identical advance widths. -webkit-font-smoothing is a macOS-only
       property in Blink, where `antialiased` makes text THINNER, and Chrome
       advises against optimizeLegibility. So they did nothing on the platform
       they were added for and could only hurt on the other one. */
    font-optical-sizing:auto;
    /* Never let the browser fake a weight it can synthesise badly — the
       variable face covers 300-800, so any miss is a real bug worth seeing. */
    font-synthesis-weight:none;
    background:var(--page-bg);
    display:flex;
    flex-direction:column;
    /* 125vh, not 100vh: body itself has zoom:0.8 below, so its own box
       gets rendered (painted) at 80% scale — a plain 100vh would only
       ever visually reach 80% of the true viewport height, leaving a
       blank gap below the sidebar/footer. Dividing by the zoom factor
       (100/0.8=125) compensates, same fix as the dropdown-panel's
       position math above. */
    height:125vh;
    overflow:hidden;
    color:var(--text-body);
    /* Whole-page 80% default zoom, per direct request. `zoom` (not
       `transform:scale`) so position:fixed content — the toasts
       and the custom .dropdown-panel's viewport-relative positioning —
       keeps behaving correctly instead of getting trapped in a
       transformed containing block.

       TEXT QUALITY, and the whole reason for the 1.25px grid: glyphs are
       rasterised at font-size x zoom x devicePixelRatio, and a FRACTIONAL
       result is what makes Inter look soft. Demonstrated directly - the same
       13.75px string at zoom .80 (11.00px, whole) is crisp, at .85 (11.69px)
       and .90 (12.38px) it is visibly blurred. Every size in the scale is a
       multiple of 1.25px so that x0.8 lands whole, which holds at dpr 1 and
       1.25 (0.8 x 1.25 = exactly 1.0). It does NOT hold at Windows display
       scaling of 150% or 175%: 0.8 x 1.5 = 1.2, and 13.75 x 1.2 = 16.5
       device px. On those displays the text is unavoidably soft, and no
       font property fixes it - only dropping `zoom` in favour of a scale
       authored at 100% would. */
    zoom:0.8;
  }
  button, input, select, textarea, optgroup{ font-family:inherit; }

  /* ---------------- TOP BAR ---------------- */
  .topbar{
    /* 66.25px total - 1.25px border = a 65px content box -> 52px painted,
       i.e. EVEN. What matters for flex centring is the CONTENT box, not the
       border box: at 63.75px the content box painted 51px (odd), so every
       even-height child sat on a half-pixel. The FSC card and icon-button
       sizes below were also nudged to even painted heights so all three
       topbar groups centre exactly. Same reasoning as --h-9. */
    height:66.25px;
    flex:0 0 66.25px;
    background:var(--surface);
    border-bottom:1.25px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 20px;
    gap:20px;
    z-index:10;
  }
  .topbar-left{ display:flex; align-items:center; gap:22.5px; min-width:0; flex:1 1 auto; }
  /* Explicit px line-heights on the 1.25 grid, not the unitless 1.25 that
     used to sit on .company-block: 1.25 x the 11.25px sub-label computed to
     14.0625px, the one off-grid line-height on the page, which made this
     block 27.25px tall and knocked its own text onto a half-pixel. */
  .company-block{ flex:0 0 auto; }
  .company-title{ font-size:15px; line-height:18.75px; font-weight:700; color:var(--text-dark); }
  .company-sub{ font-size:11.25px; line-height:15px; font-weight:500; color:var(--text-faint); margin-top:1.25px; }

  .search-box{
    background:var(--surface);
    border:1.25px solid var(--border);
    border-radius:6.25px;
    height:35px;
    width:280px;
    display:flex;
    align-items:center;
    padding:0 12.5px;
    gap:7.5px;
    flex:0 1 280px;
  }
  .search-box svg{ color:var(--text-faint); flex:0 0 auto; }
  .search-box input{
    border:none; outline:none; font-family:inherit; font-size:12.5px;
    /* Explicit grid line-height/height: with neither set, the input sized
       itself from font metrics to 13.59px painted, the one fractional box
       left in the topbar. */
    line-height:20px; height:20px;
    color:var(--text-body); flex:1; min-width:0; background:transparent;
  }
  .search-box input::placeholder{ color:var(--text-faint); }

  .topbar-right{ display:flex; align-items:center; gap:16.25px; flex:0 0 auto; }

  .surcharge-card{
    background:var(--card-navy);
    border-radius:7.5px;
    padding:7.5px 12.5px;
    display:flex;
    align-items:center;
    gap:10px;
    flex:0 0 auto;
  }
  /* Explicit grid line-heights and a 2px (painted) gap instead of 1px, so
     this two-line column is 22px painted rather than 21px. With `normal`
     line-height and a 1px gap the card came out 33px tall (odd) and every
     line inside it, plus the card itself, sat on a half-pixel. */
  .surcharge-label{ font-size:10px; line-height:12.5px; font-weight:700; letter-spacing:0.5px; color:#8FA3C7; text-transform:uppercase; }
  .surcharge-date{ font-size:10px; line-height:12.5px; color:#5E729C; margin-top:2.5px; }
  .surcharge-value{ font-size:16.25px; line-height:20px; font-weight:800; color:#fff; }

  .icon-actions{ display:flex; align-items:center; gap:6.25px; flex:0 0 auto; }
  .icon-btn{
    position:relative;
    width:35px; height:35px;
    border-radius:7.5px;
    display:flex; align-items:center; justify-content:center;
    color:var(--icon-default);
    background:none; border:none; cursor:pointer;
  }
  .icon-btn:hover{ background:var(--border-soft); }
  .icon-btn .dot{
    position:absolute; top:6.25px; right:7.5px;
    width:6.25px; height:6.25px; border-radius:50%;
    background:var(--red); border:1.25px solid var(--surface);
  }
  .icon-popover{
    position:absolute; top:calc(100% + 7.5px); right:0;
    width:220px;
    background:var(--surface);
    border:1.25px solid var(--border);
    border-radius:7.5px;
    /* Shadow removed with the rest; this was the only elevation written as a
       literal rather than through a --shadow-* token. */
    padding:10px 12.5px;
    font-size:12.5px; font-weight:400; line-height:1.4;
    color:var(--text-body);
    text-align:left;
    white-space:normal;
    cursor:default;
    z-index:50;
  }

  .user-chip{ display:flex; align-items:center; gap:7.5px; cursor:pointer; flex:0 0 auto; }
  .user-name{ font-size:13.75px; font-weight:600; color:var(--text-heading); }
  .user-chip .chevron{ color:var(--text-faint); }
  .avatar{
    width:32.5px; height:32.5px; border-radius:50%;
    background:var(--card-navy);
    color:#fff;
    font-size:12.5px; font-weight:700;
    display:flex; align-items:center; justify-content:center;
    flex:0 0 auto;
  }

  /* ---------------- BREADCRUMB ---------------- */
  .breadcrumb-bar{
    flex:0 0 auto;
    background:var(--surface);
    border-bottom:1.25px solid var(--border);
    padding:11.25px 23.75px;
    font-size:12.5px;
  }
  .breadcrumb-bar span{ color:var(--text-faint); }
  .breadcrumb-bar span.current{ color:var(--text-dark); font-weight:600; }

  /* ---------------- APP BODY ---------------- */
  .app-body{ flex:1 1 auto; display:flex; min-height:0; }

  /* ---------------- SIDEBAR ---------------- */
  .sidebar{
    width:56.25px;
    flex:0 0 56.25px;
    background:var(--navy-deep);
    border-right:1.25px solid var(--border);
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:12.5px 0;
    gap:6.25px;
    overflow-y:auto;
  }
  .sidebar::-webkit-scrollbar{ width:0; }
  .side-logo{
    width:32.5px; height:32.5px;
    background:var(--blue-pill);
    border-radius:7.5px;
    display:flex; align-items:center; justify-content:center;
    color:#fff; font-weight:800; font-size:11.25px; letter-spacing:0.2px;
    flex:0 0 auto;
    margin-bottom:6.25px;
  }
  .side-icon{
    position:relative;
    width:37.5px; height:33.75px;
    border-radius:7.5px;
    display:flex; align-items:center; justify-content:center;
    color:var(--icon-muted-dark);
    background:none; border:none; cursor:pointer;
    flex:0 0 auto;
  }
  .side-icon svg{ stroke-width:1.8; }
  .side-icon:hover{ color:#C4CEE4; background:rgba(255,255,255,0.06); }
  .side-icon.active{ color:#fff; background:rgba(255,255,255,0.08); }
  .side-icon.active::before{
    content:'';
    position:absolute; left:1.25px; top:50%; transform:translateY(-50%);
    width:2.5px; height:20px; border-radius:0 2.5px 2.5px 0;
    background:var(--blue-pill);
  }
  .sidebar-spacer{ flex:1 1 auto; }
  .side-icon-bottom{
    width:33.75px; height:33.75px;
    border-radius:7.5px;
    display:flex; align-items:center; justify-content:center;
    color:var(--icon-muted-dark);
    background:none; border:none; cursor:pointer;
  }
  .side-icon-bottom:hover{ color:#C4CEE4; }

  .content{ flex:1 1 auto; display:flex; flex-direction:column; min-height:0; }

  /* ---------------- TOAST (shadcn / sonner) ---------------- */
  .toast-stack{
    position:fixed; top:73.75px; right:20px; z-index:500;
    display:flex; flex-direction:column; gap:10px;
    pointer-events:none;
  }
  .toast{
    display:flex; align-items:flex-start; gap:10px;
    min-width:280px; max-width:360px;
    padding:16.25px;
    border-radius:var(--r-lg);
    border:1.25px solid var(--border);
    background:var(--popover);
    box-shadow:var(--shadow-lg);
    font-size:var(--fs-sm); line-height:var(--lh-sm);
    color:var(--muted-fg);
    animation:toast-in .2s cubic-bezier(.2,.9,.3,1) both;
  }
  @keyframes toast-in{ from{ opacity:0; transform:translateX(17.5px); } to{ opacity:1; transform:none; } }
  .toast .toast-title{
    font-weight:500; display:block; margin-bottom:2.5px; color:var(--text-dark);
  }
  .toast.success{ border-color:var(--green-border); }
  .toast.success svg, .toast.success .toast-title{ color:var(--green); }
  .toast.error{ border-color:var(--red-border); }
  .toast.error svg, .toast.error .toast-title{ color:var(--red); }
  [data-theme="dark"] .toast.error svg,
  [data-theme="dark"] .toast.error .toast-title{ color:#FCA5A5; }
  .toast svg{ flex:0 0 auto; margin-top:1.25px; width:16.25px; height:16.25px; }
</style>
<script>
  // Applied synchronously, before body paints, so a saved dark-mode
  // preference doesn't flash light-then-dark on load.
  (function(){
    try{
      var saved = localStorage.getItem('dp-theme');
      if(saved === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
    }catch(e){}
  })();
</script>
</head>
<body>

  <!-- BREADCRUMB — placeholder trail; swap for the real one per page. -->
  <div class="breadcrumb-bar">

  <div class="toast-stack" id="toastStack"></div>

  <script>
    /* Toasts — the app confirms saves and reports limits this way. */
    window.dpToast = (function(){
      var stack = document.getElementById('toastStack');
      var ICONS = {
        success: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>',
        error: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5M12 16.2v.1"/></svg>'
      };
      return function(kind, title, message){
        var el = document.createElement('div');
        el.className = 'toast ' + kind;
        el.innerHTML = ICONS[kind] + '<div><span class="toast-title">' + title + '</span>' + message + '</div>';
        stack.appendChild(el);
        setTimeout(function(){ el.remove(); }, 3200);
      };
    })();

    /* Dark mode toggle (bottom of the sidebar icon rail) */
    (function(){
      const root = document.documentElement;
      const btn = document.getElementById('themeToggleBtn');
      const sunIcon = btn.querySelector('.theme-icon-sun');
      const moonIcon = btn.querySelector('.theme-icon-moon');
      function applyTheme(theme){
        if(theme === 'dark') root.setAttribute('data-theme', 'dark');
        else root.removeAttribute('data-theme');
        sunIcon.style.display = theme === 'dark' ? 'none' : 'block';
        moonIcon.style.display = theme === 'dark' ? 'block' : 'none';
        btn.setAttribute('aria-pressed', theme === 'dark' ? 'true' : 'false');
        btn.title = theme === 'dark' ? 'Switch to light mode' : 'Switch to dark mode';
      }
      applyTheme(root.getAttribute('data-theme') === 'dark' ? 'dark' : 'light');
      btn.addEventListener('click', ()=>{
        const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        applyTheme(next);
        try{ localStorage.setItem('dp-theme', next); }catch(e){}
      });
    })();
  </script>

  <script>

    /* Sidebar nav rail: single-select highlighting, mirrors a real left nav. */
    (function(){
      var navIcons = document.querySelectorAll('.sidebar .side-icon');
      navIcons.forEach(function(icon){
        icon.addEventListener('click', function(){
          navIcons.forEach(function(i){ i.classList.remove('active'); });
          icon.classList.add('active');
        });
      });
    })();

    /* Topbar icon buttons: each shows a small popover on click; opening the
       mail popover also clears its unread dot. Only one popover open at a time. */
    (function(){
      function closeAllPopovers(){
        document.querySelectorAll('.icon-popover').forEach(function(p){ p.remove(); });
      }
      document.querySelectorAll('.icon-btn[data-popover]').forEach(function(btn){
        btn.addEventListener('click', function(e){
          e.stopPropagation();
          var alreadyOpen = btn.querySelector('.icon-popover');
          closeAllPopovers();
          if(alreadyOpen) return;
          var pop = document.createElement('div');
          pop.className = 'icon-popover';
          pop.textContent = btn.dataset.popover;
          btn.appendChild(pop);
          var dot = btn.querySelector('.dot');
          if(dot) dot.remove();
        });
      });
      document.addEventListener('click', closeAllPopovers);
    })();
  </script>

  <script>
    /* Lucide swap — any <i data-lucide="name"> added to the content area
       becomes an inline <svg>. Call dpIcons() again after injecting markup. */
    window.dpIcons = function(){
      if(window.lucide && window.lucide.createIcons) window.lucide.createIcons();
    };
    dpIcons();
  </script>
