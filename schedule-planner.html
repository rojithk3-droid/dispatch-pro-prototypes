    /* Events are authored against the week of Mon 6 Apr 2026, as day
       index + hour, and turned into real Dates below. `kind` picks the
       View Markers row that switches the chip on and off. */
    var WEEK0 = new Date(2026, 3, 6);
    function at(dayIdx, hour){ return new Date(2026, 3, 6 + dayIdx, hour); }

    var RAW = [
      ['d1','off',   0, 0,  1, 0, null],
      ['d1','load',  1, 6,  2,18, 'orange'],
      ['d1','drive', 3, 6,  3,18, 'green'],
      ['d1','duty',  3, 6,  3,18, 'orange'],
      ['d1','plan',  3, 6,  4,18, 'blue'],

      ['d2','load',  0, 6,  4,18, 'orange'],
      ['d2','drive', 5, 6,  5,18, 'green'],
      ['d2','duty',  5, 6,  5,18, 'orange'],

      ['d3','drive', 0, 6,  1,18, 'green'],
      ['d3','plan',  2, 6,  3,18, 'blue'],
      ['d3','drive', 4, 6,  4,18, 'green'],

      ['d4','load',  0, 6,  1,18, 'orange'],
      ['d4','drive', 2, 6,  2,18, 'green'],
      ['d4','duty',  2, 6,  2,18, 'orange'],
      ['d4','plan',  2, 6,  3,18, 'blue'],
      ['d4','off',   4, 0,  7, 0, null],

      ['d5','load',  0, 6,  4,18, 'orange'],
      ['d5','drive', 5, 6,  5,18, 'green'],
      ['d5','duty',  5, 6,  5,18, 'orange'],

      ['d6','drive', 0, 6,  1,18, 'green'],
      ['d6','plan',  2, 6,  3,18, 'blue'],
      ['d6','drive', 4, 6,  4,18, 'green'],

      ['d7','off',   0, 0,  1, 0, null],
      ['d7','load',  1, 6,  2,18, 'orange'],
      ['d7','drive', 3, 6,  3,18, 'green'],
      ['d7','duty',  3, 6,  3,18, 'orange'],
      ['d7','plan',  3, 6,  4,18, 'blue']
    ];

    var EVENTS = RAW.map(function(r, i){
      var off = r[1] === 'off';
      return {
        id:      'e' + i,
        driver:  r[0],
        kind:    r[1],
        start:   at(r[2], r[3]),
        end:     at(r[4], r[5]),
        tone:    off ? 'slate' : r[6],
        title:   off ? 'Vacation/Time Off' : 'Montello, MS',
        from:    off ? null : 'Montello, MS',
        to:      off ? null : 'Elkhart, IN',
        ref:     off ? null : 'DATR-1789224'
      };
    });

    var REMINDERS = [
      { name:'Harris, Lacy', sub:'West Monroe, LA  DATR-1789224', stops:[1, 99],
        from:'Fairfield, CA', fromAt:'Mar 15 08:00 AM', to:'Roanoke, VA',  toAt:'Mar 16 11:00 AM' },
      { name:'Philip Sam',   sub:'Huttonsville, VA  DATR-1789225', stops:[1, 99],
        from:'Elkhart, IN',   fromAt:'Mar 15 08:00 AM', to:'Montello, MS', toAt:'Mar 16 11:00 AM' }
    ];

    /* The four markers are the Figma's. "Planned Load" is added so every
       tone painted on the board has a control - without it the blue
       chips are the only ones that cannot be switched off. */
    var MARKERS = [
      { kind:'drive', label:'Drive Time',   dot:'var(--ev-green-dot)'  },
      { kind:'duty',  label:'On Duty',      dot:'var(--ev-orange-dot)' },
      { kind:'off',   label:'Off Duty',     dot:'var(--ev-red-dot)'    },
      { kind:'load',  label:'Sleeper Birth',dot:'var(--ev-slate-dot)'  },
      { kind:'plan',  label:'Planned Load', dot:'var(--ev-blue-dot)'   }
    ];

    /* ---------- state ---------- */
    var state = {
      view:     'week',
      anchor:   new Date(2026, 3, 6),
      calMonth: new Date(2026, 3, 1),
      selected: null,
      search:   '',
      onlyAvail:false,
      status:   '',
      terminal: '',
      markers:  { drive:true, duty:true, off:true, load:true, plan:true }
    };

    var ICONS = {
      truck:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 17h11V6H2v11Z"/><path d="M13 10h4l4 4v3h-8v-7Z"/><circle cx="6.5" cy="19" r="1.6"/><circle cx="17.5" cy="19" r="1.6"/></svg>',
      trailer: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="18" height="10" rx="1.5"/><path d="M20 16h2"/><circle cx="7" cy="18.5" r="1.5"/><circle cx="14" cy="18.5" r="1.5"/></svg>',
      route:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 18c0-5 4-9 9-9h5"/><path d="M15 6l3 3-3 3"/></svg>',
      plus:    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>',
      users:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 20v-1.6a4 4 0 0 0-4-4h-4a4 4 0 0 0-4 4V20"/><circle cx="12" cy="7.5" r="3.5"/></svg>'
    };

    /* ---------- date helpers ---------- */
    var DAY_MS = 86400000;
    function startOfDay(d){ return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
    function addDays(d, n){ return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n); }
    function sameDay(a, b){
      return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
    }
    /* Monday-first, matching the Figma's weekday header. */
    function startOfWeek(d){
      var day = (d.getDay() + 6) % 7;
      return addDays(startOfDay(d), -day);
    }
    /* Whole days between two midnights. Computed from the rendered
       calendar dates rather than by dividing the millisecond gap, so a
       DST boundary inside the range cannot round a day away. */
    function daysBetween(a, b){
      return Math.round((startOfDay(b) - startOfDay(a)) / DAY_MS);
    }

    /* The visible range for the current view. */
    function range(){
      if(state.view === 'day'){
        var s = startOfDay(state.anchor);
        return { start:s, days:1 };
      }
      if(state.view === 'month'){
        var m = new Date(state.anchor.getFullYear(), state.anchor.getMonth(), 1);
        var n = new Date(state.anchor.getFullYear(), state.anchor.getMonth() + 1, 0).getDate();
        return { start:m, days:n };
      }
      return { start:startOfWeek(state.anchor), days:7 };
    }

    /* ---------- element helper ---------- */
    function el(tag, cls, html){
      var n = document.createElement(tag);
      if(cls) n.className = cls;
      if(html != null) n.innerHTML = html;
      return n;
    }
    function initials(name){
      /* "Harris, Lacy" and "Philip Sam" are both in the data, so split on
         the comma first and fall back to whitespace. */
      var parts = name.indexOf(',') > -1
        ? name.split(',').map(function(s){ return s.trim(); }).reverse()
        : name.split(/\s+/);
      return parts.filter(Boolean).slice(0, 2).map(function(p){ return p[0]; }).join('').toUpperCase();
    }
    function fmtTime(d){
      var h = d.getHours(), m = d.getMinutes();
      var ap = h < 12 ? 'AM' : 'PM';
      var hh = h % 12; if(hh === 0) hh = 12;
      return hh.toString().padStart(2, '0') + ':' + m.toString().padStart(2, '0') + ' ' + ap;
    }
    function fmtDay(d){ return MON_SHORT[d.getMonth()] + ' ' + d.getDate(); }
    function pad2(n){ return n < 10 ? '0' + n : '' + n; }

    /* ---------- filtering ---------- */
    function visibleDrivers(){
      var q = state.search.trim().toLowerCase();
      return DRIVERS.filter(function(d){
        if(state.onlyAvail && !d.available) return false;
        if(state.status && d.tone !== state.status) return false;
        if(state.terminal && d.loc !== state.terminal) return false;
        if(q){
          var hay = (d.name + ' ' + d.loc + ' ' + d.truck + ' ' + d.trailer).toLowerCase();
          if(hay.indexOf(q) === -1) return false;
        }
        return true;
      });
    }
    function eventsFor(driverId, r){
      var end = addDays(r.start, r.days);
      return EVENTS.filter(function(e){
        if(e.driver !== driverId) return false;
        if(!state.markers[e.kind]) return false;
        return e.end > r.start && e.start < end;   /* overlaps the range */
      }).sort(function(a, b){ return a.start - b.start || b.end - a.end; });
    }
    /* First-fit lane packing: an event goes in the topmost lane whose
       last event has already ended. This is what stacks the three
       Thursday chips in the Figma onto three separate lines. */
    function packLanes(list){
      var lanes = [];
      list.forEach(function(e){
        var i = 0;
        for(; i < lanes.length; i++){ if(lanes[i] <= e.start){ break; } }
        lanes[i] = e.end;
        e._lane = i;
      });
      return Math.max(lanes.length, 1);
    }

    /* ---------- renderers ---------- */
    var rosterList = document.getElementById('rosterList');
    var tlRows     = document.getElementById('tlRows');
    var tlDays     = document.getElementById('tlDays');
    var tlScroll   = document.getElementById('tlScroll');
    var tlInner    = document.getElementById('tlInner');

    function renderBoard(){
      var r = range();
      var drivers = visibleDrivers();

      /* --- day header --- */
      tlDays.innerHTML = '';
      tlDays.style.gridTemplateColumns = 'repeat(' + r.days + ', minmax(0, 1fr))';
      var today = new Date();
      for(var i = 0; i < r.days; i++){
        var d = addDays(r.start, i);
        var head = el('div', 'tl-dayhead');
        if(sameDay(d, today)) head.setAttribute('data-today', 'true');
        var wd = WD[(d.getDay() + 6) % 7];
        if(state.view === 'day'){
          head.appendChild(el('div', 'dh-wd', wd + 'day'));
          head.appendChild(el('div', 'dh-date', MONTHS[d.getMonth()] + ' ' + d.getDate()));
        }else{
          head.appendChild(el('div', 'dh-wd', wd));
          head.appendChild(el('div', 'dh-date', pad2(d.getMonth() + 1) + '/' + pad2(d.getDate())));
        }
        tlDays.appendChild(head);
      }

      /* --- rows --- */
      rosterList.innerHTML = '';
      tlRows.innerHTML = '';
      tlInner.style.minWidth = Math.max(875, r.days * DAY_MIN) + 'px';

      if(!drivers.length){
        rosterList.appendChild(el('div', 'roster-empty',
          '<div class="empty-icon" style="margin:0 auto">' + ICONS.users + '</div>' +
          '<h3 class="empty-title" style="margin:10px 0 0">No drivers match</h3>' +
          '<p>Clear the search or the filters to see the full roster.</p>'));
        window.dpPlannerRelayout();
        return;
      }

      var totalEvents = 0;
      drivers.forEach(function(d){
        var list  = eventsFor(d.id, r);
        var lanes = packLanes(list);
        totalEvents += list.length;

        var contentH = lanes * CHIP_H + (lanes - 1) * LANE_GAP;
        var h = Math.max(ROW_MIN, contentH + ROW_PAD * 2);

        rosterList.appendChild(driverCard(d, h));
        tlRows.appendChild(timelineRow(d, list, h, r));
      });

      document.getElementById('periodSub').textContent =
        drivers.length + (drivers.length === 1 ? ' driver' : ' drivers') +
        ' · ' + totalEvents + ' scheduled';

      window.dpPlannerRelayout();
    }

    function driverCard(d, h){
      var card = el('div', 'driver-card');
      card.style.height = h + 'px';
      card.dataset.driver = d.id;
      if(state.selected === d.id) card.classList.add('active');

      var top = el('div', 'driver-top');
      top.appendChild(el('div', 'avatar-md', initials(d.name)));
      var idb = el('div', 'driver-id');
      idb.appendChild(el('div', 'driver-name', d.name));
      idb.appendChild(el('div', 'driver-loc', d.loc));
      top.appendChild(idb);
      if(d.reserved){
        var b = el('span', 'badge', 'Reserved');
        if(d.reserved === 'danger') b.setAttribute('data-variant', 'danger');
        top.appendChild(b);
      }
      card.appendChild(top);

      card.appendChild(el('div', 'driver-equip',
        '<span class="equip">' + ICONS.truck   + d.truck   + '</span>' +
        '<span class="equip">' + ICONS.trailer + d.trailer + '</span>'));

      var foot = el('div', 'driver-foot');
      foot.appendChild(el('div', 'driver-status',
        '<span class="duty" data-tone="' + d.tone + '">' + d.duty + '</span>' +
        '<span>' + d.status + '</span>'));
      foot.querySelector('.driver-status').setAttribute('data-tone', d.tone);
      var more = el('button', 'driver-more', ICONS.route + 'More');
      more.type = 'button';
      more.addEventListener('click', function(ev){
        ev.stopPropagation();
        window.dpToast('success', d.name, 'Opening the driver’s full schedule.');
      });
      foot.appendChild(more);
      card.appendChild(foot);

      card.addEventListener('click', function(){ selectDriver(d.id); });
      return card;
    }

    function timelineRow(d, list, h, r){
      var row = el('div', 'tl-row');
      row.style.height = h + 'px';
      row.dataset.driver = d.id;
      if(state.selected === d.id) row.classList.add('active');

      var gutter = el('div', 'tl-rowgutter');
      var add = el('button', 'btn', ICONS.plus);
      add.type = 'button';
      add.setAttribute('data-variant', 'outline');
      add.setAttribute('data-size', 'icon-sm');
      add.setAttribute('aria-label', 'Add a schedule for ' + d.name);
      add.addEventListener('click', function(ev){
        ev.stopPropagation();
        window.dpToast('success', 'New schedule', 'Starting a schedule for ' + d.name + '.');
      });
      gutter.appendChild(add);
      row.appendChild(gutter);

      var lanesBox = el('div', 'tl-lanes');

      /* Today's tint sits under the chips. */
      var today = new Date();
      var ti = daysBetween(r.start, today);
      if(ti >= 0 && ti < r.days){
        var tint = el('div', 'tl-today');
        tint.style.left  = (ti / r.days * 100) + '%';
        tint.style.width = (1 / r.days * 100) + '%';
        lanesBox.appendChild(tint);
      }
      for(var i = 1; i < r.days; i++){
        var rule = el('div', 'tl-colrule');
        rule.style.left = (i / r.days * 100) + '%';
        lanesBox.appendChild(rule);
      }

      var totalMs = r.days * DAY_MS;
      list.forEach(function(e){
        var s = Math.max(e.start - r.start, 0);
        var x = Math.min(e.end - r.start, totalMs);
        var chip = el('button', 'chip');
        chip.type = 'button';
        chip.setAttribute('data-tone', e.tone);
        chip.style.left  = (s / totalMs * 100) + '%';
        chip.style.width = ((x - s) / totalMs * 100) + '%';
        chip.style.top   = (ROW_PAD + e._lane * (CHIP_H + LANE_GAP)) + 'px';

        chip.appendChild(el('span', 'chip-dot'));
        if(e.kind === 'off'){
          chip.appendChild(el('span', 'chip-a', e.title));
        }else{
          chip.appendChild(el('span', 'chip-a', e.from + ' ' + fmtTime(e.start)));
          chip.appendChild(el('span', 'chip-b', e.ref));
          chip.appendChild(el('span', 'chip-c', e.to + ' ' + fmtTime(e.end)));
        }
        chip.addEventListener('click', function(ev){
          ev.stopPropagation();
          openEventPopover(chip, e, d);
        });
        lanesBox.appendChild(chip);
      });

      row.appendChild(lanesBox);
      row.addEventListener('click', function(){ selectDriver(d.id); });
      return row;
    }

    /* Chips carry three labels and most are far too short for all three.
       The breakpoint is the chip's own PAINTED width, so it is measured
       after layout rather than guessed from the duration. */
    window.dpPlannerRelayout = function(){
      var chips = tlRows.querySelectorAll('.chip');
      for(var i = 0; i < chips.length; i++){
        var w = chips[i].getBoundingClientRect().width;
        chips[i].setAttribute('data-fit', w >= 250 ? 'full' : (w >= 140 ? 'mid' : 'min'));
      }
    };

    function selectDriver(id){
      state.selected = state.selected === id ? null : id;
      [rosterList, tlRows].forEach(function(root){
        root.querySelectorAll('[data-driver]').forEach(function(n){
          n.classList.toggle('active', n.dataset.driver === state.selected);
        });
      });
    }

    /* ---------- popover ---------- */
    var openPop = null;
    function closePop(){ if(openPop){ openPop.remove(); openPop = null; } }

    function openEventPopover(trigger, e, d){
      var wasOpen = openPop && openPop.dataset.for === e.id;
      closePop();
      if(wasOpen) return;

      var pop = el('div', 'pop');
      pop.dataset.for = e.id;
      var span = e.kind === 'off'
        ? fmtDay(e.start) + ' – ' + fmtDay(addDays(e.end, -1))
        : fmtDay(e.start) + ' ' + fmtTime(e.start) + ' – ' + fmtDay(e.end) + ' ' + fmtTime(e.end);

      var rows = e.kind === 'off'
        ? [['Driver', d.name], ['Unit', d.truck + ' / ' + d.trailer], ['Window', span]]
        : [['Driver', d.name], ['Reference', e.ref], ['Origin', e.from], ['Destination', e.to],
           ['Window', span], ['Unit', d.truck + ' / ' + d.trailer]];

      pop.innerHTML =
        '<div class="pop-head">' +
          '<div><h4 class="pop-title">' + (e.kind === 'off' ? e.title : e.ref) + '</h4>' +
          '<p class="pop-sub">' + (e.kind === 'off' ? 'Time off' : e.from + ' → ' + e.to) + '</p></div>' +
          '<span class="badge" data-variant="' +
            ({ green:'success', orange:'warning', blue:'info', red:'danger', slate:'' })[e.tone] +
          '">' + ({ drive:'Drive', duty:'On duty', off:'Off', load:'Sleeper', plan:'Planned' })[e.kind] + '</span>' +
        '</div>' +
        '<div class="pop-body">' + rows.map(function(kv){
          return '<div class="pop-row"><span class="pop-key">' + kv[0] +
                 '</span><span class="pop-val">' + kv[1] + '</span></div>';
        }).join('') + '</div>' +
        '<div class="pop-foot">' +
          '<button class="btn" data-variant="outline" data-size="sm" data-act="close">Close</button>' +
          '<button class="btn" data-size="sm" data-act="open">Open load</button>' +
        '</div>';

      /* Appended to <body>, not into the row: .roster-list carries a
         transform for scroll sync, and any transformed ancestor would
         become the containing block for this position:fixed panel and
         throw the placement below off entirely. */
      document.body.appendChild(pop);
      openPop = pop;

      pop.querySelector('[data-act="close"]').addEventListener('click', closePop);
      pop.querySelector('[data-act="open"]').addEventListener('click', function(){
        closePop();
        window.dpToast('success', e.ref || 'Time off', 'Opening the record for ' + d.name + '.');
      });
      pop.addEventListener('click', function(ev){ ev.stopPropagation(); });

      placePop(trigger, pop);
    }

    /* getBoundingClientRect() and innerWidth/Height are true screen
       pixels, but the panel lives inside the page's zoom:0.8 and so
       re-scales whatever px we assign it. Dividing by the ambient zoom
       cancels that out - the same compensation the pay-profile
       dropdowns use. */
    function placePop(trigger, pop){
      var zoom = parseFloat(getComputedStyle(document.body).zoom) || 1;
      var r = trigger.getBoundingClientRect();
      var w = pop.offsetWidth * zoom;
      var h = pop.offsetHeight * zoom;

      var left = r.left;
      if(left + w > window.innerWidth - 10) left = window.innerWidth - w - 10;
      if(left < 10) left = 10;

      var top = r.bottom + 5;
      if(top + h > window.innerHeight - 10 && r.top - h - 5 > 10) top = r.top - h - 5;

      pop.style.left = (left / zoom) + 'px';
      pop.style.top  = (top  / zoom) + 'px';
    }

    document.addEventListener('click', closePop);
    window.addEventListener('keydown', function(e){ if(e.key === 'Escape') closePop(); });

    /* ---------- calendar ---------- */
    var calDays = document.getElementById('calDays');
    document.getElementById('calWeekdays').innerHTML =
      WD.map(function(w){ return '<div class="cal-wd">' + w + '</div>'; }).join('');

    function renderCalendar(){
      var m = state.calMonth;
      document.getElementById('calLabel').textContent = MONTHS[m.getMonth()] + ' ' + m.getFullYear();

      var first = new Date(m.getFullYear(), m.getMonth(), 1);
      var gridStart = startOfWeek(first);
      var r = range();
      var rangeEnd = addDays(r.start, r.days - 1);
      var today = new Date();

      calDays.innerHTML = '';
      for(var i = 0; i < 42; i++){
        var d = addDays(gridStart, i);
        var cell = el('div', 'cal-cell');
        var isStart = sameDay(d, r.start);
        var isEnd   = sameDay(d, rangeEnd);
        var inside  = d >= r.start && d <= rangeEnd;

        if(inside){
          cell.setAttribute('data-range',
            r.days === 1 ? 'solo' : (isStart ? 'start' : (isEnd ? 'end' : 'mid')));
        }

        var btn = el('button', 'cal-day', String(d.getDate()));
        btn.type = 'button';
        if(d.getMonth() !== m.getMonth()) btn.setAttribute('data-outside', 'true');
        if(sameDay(d, today)) btn.setAttribute('data-today', 'true');
        if(isStart || isEnd) btn.setAttribute('data-selected', 'true');

        (function(day){
          btn.addEventListener('click', function(){
            state.anchor = day;
            if(day.getMonth() !== state.calMonth.getMonth()){
              state.calMonth = new Date(day.getFullYear(), day.getMonth(), 1);
            }
            syncAll();
          });
        })(d);

        cell.appendChild(btn);
        calDays.appendChild(cell);
      }
    }

    /* ---------- rail lists ---------- */
    function renderReminders(){
      var box = document.getElementById('reminderList');
      box.innerHTML = '';
      REMINDERS.forEach(function(rm){
        var item = el('div', 'rem-item');
        item.innerHTML =
          '<div class="rem-head">' +
            '<div class="avatar-sm">' + initials(rm.name) + '</div>' +
            '<div style="min-width:0">' +
              '<div class="rem-name">' + rm.name + '</div>' +
              '<div class="rem-sub">' + rm.sub + '</div>' +
            '</div>' +
          '</div>' +
          '<div class="route">' +
            '<span class="route-node">' + rm.stops[0] + '</span>' +
            '<span class="route-line"></span>' +
            '<span class="route-node" data-end="true">' + rm.stops[1] + '</span>' +
          '</div>' +
          '<div class="route-ends">' +
            '<div class="route-end"><div class="route-place">' + rm.from + '</div>' +
              '<div class="route-when">' + rm.fromAt + '</div></div>' +
            '<div class="route-end" data-align="end"><div class="route-place">' + rm.to + '</div>' +
              '<div class="route-when">' + rm.toAt + '</div></div>' +
          '</div>';
        box.appendChild(item);
      });
      document.getElementById('reminderCount').textContent = REMINDERS.length;
    }

    function renderMarkers(){
      var box = document.getElementById('markerList');
      box.innerHTML = '';
      MARKERS.forEach(function(mk){
        var row = el('div', 'marker-row');
        var dot = el('span', 'marker-dot');
        dot.style.background = mk.dot;
        row.appendChild(dot);
        row.appendChild(el('span', 'marker-label', mk.label));

        var sw = el('button', 'switch', '<span class="switch-thumb"></span>');
        sw.type = 'button';
        sw.setAttribute('role', 'switch');
        sw.setAttribute('aria-label', mk.label);
        sw.setAttribute('aria-checked', state.markers[mk.kind] ? 'true' : 'false');
        sw.addEventListener('click', function(){
          state.markers[mk.kind] = !state.markers[mk.kind];
          sw.setAttribute('aria-checked', state.markers[mk.kind] ? 'true' : 'false');
          renderBoard();
        });
        row.appendChild(sw);
        box.appendChild(row);
      });
    }

    /* ---------- toolbar ---------- */
    function syncAll(){
      var r = range();
      var end = addDays(r.start, r.days - 1);
      var title = document.getElementById('periodTitle');

      if(state.view === 'day'){
        title.textContent = WD[(r.start.getDay() + 6) % 7] + ', ' + fmtDay(r.start) + ', ' + r.start.getFullYear();
      }else if(state.view === 'month'){
        title.textContent = MONTHS[r.start.getMonth()] + ' ' + r.start.getFullYear();
      }else{
        title.textContent = (r.start.getMonth() === end.getMonth())
          ? MON_SHORT[r.start.getMonth()] + ' ' + r.start.getDate() + ' – ' + end.getDate() + ', ' + end.getFullYear()
          : fmtDay(r.start) + ' – ' + fmtDay(end) + ', ' + end.getFullYear();
      }

      document.getElementById('rangeField').value =
        fmtDay(r.start) + ', ' + r.start.getFullYear() + '  -  ' + fmtDay(end) + ', ' + end.getFullYear();

      state.calMonth = new Date(r.start.getFullYear(), r.start.getMonth(), 1);
      renderCalendar();
      renderBoard();
    }

    function step(dir){
      if(state.view === 'day')        state.anchor = addDays(state.anchor, dir);
      else if(state.view === 'month') state.anchor = new Date(state.anchor.getFullYear(), state.anchor.getMonth() + dir, 1);
      else                            state.anchor = addDays(state.anchor, dir * 7);
      syncAll();
    }

    document.getElementById('btnPrev').addEventListener('click', function(){ step(-1); });
    document.getElementById('btnNext').addEventListener('click', function(){ step(1); });
    document.getElementById('btnToday').addEventListener('click', function(){
      state.anchor = startOfDay(new Date());
      syncAll();
    });
    document.getElementById('calPrev').addEventListener('click', function(){
      state.calMonth = new Date(state.calMonth.getFullYear(), state.calMonth.getMonth() - 1, 1);
      renderCalendar();
    });
    document.getElementById('calNext').addEventListener('click', function(){
      state.calMonth = new Date(state.calMonth.getFullYear(), state.calMonth.getMonth() + 1, 1);
      renderCalendar();
    });

    document.getElementById('viewSwitch').addEventListener('segchange', function(e){
      state.view = e.detail.button.dataset.view;
      syncAll();
    });

    document.getElementById('btnNewSchedule').addEventListener('click', function(){
      window.dpToast('success', 'New schedule', 'Pick a driver row to place the new schedule on.');
    });
    document.getElementById('btnAddSchedule').addEventListener('click', function(){
      window.dpToast('success', 'Add', 'Adding a planning entry to the selected range.');
    });

    var moreBtn = document.getElementById('btnMoreFilters');
    var extra   = document.getElementById('filterExtra');
    moreBtn.addEventListener('click', function(){
      var open = extra.hidden;
      extra.hidden = !open;
      moreBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
    });

    document.getElementById('driverSearch').addEventListener('input', function(){
      state.search = this.value; renderBoard();
    });
    document.getElementById('onlyAvailable').addEventListener('change', function(){
      state.onlyAvail = this.checked; renderBoard();
    });
    document.getElementById('fltStatus').addEventListener('change', function(){
      state.status = this.value; renderBoard();
    });
    document.getElementById('fltFleet').addEventListener('change', function(){
      state.terminal = this.value; renderBoard();
    });

    /* ---------- scroll sync ----------
       The timeline is the scroller; the roster mirrors it so a driver
       card always sits beside its own row. translateY rather than
       scrollTop so the two cannot fight each other over a rounding
       difference and oscillate. */
    tlScroll.addEventListener('scroll', function(){
      rosterList.style.transform = 'translateY(' + (-tlScroll.scrollTop) + 'px)';
      closePop();
    }, { passive:true });
    document.getElementById('rosterScroll').addEventListener('wheel', function(e){
      tlScroll.scrollTop += e.deltaY;
      e.preventDefault();
    }, { passive:false });

    window.addEventListener('resize', function(){ window.dpPlannerRelayout(); closePop(); });

    /* ---------- boot ---------- */
    renderReminders();
    renderMarkers();
    syncAll();
  })();
  </script>
</body>
</html>
